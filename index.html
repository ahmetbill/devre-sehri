function fbTask(stage,api){const Es=13;let mode=0,tries=0;
  stage.innerHTML=L_(`<svg class="g" viewBox="0 0 600 420" style="max-height:42vh"></svg><div class="tools">${segRow('fm',['Negatif geri besleme','Pozitif geri besleme'])}</div>
   <div class="tools">${rangeRow('vi','v<sub>in</sub> =',-20,20,1,5,' V')}</div><div class="status" id="sol"></div>
   <div class="chq"><div class="qtext" style="font-size:16px;margin:6px 0">E<sub>sat</sub> = 13 V. Grafikten oku:</div></div>
   <div class="tools"><label class="qa">Negatif, v<sub>in</sub> = 5 V → v<sub>o</sub> = <input class="numin sm"></label><label class="qa">Pozitif, v<sub>in</sub> = 5 V → çözüm sayısı = <input class="numin sm"></label><label class="qa">Pozitif, v<sub>in</sub> = 20 V → v<sub>o</sub> = <input class="numin sm"></label><button class="btn" id="chk">Kontrol et</button></div>`,`<svg class="g" viewBox="0 0 600 420" style="max-height:42vh"></svg><div class="tools">${segRow('fm',['Negative feedback','Positive feedback'])}</div>
   <div class="tools">${rangeRow('vi','v<sub>in</sub> =',-20,20,1,5,' V')}</div><div class="status" id="sol"></div>
   <div class="chq"><div class="qtext" style="font-size:16px;margin:6px 0">E<sub>sat</sub> = 13 V. Read from the plot:</div></div>
   <div class="tools"><label class="qa">Negative, v<sub>in</sub> = 5 V → v<sub>o</sub> = <input class="numin sm"></label><label class="qa">Positive, v<sub>in</sub> = 5 V → number of solutions = <input class="numin sm"></label><label class="qa">Positive, v<sub>in</sub> = 20 V → v<sub>o</sub> = <input class="numin sm"></label><button class="btn" id="chk">Check</button></div>`);
  const svg=stage.querySelector('svg'),sol=stage.querySelector('#sol'),vi=stage.querySelector('#vi');
  const P=plotter({xr:[-20,20],yr:[-16,16],xl:T('v','in'),yl:T('v','o'),step:5,ystep:4,id:'pf'});
  function sols(v){if(mode===0)return [[Math.max(-Es,Math.min(Es,v)),Math.abs(v)<Es?'lineer':v>0?L_('+ doyma',`+ saturation`):L_('− doyma',`− saturation`)]];
    const r=[];if(Math.abs(v)<Es)r.push([v,'lineer']);if(v<Es)r.push([Es,L_('+ doyma',`+ saturation`)]);if(v>-Es)r.push([-Es,L_('− doyma',`− saturation`)]);return r}
  function draw(){const v=+vi.value;stage.querySelector('#vio').textContent=v+' V';
    let h=P.base+P.vl(v);
    h+=mode===0?P.pl([[-20,-13],[-13,-13],[13,13],[20,13]],'s2'):P.pl([[-13,-13],[13,13]],'s3')+P.pl([[-20,13],[13,13]],'s1')+P.pl([[-13,-13],[20,-13]],'s1');
    const S_=sols(v);S_.forEach(([y])=>h+=P.dot(v,y,'q'));
    svg.innerHTML=h;
    sol.innerHTML=L_(`v<sub>in</sub> = ${v} V → <b>${S_.length} çözüm</b>: `,`v<sub>in</sub> = ${v} V → <b>${S_.length} solution(s)</b>:`)+S_.map(([y,n])=>`<span class="chip">v<sub>o</sub> = ${y} V (${n})</span>`).join('')+
      (mode===1?L_('<br><small>Her bölge için: varsay → çöz → koşulu kontrol et (lineer: |v<sub>o</sub>| &lt; E<sub>sat</sub>, +doyma: v<sub>d</sub> = E<sub>sat</sub> − v<sub>in</sub> &gt; 0, −doyma: v<sub>d</sub> = −E<sub>sat</sub> − v<sub>in</sub> &lt; 0).</small>',`<br><small>For each region: assume → solve → check the condition (linear: |v<sub>o</sub>| &lt; E<sub>sat</sub>, +sat: v<sub>d</sub> = E<sub>sat</sub> − v<sub>in</sub> &gt; 0, −sat: v<sub>d</sub> = −E<sub>sat</sub> − v<sub>in</sub> &lt; 0).</small>`):'')}
  vi.oninput=draw;bindSeg(stage,'fm',k=>{mode=k;draw()});
  const ins=[...stage.querySelectorAll('input.numin')];
  stage.querySelector('#chk').onclick=()=>{const xs=ins.map(x=>parseNum(x.value));if(xs.some(isNaN)){fb(L_('Üç kutuya da sayı yaz.',`Type a number in all three boxes.`),'info');return}
    const ans=[5,3,-13],w=xs.map((x,j)=>!near(x,ans[j],.01));ins.forEach((x,j)=>x.style.borderColor=w[j]?'var(--bad)':'var(--ok)');
    if(!w.some(Boolean)){api.done();fb(L_('✅ Negatif geri besleme: tek çözüm v<sub>o</sub> = 5 V. Pozitif: |v<sub>in</sub>| &lt; E<sub>sat</sub> iken <b>3 çözüm</b> (5, 13, −13). v<sub>in</sub> = 20 V\'ta tuzak: + doyma için v<sub>d</sub> = 13 − 20 &lt; 0 olur, tutmaz; sadece <b>− doyma</b> (v<sub>o</sub> = −13 V) kalır!',`✅ Negative feedback: unique solution v<sub>o</sub> = 5 V. Positive: for |v<sub>in</sub>| &lt; E<sub>sat</sub> there are <b>3 solutions</b> (5, 13, −13). The trap at v<sub>in</sub> = 20 V: + saturation would need v<sub>d</sub> = 13 − 20 &lt; 0, which fails; only <b>− saturation</b> (v<sub>o</sub> = −13 V) remains!`),'ok')}
    else{api.mistake();tries++;fb(tries<2?L_('🤔 Sürgüyü ilgili v<sub>in</sub> değerine getir ve doğru modu seç, kırmızı noktaları say.',`🤔 Move the slider to the relevant v<sub>in</sub>, choose the right mode and count the red dots.`):L_('🤔 Cevap: 5, 3, −13. Pozitif modda v<sub>in</sub> = 20\'ye bak.',`🤔 Answer: 5, 3, −13. In positive mode look at v<sub>in</sub> = 20.`),'bad')}};
  draw()}

function vNodeSteps(stage){stage.innerHTML=L_(`<div class="flow">

  <div class="fcard c5" style="margin:0 10px"><span class="em">✍️</span>Elle kısayol: Ĝ<sub>kk</sub> = k düğümüne bağlı iletkenliklerin toplamı · Ĝ<sub>kj</sub> = −(k ile j arasındaki iletkenlik) · i<sub>b,k</sub> = kaynaklardan k düğümüne <b>giren</b> akım</div>`,`<div class="flow">
  <div class="fcard c3"><span class="em">1️⃣</span>KCL<small>A·i = 0</small></div>

  <div class="fcard c1"><span class="em">3️⃣</span>Substitute KVL<small>v = Aᵀe<br>A G<sub>d</sub> Aᵀ e = −A i<sub>k</sub></small></div>

  h+=SC.w([[L,mid],[L,215]])+SC.resV(L,245)+SC.w([[L,275],[L,bot]])+SC.w([[R,mid],[R,215]])+SC.resV(R,245)+SC.w([[R,275],[R,bot]]);
  h+=SC.w([[M,mid],[M,225]])+SC.src(M,255,'up')+SC.w([[M,285],[M,bot]])+SC.w([[L,bot],[R,bot]]);
  h+=SC.t(195,mid-20,`${T('R','2')} = 2 Ω`)+SC.t(405,mid-20,`${T('R','3')} = 3 Ω`)+SC.t(L+24,250,`${T('R','1')} = 1 Ω`,'cname','start')+SC.t(R-24,250,`${T('R','4')} = 7 Ω`,'cname','end')+SC.t(M+28,262,`${T('I','s1')} = 10 A`,'cname','start');

  svg.innerHTML=h}

function vNodeLA(stage){const A=Aa(G4),G=GD4.map((g,i)=>GD4.map((_,j)=>i===j?g:0));
  stage.innerHTML=`<div class="tools">${segRow('gm',[L_('A (referans d silindi)','A (datum d deleted)'),L_('Aₐ (tüm düğümler)','Aₐ (all nodes)')])}</div><div id="gg" style="text-align:center"></div>`;
  const gg=stage.querySelector('#gg');
  function draw(k){const AA=k===0?A.slice(0,3):A,Gh=matMul(matMul(AA,G),matT(AA)),dt=det(Gh),sym=Gh.every((r,i)=>r.every((x,j)=>Math.abs(x-Gh[j][i])<1e-9));
    gg.innerHTML=mxShow(k===0?'A (3 × 6)':'Aₐ (4 × 6)',AA)+`<div class="mxshow"><div class="t">G<sub>d</sub></div><div style="font-weight:800;margin-top:10px">diag(1, 1/2, 1/3, 1/7, 0, 0)</div></div>`+
      mxN(`Ĝ = A G<sub>d</sub> Aᵀ (${AA.length} × ${AA.length})`,Gh,{cls:(i,j)=>i===j?'eq':''})+
      L_(`<div class="status">simetrik: <b>${sym?'evet ✅':'hayır'}</b> · det Ĝ = <b style="color:${Math.abs(dt)>1e-9?'var(--ok)':'var(--bad)'}">${frac(dt)}</b>${k===1?' · satır toplamları: '+Gh.map(r=>frac(r.reduce((s,x)=>s+x,0))).join(', ')+' → <b style="color:var(--bad)">tekil</b>: e\'nin hepsine aynı sabiti eklesen de denklemler sağlanır (referans yok!)':' → <b style="color:var(--ok)">tersinir</b>, tek çözüm'}</div>`,`<div class="status">symmetric: <b>${sym?'yes ✅':'no'}</b> · det Ĝ = <b style="color:${Math.abs(dt)>1e-9?'var(--ok)':'var(--bad)'}">${frac(dt)}</b>${k===1?' · row sums: '+Gh.map(r=>frac(r.reduce((s,x)=>s+x,0))).join(', ')+' → <b style="color:var(--bad)">singular</b>: adding the same constant to every e still satisfies the equations (no datum!)':' → <b style="color:var(--ok)">invertible</b>, unique solution'}</div>`)}
  bindSeg(stage,'gm',draw);draw(0)}

const CHAPTERS=[
/* ---------------- 1 ---------------- */
{id:'c1',icon:'⚡',title:L_('Akım, Gerilim ve KGY',`Current, Voltage and KVL`),sub:L_('Ders 1',`Lecture 1`),pos:[9,18],steps:[
 {type:'talk',visual:vFlow,
  say:L_(`Merhaba! Ben <b>Eli</b>, minicik bir elektronum ⚡<br>Bu dersin amacı: <b>fiziksel devrelerin elektriksel davranışını öngörmek</b>, yani her elemandaki <b>akımı</b> ve <b>gerilimi</b> bulmak.<br><br>Teori kurarken önce <b>tanımlanmamış büyüklüklerle</b> başlarız (akım, gerilim), sonra <b>aksiyomlar</b> koyarız. Ardından gelen her şey <b>tanım</b> ya da <b>teorem</b>dir.`,`Hi! I'm <b>Eli</b>, a tiny electron ⚡<br>The goal of this course: <b>predict the electrical behavior of physical circuits</b>, i.e. find the <b>current</b> and <b>voltage</b> of every element.<br><br>When building the theory we start with <b>undefined quantities</b> (current, voltage), then postulate <b>axioms</b>. Everything after that is a <b>definition</b> or a <b>theorem</b>.`),
  formal:L_(`<b>Tanımlanmamış büyüklükler:</b> akım i(t) [A], gerilim v(t) [V].<br><b>Aksiyom 1 (Toplu parametreli devre):</b> Fiziksel devrede her aletin uçlarındaki akım i(t) ve gerilim v(t) her t anında tam olarak tanımlanmışsa, devre toplu parametreli devredir.`,`<b>Undefined quantities:</b> current i(t) [A], voltage v(t) [V].<br><b>Axiom 1 (Lumped circuit):</b> If the current i(t) and voltage v(t) at the terminals of every device in a physical circuit are well defined at every instant t, the circuit is a lumped circuit.`)},
 {type:'talk',visual:vPair,
  say:L_(`Akımı ve gerilimi ölçmeden önce <b>yön seçmek</b> zorundayız. Seçim keyfi ama ikisini birbirine bağlayan bir kural var:<br><br><span class="k">Uyumlu çift</span>: akım okunun elemana <b>+</b> işaretli uçtan <b>girmesi</b>.<br><br>Bu kuralla p(t) = v(t)·i(t), devrenin elemana aktardığı <b>ani güç</b> olur. p > 0 ise eleman güç <b>alıyor</b>, p < 0 ise güç <b>veriyor</b>.`,`Before measuring current and voltage we must <b>choose reference directions</b>. The choice is arbitrary, but there is a rule tying the two together:<br><br><span class="k">Associated reference directions</span>: the current arrow <b>enters</b> the element at the terminal marked <b>+</b>.<br><br>With this rule p(t) = v(t)·i(t) is the <b>instantaneous power</b> delivered to the element by the circuit. If p > 0 the element <b>absorbs</b> power, if p < 0 it <b>delivers</b> power.`),
  formal:L_(`<b>Ani güç:</b> p(t) = v(t)·i(t) [W]. Uyumlu çift seçildiğinde p(t), t anında elemanın bağlı olduğu devre tarafından elemana aktarılan güçtür.`,`<b>Instantaneous power:</b> p(t) = v(t)·i(t) [W]. With associated reference directions, p(t) is the power delivered at time t to the element by the circuit it is connected to.`)},
 {type:'task',setup:pairTask,say:L_(`Sıra sende! Elemanın <b>+</b> ucu nerede, bak. Sonra mavi <b>akım okuna</b> tıklayıp yönünü çevirerek <b>uyumlu çift</b> yap ve "Kontrol et"e bas. (3 tur)`,`Your turn! Look where the element's <b>+</b> terminal is. Then click the blue <b>current arrow</b> to flip it until the directions are <b>associated</b>, and press "Check". (3 rounds)`)},
 {type:'talk',visual:vNodeV,
  say:L_(`Şimdi <b>düğüm gerilimleri</b>:<br>① n düğümlü bir devrede bir düğümü <b>referans</b> seç (toprak, e = 0).<br>② Diğer <b>n − 1</b> düğümün referansa göre gerilimine düğüm gerilimi denir: ${S('e','a')}, ${S('e','b')}, …<br>③ İki düğüm arası gerilim: <span class="k">${S('v','kj')} = ${S('e','k')} − ${S('e','j')}</span><br><br>Bu sonuncusu aslında <b>KGY</b>'nin ta kendisi!`,`Now <b>node voltages</b>:<br>① In an n-node circuit pick one node as the <b>datum</b> (ground, e = 0).<br>② The voltage of each of the other <b>n − 1</b> nodes with respect to the datum is a node voltage: ${S('e','a')}, ${S('e','b')}, …<br>③ The voltage between two nodes: <span class="k">${S('v','kj')} = ${S('e','k')} − ${S('e','j')}</span><br><br>That last one is <b>KVL</b> itself!`),
  formal:L_(`<b>Aksiyom 2: KGY (düğüm gerilimleri cinsinden).</b> Tüm toplu parametreli birleşik devrelerde, referans düğümü keyfi seçilmek üzere, tüm k, j düğüm çiftleri için her t anında ${S('v','kj')}(t) = ${S('e','k')}(t) − ${S('e','j')}(t) bağıntısı geçerlidir.`,`<b>Axiom 2: KVL (node-voltage form).</b> For all lumped connected circuits, for any choice of datum node, for all pairs of nodes k, j and at all times t: ${S('v','kj')}(t) = ${S('e','k')}(t) − ${S('e','j')}(t).`)},
 {type:'task',setup:kgyWalkTask,
  say:L_(`<b>KGY yürüyüşü!</b> Düğümlere sırayla tıkla ve başladığın düğüme geri dönerek bir <b>kapalı düğüm dizisi</b> oluştur (ör. a → b → c → a). Ben her adımın gerilimini yazacağım.<br><br>💡 Sürpriz: ardışık düğümler arasında <b>eleman olması gerekmez</b>! İki farklı kapalı dizi bul.`,`<b>KVL walk!</b> Click nodes one by one and return to the start to form a <b>closed node sequence</b> (e.g. a → b → c → a). I'll write the voltage of each step.<br><br>💡 Surprise: consecutive nodes do <b>not</b> need an element between them! Find two different closed sequences.`),
  formal:L_(`<b>KGY (kapalı düğüm dizileri cinsinden):</b> Tüm toplu parametreli birleşik devrelerde, tüm kapalı düğüm dizileri için ve her t anında, seçilen herhangi bir kapalı düğüm dizisinde düğümden düğüme gerilimlerin cebirsel toplamı sıfırdır.<br><b>Teorem:</b> Düğüm gerilimleri cinsinden KGY ⇔ Kapalı düğüm dizileri cinsinden KGY.`,`<b>KVL (closed-node-sequence form):</b> For all lumped connected circuits, for all closed node sequences and at all times t, the algebraic sum of the node-to-node voltages around any closed node sequence is zero.<br><b>Theorem:</b> KVL in node-voltage form ⇔ KVL in closed-node-sequence form.`)},
 {type:'quiz',say:L_(`Mini sınav zamanı! 📝 Yanlış yaparsan dert etme, açıklamayı oku ve tekrar dene.`,`Mini quiz time! 📝 Don't worry about mistakes; read the explanation and try again.`),questions:[
  {q:L_('6 düğümlü birleşik bir devrede kaç düğüm gerilimi tanımlanır?',`How many node voltages are defined in a connected circuit with 6 nodes?`),opts:['5','6','7','1'],a:0,why:L_('Bir düğüm referans (e = 0) olur, geriye n − 1 = 5 düğüm gerilimi kalır.',`One node is the datum (e = 0), leaving n − 1 = 5 node voltages.`),hint:L_('Referans düğümü unutma!',`Don't forget the datum node!`)},
  {q:L_(`Referans düğüm c seçildi. ${S('v','ac')} neye eşittir?`,`Node c is chosen as datum. What is ${S('v','ac')} equal to?`),opts:[S('e','a'),`−${S('e','a')}`,'0',S('e','c')],a:0,why:`${S('v','ac')} = ${S('e','a')} − ${S('e','c')} = ${S('e','a')} − 0 = ${S('e','a')}.`},
  {q:L_('Uyumlu çift seçilmiş bir elemanda t₁ anında i = −5 A ve v = −32 V. Eleman ne yapıyor?',`For an element with associated reference directions, at t₁: i = −5 A and v = −32 V. What is the element doing?`),opts:[L_('160 W güç alıyor',`Absorbing 160 W`),L_('160 W güç veriyor',`Delivering 160 W`),L_('37 W güç alıyor',`Absorbing 37 W`),'Belirlenemez'],a:0,why:L_('p = v·i = (−32)(−5) = +160 W > 0 → eleman güç alıyor.',`p = v·i = (−32)(−5) = +160 W > 0 → the element absorbs power.`)},
  {q:L_(`a-b-c-d-a kapalı düğüm dizisi için ${S('v','ab')} + ${S('v','bc')} + ${S('v','cd')} + ${S('v','da')} = ?`,`For the closed node sequence a-b-c-d-a, ${S('v','ab')} + ${S('v','bc')} + ${S('v','cd')} + ${S('v','da')} = ?`),opts:['0',S('e','a'),`2${S('e','a')}`,L_('Elemanlara bağlı',`Depends on the elements`)],a:0,why:L_('Her düğüm gerilimi bir kez +, bir kez − geçer; hepsi sadeleşir → 0.',`Each node voltage appears once with + and once with −; everything cancels → 0.`)},
  {q:L_('Kapalı düğüm dizisinde ardışık iki düğüm arasında mutlaka bir eleman bulunmalı mı?',`In a closed node sequence, must there be an element between consecutive nodes?`),opts:[L_('Hayır, herhangi düğümler olabilir',`No, any nodes will do`),L_('Evet, yoksa KGY yazılamaz',`Yes, otherwise KVL cannot be written`)],a:0,why:L_('KGY düğüm gerilimlerinden çıkar ve herhangi düğüm çiftleri için geçerlidir.',`KVL follows from node voltages and holds for any pair of nodes.`)}
 ]}
]},
/* ---------------- 2 ---------------- */
{id:'c2',icon:'🎈',title:L_('KAY, Gauss Yüzeyi ve Uç-Grafı',`KCL, Gaussian Surfaces and Terminal Graphs`),sub:L_('Ders 2',`Lecture 2`),pos:[29,23],steps:[
 {type:'talk',visual:vKAY,
  say:L_(`<b>KAY</b>: Elektrik yükü düğümde birikmez. Ne girerse o çıkar!<br><br>Kural: bir düğümden <b>çıkan</b> akımların <b>cebirsel</b> toplamı sıfırdır. "Cebirsel" demek: çıkan akımı <b>+</b>, gireni <b>−</b> yaz.`,`<b>KCL</b>: electric charge does not accumulate at a node. What goes in comes out!<br><br>Rule: the <b>algebraic</b> sum of the currents <b>leaving</b> a node is zero. "Algebraic" means: write leaving currents with <b>+</b>, entering ones with <b>−</b>.`),
  formal:L_(`<b>Aksiyom 3: KAY (düğümler için).</b> Tüm toplu parametreli birleşik devrelerde, her t anında, herhangi bir düğümden çıkan akımların cebirsel toplamı sıfırdır.`,`<b>Axiom 3: KCL (for nodes).</b> For all lumped connected circuits, at all times t, the algebraic sum of the currents leaving any node is zero.`)},
 {type:'task',setup:kayNodeTask,say:L_(`Bilinmeyen akımı bul! Okların yönüne dikkat et: düğümden <b>dışarı</b> bakan ok çıkan akım (+), düğüme <b>doğru</b> bakan ok giren akım (−). Akım değeri negatif olabilir, sorun değil. (3 tur)`,`Find the unknown current! Watch the arrow directions: an arrow pointing <b>away</b> from the node is a leaving current (+), one pointing <b>toward</b> it is entering (−). The value may be negative, that's fine. (3 rounds)`)},
 {type:'talk',visual:vGaussEx,
  say:L_(`Şimdi düğümü bir <b>balon</b> 🎈 gibi şişir!<br><br><span class="k">Gauss yüzeyi</span>: içi ve dışı belli olan, <b>sadece bağlantıları</b> (çizgileri) kesen kapalı bir yüzey. Yüzeyi kesen akımların cebirsel toplamı da <b>sıfır</b>.<br><br>Tek bir düğümü saran küçük balon = düğüm için KAY. Yani düğüm KAY'ı, Gauss KAY'ının özel bir hâli.`,`Now inflate the node like a <b>balloon</b> 🎈!<br><br><span class="k">Gaussian surface</span>: a closed surface with a well-defined inside and outside that cuts <b>only connections</b> (wires). The algebraic sum of the currents crossing it is also <b>zero</b>.<br><br>A small balloon around a single node = KCL for that node. So node KCL is a special case of Gaussian-surface KCL.`),
  formal:L_(`<b>KAY (Gauss yüzeyleri için):</b> Tüm toplu parametreli devrelerde, tüm Gauss yüzeyleri için her t anında Gauss yüzeyini kesen akımların cebirsel toplamı sıfırdır.<br><b>Gauss yüzeyi:</b> içi ve dışı tanımlı, sadece devre elemanlarını birleştiren bağlantıları kesecek şekilde çizilmiş yüzey.`,`<b>KCL (for Gaussian surfaces):</b> For all lumped circuits, for all Gaussian surfaces and at all times t, the algebraic sum of the currents crossing the surface is zero.<br><b>Gaussian surface:</b> a surface with a defined inside and outside, drawn so that it cuts only the connections between circuit elements.`)},
 {type:'task',setup:gaussTask,say:L_(`Fareyle <b>balon çiz</b>! Basılı tutarak bir veya birkaç düğümün etrafını çevir. Ben kestiğin çizgileri bulup KAY denklemini yazacağım. <b>3 farklı</b> yüzey çiz.`,`<b>Draw a balloon</b> with the mouse (or finger)! Hold and drag around one or more nodes. I'll find the cut branches and write the KCL equation. Draw <b>3 different</b> surfaces.`)},
 {type:'talk',visual:vTermGraph,
  say:L_(`Devreyi sadeleştirelim: <b>graf</b>! 1736'da Euler, Königsberg'in 7 köprüsü problemini graf ile çözdü.<br><br><span class="k">Graf</span> = düğüm kümesi + çizgi kümesi. Devre graflarında çizgiler <b>yönlüdür</b>.<br><br>2-uçlu bir eleman tek bir <b>ok</b> olur. Neden sadece ok yeter? Çünkü uyumlu çift seçtik: ok akımın yönünü verir, <b>+</b> uç da okun kuyruğundadır.`,`Let's simplify the circuit: a <b>graph</b>! In 1736 Euler solved the Seven Bridges of Königsberg problem with a graph.<br><br><span class="k">Graph</span> = a set of nodes + a set of branches. In circuit graphs the branches are <b>directed</b>.<br><br>A 2-terminal element becomes a single <b>arrow</b>. Why is one arrow enough? Because we use associated reference directions: the arrow gives the current direction and the <b>+</b> terminal is at the arrow's tail.`),
  formal:L_(`<b>Graf:</b> G = (düğüm kümesi, çizgi kümesi). Elektrik devrelerine ilişkin çizeceğimiz graflarda çizgi yönlüdür.<br><b>Uç-grafı:</b> bir elemanın uç akımlarını ve gerilimlerini gösteren graf.`,`<b>Graph:</b> G = (node set, branch set). The graphs we draw for electric circuits have directed branches.<br><b>Terminal graph:</b> a graph showing the terminal currents and voltages of an element.`)},
 {type:'task',setup:threeTermTask,
  say:L_(`<b>3-uçlu</b> elemanlarda 3 akım ve 3 gerilim var ama hepsi bağımsız değil.<br>Bir ucu <b>referans</b> seçeriz ve diğer her uçtan referansa bir çizgi çizeriz → <b>2 çizgi</b> yeter.<br><br>Soldaki uçlara tıklayarak <b>3 referans seçimini de</b> dene ve her seferinde "kaybolan" büyüklüklerin nereden bulunduğunu oku.`,`A <b>3-terminal</b> element has 3 currents and 3 voltages, but they are not all independent.<br>We pick one terminal as the <b>datum</b> and draw a branch from every other terminal to it → <b>2 branches</b> suffice.<br><br>Click the terminals on the left to try <b>all 3 datum choices</b>, and each time read where the "missing" quantities come from.`),
  formal:L_(`<b>n-uçlu eleman uç-grafı:</b> bir uç referans seçilir; diğer n − 1 uçtan referansa birer çizgi → <b>n − 1 çizgi</b>.<br>Ani güç: p(t) = Σ ${S('v','k')}${S('i','k')} (k = 1…n−1).<br><b>2-kapılı:</b> her kapı bir çizgi → 2 çizgi (ayrık parçalar olabilir).`,`<b>Terminal graph of an n-terminal element:</b> one terminal is chosen as datum; a branch from each of the other n − 1 terminals to the datum → <b>n − 1 branches</b>.<br>Instantaneous power: p(t) = Σ ${S('v','k')}${S('i','k')} (k = 1…n−1).<br><b>Two-port:</b> one branch per port → 2 branches (possibly in separate parts).`)},
 {type:'task',setup:circuitTask,
  say:L_(`<b>Devreden grafa!</b> Sihirli kural: <span class="k">bir tele bağlı her nokta aynı düğümdür</span> (ideal iletkenin üzerinde potansiyel değişmez).<br><br>① Tellere tıkla: tıkladığın tele bağlı tüm tel parçaları aynı renge boyanacak.<br>② 4 düğümü de bulunca "Grafa dönüştür" ile her elemanı oka çevir.`,`<b>From circuit to graph!</b> The magic rule: <span class="k">every point on one connected wire is the same node</span> (the potential does not change along an ideal conductor).<br><br>① Click wires: all wire segments connected to the one you click get the same color.<br>② When you have all 4 nodes, press "Convert to graph" to turn each element into an arrow.`),
  formal:L_(`<b>Devre grafı:</b> verilen bir devre için devredeki her elemana ilişkin uç-grafı çizilerek elde edilen grafa devre grafı denir.`,`<b>Circuit graph:</b> for a given circuit, the graph obtained by drawing the terminal graph of every element.`)},
 {type:'quiz',say:L_(`Bölüm testi! 🎈`,`Chapter quiz! 🎈`),questions:[
  {q:L_('4-uçlu bir elemanın uç-grafında kaç çizgi vardır?',`How many branches does the terminal graph of a 4-terminal element have?`),opts:['3','4','6','2'],a:0,why:L_('n-uçlu → n − 1 çizgi (her uçtan referansa bir tane).',`n-terminal → n − 1 branches (one from each terminal to the datum).`)},
  {q:L_('2-uçlu elemanın uç-grafında neden yalnızca bir ok yeterli?',`Why is a single arrow enough in the terminal graph of a 2-terminal element?`),opts:[L_('Uyumlu çift: + uç okun kuyruğunda, gerilim yönü de oktan belli',`Associated directions: + is at the arrow's tail, so the voltage direction follows from the arrow`),L_('Gerilim önemsiz olduğu için',`Because voltage is unimportant`),L_('Akım hep sıfır olduğu için',`Because the current is always zero`)],a:0,why:L_('Akım ve gerilim uyumlu çift seçildiği için tek ok ikisini de anlatır.',`Since current and voltage use associated reference directions, one arrow describes both.`)},
  {q:L_('Gauss yüzeyi nasıl çizilmelidir?',`How must a Gaussian surface be drawn?`),opts:[L_('Sadece elemanları birleştiren bağlantıları kesecek şekilde',`So that it cuts only the connections between elements`),L_('Elemanların ortasından geçecek şekilde',`So that it passes through the middle of elements`),L_('Hiçbir bağlantıyı kesmeyecek şekilde',`So that it cuts no connections`)],a:0,why:L_('Gauss yüzeyi elemanların içinden geçmez, yalnızca bağlantıları keser.',`A Gaussian surface never passes through elements; it only cuts connections.`)},
  {q:L_('KAY ve KGY ile elde edilen denklemlerin katsayıları nelerdir?',`What are the coefficients of the equations obtained from KCL and KVL?`),opts:[L_('Sadece 1, −1, 0',`Only 1, −1, 0`),L_('Direnç değerleri',`Resistance values`),L_('Herhangi reel sayılar',`Arbitrary real numbers`)],a:0,why:L_('Lineer, cebrik, homojen denklemler; katsayılar 1, −1, 0. Elemanların özelliklerinden bağımsızlar!',`Linear, algebraic, homogeneous equations with coefficients 1, −1, 0. Independent of the element properties!`)},
  {q:L_('Az önceki devrede (E, R₁, R₂, R₃, J, C) devre grafının düğüm ve çizgi sayısı?',`In the previous circuit (E, R₁, R₂, R₃, J, C), how many nodes and branches does the circuit graph have?`),opts:[L_('4 düğüm, 6 çizgi',`4 nodes, 6 branches`),L_('6 düğüm, 4 çizgi',`6 nodes, 4 branches`),L_('4 düğüm, 4 çizgi',`4 nodes, 4 branches`),L_('5 düğüm, 6 çizgi',`5 nodes, 6 branches`)],a:0,why:L_('Her eleman bir çizgi (6), her bağlı tel grubu bir düğüm (4).',`Each element is a branch (6), each connected wire group is a node (4).`)},
  {q:L_('KAY ve KGY elemanın direnç mi, kapasite mi olduğuna bağlı mı?',`Do KCL and KVL depend on whether an element is a resistor or a capacitor?`),opts:[L_('Hayır, sadece bağlantı yapısına bağlı',`No, only on the interconnection`),L_('Evet, eleman türüne bağlı',`Yes, on the element type`)],a:0,why:L_('KAY ve KGY elemanların özelliklerinden bağımsızdır, yalnızca topolojiye (grafa) bağlıdır.',`KCL and KVL are independent of the element properties; they depend only on the topology (the graph).`)}
 ]}
]},
/* ---------------- 3 ---------------- */
{id:'c3',icon:'🌳',title:L_('Ağaç, Dal, Kiriş, Kesitleme',`Trees, Tree Branches, Links, Cut Sets`),sub:L_('Ders 3',`Lecture 3`),pos:[50,18],steps:[
 {type:'task',setup:degreeTask,say:L_(`Grafın dilini öğrenelim. Bu grafı tanı: Ders 4 slaytlarındaki örnekle aynı (5 düğüm, 9 çizgi). Düğümler <b>harf</b> (a…e), çizgiler <b>sayı</b> (1…9) ile gösteriliyor ki karışmasın.<br><br><span class="k">Derece</span>: bir düğüme bağlı çizgi sayısı. Sarı düğümün derecesi kaç?`,`Let's learn the language of graphs. You know this graph: it's the example from the Lecture 4 slides (5 nodes, 9 branches). Nodes are <b>letters</b> (a…e), branches are <b>numbers</b> (1…9) so they don't get mixed up.<br><br><span class="k">Degree</span>: the number of branches incident to a node. What is the degree of the yellow node?`),
  formal:L_(`<b>Derece:</b> Bir düğüme bağlı eleman sayısına o düğümün derecesi denir.`,`<b>Degree:</b> the number of elements connected to a node is called the degree of that node.`)},
 {type:'task',setup:pathTask,say:L_(`<span class="k">Yol</span>: bir düğümden başlayıp <b>hiçbir düğümü tekrar etmeden</b> başka bir düğüme yürüdüğün çizgi dizisi.<br><br>Kontrol listesi:<br>• n çizgi, n + 1 düğüm<br>• iki uç düğümün derecesi 1<br>• aradakilerin derecesi 2<br><br>Turuncu çizgiler yol mu?`,`<span class="k">Path</span>: a sequence of branches you walk from one node to another <b>without revisiting any node</b>.<br><br>Checklist:<br>• n branches, n + 1 nodes<br>• the two end nodes have degree 1<br>• the inner ones have degree 2<br><br>Are the orange branches a path?`),
  formal:L_(`<b>Yol:</b> G grafının şu özellikleri sağlayan alt grafı ${S('G','y')}: n çizgisi, n+1 düğümü vardır; çizgiler ${S('e',1)},…,${S('e','n')}, düğümler ${S('d',1)},…,${S('d','n+1')} olarak öyle numaralanabilir ki ${S('e','k')}'nın düğümleri ${S('d','k')} ve ${S('d','k+1')} olur; ${S('d',1)} ve ${S('d','n+1')}'in dereceleri bir, diğerlerininki ikidir.`,`<b>Path:</b> a subgraph ${S('G','p')} of G with the following properties: it has n branches and n+1 nodes; the branches ${S('e',1)},…,${S('e','n')} and nodes ${S('d',1)},…,${S('d','n+1')} can be numbered so that branch ${S('e','k')} connects nodes ${S('d','k')} and ${S('d','k+1')}; ${S('d',1)} and ${S('d','n+1')} have degree one, all others degree two.`)},
 {type:'task',setup:cycleTask,say:L_(`<span class="k">Birleşik graf</span>: her iki düğüm arasında en az bir yol var (graf kopuk değil).<br><span class="k">Çevre</span>: birleşik ve <b>her düğümünün derecesi tam 2</b> olan alt graf. Kısacası tek bir kapalı halka 🔁<br><br>Çizgilere tıklayarak bir çevre seç ve kontrol et. <b>3 farklı</b> çevre bul! (İpucu: 1 ve 2 paralel, en kısa çevre onlar.)`,`<span class="k">Connected graph</span>: there is at least one path between any two nodes (the graph is not in pieces).<br><span class="k">Loop</span>: a connected subgraph in which <b>every node has degree exactly 2</b>. In short, a single closed ring 🔁<br><br>Click branches to select a loop and check it. Find <b>3 different</b> loops! (Hint: 1 and 2 are parallel; they form the shortest loop.)`),
  formal:L_(`<b>Birleşik graf:</b> Verilen G grafında herhangi iki düğüm arasında en az bir yol varsa buna birleşik graf denir.<br><b>Çevre:</b> G grafının şu özellikleri sağlayan alt grafı ${S('G','a')}: ${S('G','a')} birleşiktir; ${S('G','a')}'daki bütün düğümlerin dereceleri ikidir.`,`<b>Connected graph:</b> a graph G is connected if there is at least one path between any two of its nodes.<br><b>Loop:</b> a subgraph ${S('G','l')} of G such that ${S('G','l')} is connected and every node of ${S('G','l')} has degree two.`)},
 {type:'talk',visual:vTreeGrow,mood:'wow',
  say:L_(`🌟 <b>En önemli kavram: AĞAÇ</b><br><br>Ağaç, grafın <b>iskeleti</b>dir. İki kuralı var:<br>① <b>Tüm düğümlere</b> dokun.<br>② <b>Hiç çevre</b> (halka) kurma.<br><br>Sezgi: her eve elektrik götüren <b>en tasarruflu</b> kablo ağı. Tek düğümle başla, her yeni çizgi yeni bir düğüm bağlasın. Ağaçta <b>nd − 1</b> çizgi olur.<br><br>Ağaçtaki çizgilere <span class="k">DAL</span>, geri kalanlara <span class="k">KİRİŞ</span> denir.`,`🌟 <b>The most important concept: the TREE</b><br><br>A tree is the <b>skeleton</b> of the graph. Two rules:<br>① Touch <b>all nodes</b>.<br>② Contain <b>no loop</b>.<br><br>Intuition: the <b>cheapest</b> cable network that brings power to every house. Start with one node and let every new branch connect a new node. A tree has <b>nd − 1</b> branches.<br><br>Branches in the tree are called <span class="k">TREE BRANCHES</span>, the rest are <span class="k">LINKS</span>.`),
  formal:L_(`<b>Ağaç:</b> Birleşik bir G grafının şu özellikleri sağlayan alt grafı ${S('G','T')}: ${S('G','T')}, G'nin tüm düğümlerini kapsar; ${S('G','T')} çevre içermez. (Birleşiktir.)<br><b>Dal:</b> Ağacın elemanlarına dal denir.<br><b>Kiriş:</b> G'den ${S('G','T')} çıkarıldığında kalan alt grafa kirişler kümesi denir.<br><b>Sonuç:</b> ${S('n','d')} düğümlü bir grafta seçilecek dal sayısı ${S('n','d')} − 1'dir.`,`<b>Tree:</b> a subgraph ${S('G','T')} of a connected graph G such that ${S('G','T')} contains all nodes of G and contains no loop. (It is connected.)<br><b>Tree branch:</b> an element of the tree.<br><b>Links:</b> the subgraph left when ${S('G','T')} is removed from G (the cotree).<br><b>Corollary:</b> in a graph with ${S('n','d')} nodes the number of tree branches is ${S('n','d')} − 1.`)},
 {type:'task',setup:treeTask(G1,2),say:L_(`🌳 <b>Ağaç dik!</b> Çizgilere tıklayarak dal seç. Sana anında söyleyeceğim:<br>• <span style="color:var(--bad);font-weight:900">kırmızı</span> = çevre oluştu (olmaz!)<br>• soluk düğüm = henüz bağlanmadı<br>• sayaç = kaç dal seçtin (hedef 4)<br><br><b>İki farklı</b> ağaç bul. İpucu: ağaç seçiminin tek bir doğru cevabı yok, bu grafta tam <b>${countTrees(G1)}</b> farklı ağaç var!`,`🌳 <b>Plant a tree!</b> Click branches to select tree branches. I'll tell you instantly:<br>• <span style="color:var(--bad);font-weight:900">red</span> = a loop formed (not allowed!)<br>• faded node = not yet connected<br>• counter = how many branches you selected (target 4)<br><br>Find <b>two different</b> trees. Hint: there is no single right answer; this graph has exactly <b>${countTrees(G1)}</b> different trees!`)},
 {type:'talk',visual:vLoops,
  say:L_(`Ağaçla sihir başlıyor ✨<br><br>Ağaca <b>bir kiriş</b> eklersen <b>tam olarak bir</b> çevre oluşur. Neden? Kirişin iki ucu ağaçta zaten <b>tek bir yolla</b> bağlı. Kiriş o yolu kapatır.<br><br>Bu çevreye o kirişin <span class="k">temel çevresi</span> denir. Yönü kirişin yönüdür.<br>Her kirişe bir temel çevre → <b>ne − nd + 1</b> tane. Her temel çevrede <b>tek bir kiriş</b> vardır!`,`The magic starts with the tree ✨<br><br>Add <b>one link</b> to the tree and <b>exactly one</b> loop forms. Why? The two ends of the link are already connected in the tree by a <b>unique path</b>; the link closes that path.<br><br>This loop is the link's <span class="k">fundamental loop</span>. Its orientation is that of the link.<br>One fundamental loop per link → <b>ne − nd + 1</b> of them. Every fundamental loop contains <b>exactly one link</b>!`),
  formal:L_(`<b>Temel çevreler kümesi:</b> ${S('n','e')} elemanlı ${S('n','d')} düğümlü birleşik bir G grafında ${S('G','T')} seçilmiş bir ağaç olsun. Bu ağacın belirlediği (${S('n','e')} − ${S('n','d')} + 1) adet kirişin her biri, diğer elemanları dal olmak üzere bir çevre tanımlar. Bu çevreye temel çevre, temel çevrelerin oluşturduğu kümeye temel çevreler kümesi denir.`,`<b>Fundamental loops:</b> let ${S('G','T')} be a chosen tree of a connected graph G with ${S('n','e')} branches and ${S('n','d')} nodes. Each of the (${S('n','e')} − ${S('n','d')} + 1) links determined by this tree defines a loop whose other elements are tree branches. This loop is called a fundamental loop; the set of these loops is the set of fundamental loops.`)},
 {type:'task',setup:fundLoopTask(G1,()=>T1),say:L_(`Slayttaki ağaç: <b>dallar {1, 3, 4, 5}</b>, kirişler {2, 6, 7, 8, 9}.<br><br>Pembe yanıp sönen <b>kirişin</b> temel çevresini tamamla: halkayı kapatan <b>yeşil dalları</b> seç. Kirişin bir ucundan başla, sadece dallar üzerinden öbür uca yürü.`,`The tree from the slides: <b>tree branches {1, 3, 4, 5}</b>, links {2, 6, 7, 8, 9}.<br><br>Complete the fundamental loop of the blinking pink <b>link</b>: select the <b>green tree branches</b> that close the ring. Start at one end of the link and walk to the other end using tree branches only.`)},
 {type:'task',setup:cutsetTask,say:L_(`<span class="k">Kesitleme</span>: grafı makasla ✂️ <b>tam iki parçaya</b> bölen çizgi kümesi. İki şartı var:<br>① Çıkarınca graf <b>iki</b> parça oluyor (ne bir ne üç).<br>② <b>Fazlalık yok</b>: hangisini geri koysan graf yeniden birleşiyor.<br><br>Kesilecek çizgileri seç ve kontrol et. <b>2 farklı</b> kesitleme bul. (İpucu: bir düğüme bağlı tüm çizgileri kesmek her zaman işe yarar!)`,`<span class="k">Cut set</span>: a set of branches that, cut with scissors ✂️, splits the graph into <b>exactly two parts</b>. Two conditions:<br>① Removing it leaves <b>two</b> parts (not one, not three).<br>② <b>Minimal</b>: putting back any one branch reconnects the graph.<br><br>Select the branches to cut and check. Find <b>2 different</b> cut sets. (Hint: cutting all branches at one node always works!)`),
  formal:L_(`<b>Kesitleme:</b> Birleşik bir G grafının şu özellikleri sağlayan alt grafı ${S('G','K')}: G'den ${S('G','K')} çıkarıldığında geriye kalan graf iki parçadır; ${S('G','K')}'nın bir elemanını yerine koyarsak graf birleşik olur.`,`<b>Cut set:</b> a subgraph ${S('G','C')} of a connected graph G such that removing ${S('G','C')} from G leaves exactly two parts, and restoring any one element of ${S('G','C')} makes the graph connected again.`)},
 {type:'talk',visual:vCuts,
  say:L_(`<b>Temel kesitleme</b> de temel çevrenin "ikizi":<br><br>Ağaçtan <b>bir dalı</b> kes ✂️ → ağaç <b>tam iki parçaya</b> ayrılır (pembe, mavi). Bu iki parçayı birleştiren tüm çizgiler, yani <b>o dal + bazı kirişler</b>, o dalın <span class="k">temel kesitlemesi</span>dir. Yönü dalın yönüdür.<br><br>Her dala bir tane → <b>nd − 1</b> temel kesitleme.<br><br>🔑 Ezber yerine simetri: <b>temel çevre = 1 kiriş + dallar</b>, <b>temel kesitleme = 1 dal + kirişler</b>.`,`The <b>fundamental cut set</b> is the "twin" of the fundamental loop:<br><br>Cut <b>one tree branch</b> ✂️ → the tree splits into <b>exactly two parts</b> (pink, blue). All branches joining these two parts, i.e. <b>that tree branch + some links</b>, form that tree branch's <span class="k">fundamental cut set</span>. Its orientation is that of the tree branch.<br><br>One per tree branch → <b>nd − 1</b> fundamental cut sets.<br><br>🔑 Symmetry instead of memorizing: <b>fundamental loop = 1 link + tree branches</b>, <b>fundamental cut set = 1 tree branch + links</b>.`),
  formal:L_(`<b>Temel kesitlemeler kümesi:</b> ${S('n','e')} elemanlı ${S('n','d')} düğümlü birleşik bir G grafında ${S('G','T')} seçilmiş bir ağaç olsun. ${S('n','d')} − 1 tane dalın her biri, diğer elemanları kiriş olmak üzere bir kesitleme tanımlar. Bu kesitlemeye temel kesitleme denir.<br><b>KAY (kesitlemeler için):</b> Her t anında herhangi bir kesitlemeye ilişkin akımların cebirsel toplamı sıfırdır.`,`<b>Fundamental cut sets:</b> let ${S('G','T')} be a chosen tree of a connected graph G with ${S('n','e')} branches and ${S('n','d')} nodes. Each of the ${S('n','d')} − 1 tree branches defines a cut set whose other elements are links. This is called a fundamental cut set.<br><b>KCL (for cut sets):</b> at all times t, the algebraic sum of the currents of any cut set is zero.`)},
 {type:'task',setup:fundCutTask(G1,()=>T1),say:L_(`Aynı ağaç: dallar {1, 3, 4, 5}. Makas ✂️ bir dalı kesti ve ağaç pembe ve mavi iki parçaya ayrıldı.<br><br><b>Bir ucu pembe, diğer ucu mavi</b> olan kirişleri seç. Dalla birlikte bunlar temel kesitlemeyi oluşturur.`,`Same tree: tree branches {1, 3, 4, 5}. The scissors ✂️ cut a tree branch and the tree split into pink and blue parts.<br><br>Select the links with <b>one end pink and the other end blue</b>. Together with the tree branch they form the fundamental cut set.`)},
 {type:'quiz',say:L_(`Ağaç ustalığı testi! 🌳 (nd = 5 düğüm, ne = 9 çizgi)`,`Tree mastery quiz! 🌳 (nd = 5 nodes, ne = 9 branches)`),questions:[
  {q:L_('nd = 5, ne = 9 olan birleşik grafta bir ağacın kaç dalı vardır?',`How many branches does a tree have in a connected graph with nd = 5, ne = 9?`),opts:['4','5','9','3'],a:0,why:L_('Dal sayısı = nd − 1 = 4.',`Number of tree branches = nd − 1 = 4.`)},
  {q:L_('Aynı grafta kaç kiriş vardır?',`How many links are there in the same graph?`),opts:['5','4','9','6'],a:0,why:L_('Kiriş = ne − (nd − 1) = 9 − 4 = 5.',`Links = ne − (nd − 1) = 9 − 4 = 5.`)},
  {q:L_('Kaç temel çevre ve kaç temel kesitleme vardır?',`How many fundamental loops and how many fundamental cut sets?`),opts:[L_('5 temel çevre, 4 temel kesitleme',`5 fundamental loops, 4 fundamental cut sets`),L_('4 temel çevre, 5 temel kesitleme',`4 fundamental loops, 5 fundamental cut sets`),L_('9 ve 9',`9 and 9`),L_('5 ve 5',`5 and 5`)],a:0,why:L_('Her kiriş bir temel çevre (5), her dal bir temel kesitleme (4) verir.',`Each link gives a fundamental loop (5), each tree branch a fundamental cut set (4).`)},
  {q:L_('Farklı bir ağaç seçersek dal sayısı değişir mi?',`If we choose a different tree, does the number of tree branches change?`),opts:[L_('Hayır, her ağaçta nd − 1 dal vardır',`No, every tree has nd − 1 branches`),L_('Evet, ağaca göre değişir',`Yes, it depends on the tree`)],a:0,why:L_('Hangi çizgilerin dal olduğu değişir ama sayısı her zaman nd − 1.',`Which branches are tree branches changes, but their number is always nd − 1.`)},
  {q:L_('Bir temel çevrede kaç tane kiriş bulunur?',`How many links does a fundamental loop contain?`),opts:[L_('Tam 1',`Exactly 1`),'En az 2',L_('Hiç',`None`),L_('Dal sayısı kadar',`As many as the tree branches`)],a:0,why:L_('Temel çevre = 1 kiriş + ağaçtaki yolu oluşturan dallar.',`Fundamental loop = 1 link + the tree branches forming the path in the tree.`)},
  {q:L_('Bir temel kesitlemede kaç tane dal bulunur?',`How many tree branches does a fundamental cut set contain?`),opts:[L_('Tam 1',`Exactly 1`),L_('Hiç',`None`),L_('Tüm dallar',`All tree branches`),'2'],a:0,why:L_('Temel kesitleme = 1 dal + iki parçayı birleştiren kirişler.',`Fundamental cut set = 1 tree branch + the links joining the two parts.`)},
  {q:L_('Seçtiğin 4 çizgi çevre içermiyor (nd = 5). Bu kesin bir ağaç mıdır?',`The 4 branches you selected contain no loop (nd = 5). Is it definitely a tree?`),opts:[L_('Evet, çevresiz ve nd − 1 çizgi ⇒ ağaç',`Yes: loop-free with nd − 1 branches ⇒ a tree`),L_('Hayır, birleşik olmayabilir',`No, it might not be connected`)],a:0,why:L_('Çevresiz ve nd − 1 çizgili alt graf otomatik olarak tüm düğümleri kapsar ve birleşiktir.',`A loop-free subgraph with nd − 1 branches automatically covers all nodes and is connected.`)},
  {q:L_('KAY şunlardan hangileri için yazılabilir?',`KCL can be written for which of these?`),opts:[L_('Gauss yüzeyleri, düğümler ve kesitlemeler',`Gaussian surfaces, nodes and cut sets`),L_('Sadece düğümler',`Only nodes`),L_('Çevreler',`Loops`)],a:0,why:L_('Teorem: Gauss yüzeyi KAY ⇔ düğüm KAY ⇔ kesitleme KAY. Çevreler için KGY yazılır.',`Theorem: Gaussian-surface KCL ⇔ node KCL ⇔ cut-set KCL. For loops we write KVL.`)},
  {q:L_('Temel çevre ile temel kesitlemenin yönü nasıl seçilir?',`How are the orientations of fundamental loops and fundamental cut sets chosen?`),opts:[L_('Temel çevre → kirişin yönü, temel kesitleme → dalın yönü',`Fundamental loop → the link's orientation, fundamental cut set → the tree branch's orientation`),L_('İkisi de saat yönü',`Both clockwise`),L_('İkisi de dalın yönü',`Both by the tree branch's orientation`)],a:0,why:L_('Her biri kendi "tek" elemanının yönünü alır.',`Each takes the orientation of its "single" defining element.`)}
 ]}
]},

{id:'c4',icon:'🧮',title:L_('Matrisler ve Bağımsız Denklemler',`Matrices and Independent Equations`),sub:L_('Ders 4',`Lecture 4`),pos:[71,23],steps:[
 {type:'talk',visual:vAa,
  say:L_(`Denklemleri <b>matrisle</b> yazalım. <span class="k">${S('A','a')}</span>: satırlar düğümler, sütunlar çizgiler.<br>• çizgi k, düğüm i'den <b>çıkıyorsa +1</b><br>• düğüm i'ye <b>giriyorsa −1</b><br>• değmiyorsa 0<br><br>Her sütunda bir +1 bir −1 var, yani tüm satırların toplamı 0. Bu yüzden <b>nd</b> denklem bağımsız değil! Referans satırını sil → <b>A</b>, rank = nd − 1.`,`Let's write the equations as <b>matrices</b>. <span class="k">${S('A','a')}</span> (complete incidence matrix): rows are nodes, columns are branches.<br>• +1 if branch k <b>leaves</b> node i<br>• −1 if it <b>enters</b> node i<br>• 0 if not incident<br><br>Each column has one +1 and one −1, so all rows add up to 0. Hence the <b>nd</b> equations are not independent! Delete the datum row → the reduced incidence matrix <b>A</b>, rank = nd − 1.`),
  formal:L_(`${S('A','a')}·i = 0 (tüm düğümler için KAY), boyut ${S('n','d')} × ${S('n','e')}.<br><b>Teorem:</b> ${S('n','d')} düğümlü birleşik bir grafta ${S('n','d')} − 1 düğüm için yazılan KAY'ları lineer bağımsız bir denklem takımı oluşturur. A·i = 0, rank A = ${S('n','d')} − 1.<br>KGY: v = Aᵀe.`,`${S('A','a')}·i = 0 (KCL for all nodes), size ${S('n','d')} × ${S('n','e')}.<br><b>Theorem:</b> in a connected graph with ${S('n','d')} nodes, the KCL equations written for any ${S('n','d')} − 1 nodes form a linearly independent set. A·i = 0, rank A = ${S('n','d')} − 1.<br>KVL: v = Aᵀe.`)},
 {type:'task',say:L_(`<b>A matrisini doldur!</b> (referans: e, satırlar a, b, c, d)<br>Hücreye tıkla: 0 → 1 → −1 → 0 …<br><br>Her <b>sütun</b> bir çizgi. O çizginin okuna bak: <b>kuyruğu</b> hangi düğümdeyse +1, <b>ucu</b> hangi düğümdeyse −1. e'ye değen çizgilerin sütununda tek bir sayı olur (çünkü e satırı silindi).`,`<b>Fill in the matrix A!</b> (datum: e, rows a, b, c, d)<br>Click a cell: 0 → 1 → −1 → 0 …<br><br>Each <b>column</b> is a branch. Look at its arrow: +1 at the node of its <b>tail</b>, −1 at the node of its <b>head</b>. Columns of branches touching e have a single entry (because row e was deleted).`),
  setup(stage,api){const g=G1;const M=Aa(g).slice(0,4);
   stage.innerHTML=L_(`<svg class="g" viewBox="0 0 600 420" style="max-height:36vh"></svg><div id="mx"></div><div class="tools"><button class="btn" id="chk">Kontrol et</button><button class="btn ghost small" id="hint">💡 Bir sütunu göster</button></div>`,`<svg class="g" viewBox="0 0 600 420" style="max-height:36vh"></svg><div id="mx"></div><div class="tools"><button class="btn" id="chk">Check</button><button class="btn ghost small" id="hint">💡 Reveal a column</button></div>`);
   drawGraph(stage.querySelector('svg'),g,{ref:5});
   const ed=matrixEditor(stage.querySelector('#mx'),{rows:['a','b','c','d'],cols:g.edges.map(e=>e.id),answer:M});
   stage.querySelector('#chk').onclick=()=>{const w=ed.check();if(!w){api.done();ed.lockAll();fb(L_('✅ Mükemmel! A matrisi doğru. A·i = 0 → 4 bağımsız KAY denklemi.',`✅ Perfect! A is correct. A·i = 0 → 4 independent KCL equations.`),'ok')}else{api.mistake();fb(L_(`${w} hücre hatalı (kırmızı). Sütunun çizgisine grafikte bak: kuyruk +1, uç −1.`,`${w} cell(s) wrong (red). Look at the column's branch on the graph: tail +1, head −1.`),'bad')}};
   stage.querySelector('#hint').onclick=()=>{const j=ed.firstWrongCol();if(j<0){fb(L_('Hepsi doğru görünüyor, Kontrol et!',`Everything looks right; press Check!`),'info');return}ST.mist+=.5;ed.revealCol(j);const e=g.edges[j];
     fb(L_(`Çizgi ${e.id}: ${nn(e.from)} → ${nn(e.to)}. ${e.from===5?'':`${nn(e.from)} satırı +1`}${e.to===5?'':`${e.from===5?'':', '}${nn(e.to)} satırı −1`}${e.from===5||e.to===5?' (e satırı yok).':'.'}`,`Branch ${e.id}: ${nn(e.from)} → ${nn(e.to)}. ${e.from===5?'':`row ${nn(e.from)} +1`}${e.to===5?'':`${e.from===5?'':', '}row ${nn(e.to)} −1`}${e.from===5||e.to===5?' (no row e).':'.'}`),'info')}}},
 {type:'task',say:L_(`<b>Q matrisi</b>: ağaç {1, 3, 4, 5} için temel kesitlemeler.<br>Satır = temel kesitleme (bir dal). Sütunlar: önce <b>dallar</b>, sonra <b>kirişler</b>.<br><br>Dallar kısmı otomatik olarak <b>birim matris I</b> (her TK'da tek dal!). Sen kirişler kısmını (${S('Q','L')}) doldur:<br>• kiriş kesitlemede ve yönü dal yönüyle aynıysa (pembe → mavi) <b>+1</b><br>• tersse <b>−1</b>, kesitlemede değilse 0<br><br>👆 Satır adına tıkla: o kesitleme grafikte gösterilir.`,`<b>Matrix Q</b>: fundamental cut sets for the tree {1, 3, 4, 5}.<br>Row = fundamental cut set (one tree branch). Columns: first <b>tree branches</b>, then <b>links</b>.<br><br>The tree-branch part is automatically the <b>identity matrix I</b> (one tree branch per cut set!). You fill in the link part (${S('Q','L')}):<br>• <b>+1</b> if the link is in the cut set with the same orientation as the tree branch (pink → blue)<br>• <b>−1</b> if opposite, 0 if not in the cut set<br><br>👆 Click a row label to show that cut set on the graph.`),
  formal:L_(`Q·i = 0, Q = [ I | ${S('Q','L')} ], boyut (${S('n','d')} − 1) × ${S('n','e')}.<br>KAY'na ilişkin bağımsız denklem takımı: temel kesitlemeler için yazılan denklemler.`,`Q·i = 0, Q = [ I | ${S('Q','L')} ], size (${S('n','d')} − 1) × ${S('n','e')}.<br>An independent set of KCL equations: the equations written for the fundamental cut sets.`),
  setup(stage,api){const g=G1,cols=[...T1,...C1];const Q=T1.map(b=>{const r=fundCut(g,T1,b);return cols.map(id=>r[id]||0)});
   stage.innerHTML=L_(`<svg class="g" viewBox="0 0 600 420" style="max-height:36vh"></svg>${LEG_TREE}<div id="mx"></div><div class="tools"><button class="btn" id="chk">Kontrol et</button><button class="btn ghost small" id="hint">💡 Bir sütunu göster</button></div>`,`<svg class="g" viewBox="0 0 600 420" style="max-height:36vh"></svg>${LEG_TREE}<div id="mx"></div><div class="tools"><button class="btn" id="chk">Check</button><button class="btn ghost small" id="hint">💡 Reveal a column</button></div>`);
   const svg=stage.querySelector('svg');
   function show(r){const br=T1[r];const A=new Set(fundCutSides(g,T1,br));const ec=clsTree(g,T1);ec[br]='cutx';const nc={};nodeIds(g).forEach(n=>nc[n]=A.has(n)?'sa':'sb');
     const G=geo(g,E(g,br));drawGraph(svg,g,{edgeCls:ec,nodeCls:nc,overlay:`<text x="${G.px}" y="${G.py+9}" font-size="30" text-anchor="middle">✂️</text>`})}
   drawGraph(svg,g,{edgeCls:clsTree(g,T1)});
   const ed=matrixEditor(stage.querySelector('#mx'),{rows:T1.map(b=>`TK(${b})`),cols,answer:Q,fixed:(i,j)=>j<4,splitAt:4,rowClick:show,colClass:j=>j<4?'dalh':'kirh'});
   stage.querySelector('#chk').onclick=()=>{const w=ed.check();if(!w){api.done();ed.lockAll();fb(L_('✅ Q = [ I | Q<sub>L</sub> ] doğru! 4 bağımsız KAY: Q·i = 0.',`✅ Q = [ I | Q<sub>L</sub> ] correct! 4 independent KCL equations: Q·i = 0.`),'ok')}else{api.mistake();fb(L_(`${w} hücre hatalı. Satır adına tıkla, kirişin bir ucu pembe diğeri mavi mi bak. Pembe → mavi +1, mavi → pembe −1.`,`${w} cell(s) wrong. Click the row label and check whether the link has one end pink and the other blue. Pink → blue +1, blue → pink −1.`),'bad')}};
   stage.querySelector('#hint').onclick=()=>{const j=ed.firstWrongCol();if(j<0){fb(L_('Hepsi doğru görünüyor, Kontrol et!',`Everything looks right; press Check!`),'info');return}ST.mist+=.5;ed.revealCol(j);fb(L_(`Kiriş ${cols[j]} sütunu açıldı.`,`Column of link ${cols[j]} revealed.`),'info')}}},
 {type:'task',say:L_(`<b>B matrisi</b>: temel çevreler.<br>Satır = temel çevre (bir kiriş). Sütunlar yine: dallar | kirişler.<br><br>Kirişler kısmı <b>I</b>. Sen dallar kısmını (${S('B','t')}) doldur:<br>• dal çevrede ve yönü <b>çevre yönüyle</b> (yani kirişin yönüyle dolaşınca) aynıysa <b>+1</b><br>• tersse <b>−1</b>, çevrede değilse 0<br><br>👆 Satır adına tıkla: o çevre gösterilir.`,`<b>Matrix B</b>: fundamental loops.<br>Row = fundamental loop (one link). Columns again: tree branches | links.<br><br>The link part is <b>I</b>. You fill in the tree-branch part (${S('B','t')}):<br>• <b>+1</b> if the tree branch is in the loop with the same orientation as the <b>loop</b> (i.e. traversing in the link's direction)<br>• <b>−1</b> if opposite, 0 if not in the loop<br><br>👆 Click a row label to show that loop.`),
  formal:L_(`B·v = 0, B = [ ${S('B','t')} | I ], boyut (${S('n','e')} − ${S('n','d')} + 1) × ${S('n','e')}.<br>KGY'na ilişkin bağımsız denklem takımı: temel çevreler için yazılan denklemler.`,`B·v = 0, B = [ ${S('B','t')} | I ], size (${S('n','e')} − ${S('n','d')} + 1) × ${S('n','e')}.<br>An independent set of KVL equations: the equations written for the fundamental loops.`),
  setup(stage,api){const g=G1,cols=[...T1,...C1];const B=C1.map(c=>{const r=fundLoop(g,T1,c);return cols.map(id=>r[id]||0)});
   stage.innerHTML=L_(`<svg class="g" viewBox="0 0 600 420" style="max-height:36vh"></svg>${LEG_TREE}<div id="mx"></div><div class="tools"><button class="btn" id="chk">Kontrol et</button><button class="btn ghost small" id="hint">💡 Bir sütunu göster</button></div>`,`<svg class="g" viewBox="0 0 600 420" style="max-height:36vh"></svg>${LEG_TREE}<div id="mx"></div><div class="tools"><button class="btn" id="chk">Check</button><button class="btn ghost small" id="hint">💡 Reveal a column</button></div>`);
   const svg=stage.querySelector('svg');
   function show(r){const ch=C1[r];const L=fundLoop(g,T1,ch);const ec=clsTree(g,T1);Object.keys(L).forEach(id=>ec[id]='loop');drawGraph(svg,g,{edgeCls:ec})}
   drawGraph(svg,g,{edgeCls:clsTree(g,T1)});
   const ed=matrixEditor(stage.querySelector('#mx'),{rows:C1.map(c=>L_(`Ç(${c})`,`L(${c})`)),cols,answer:B,fixed:(i,j)=>j>=4,splitAt:4,rowClick:show,colClass:j=>j<4?'dalh':'kirh'});
   stage.querySelector('#chk').onclick=()=>{const w=ed.check();if(!w){api.done();ed.lockAll();fb(L_('✅ B = [ B<sub>t</sub> | I ] doğru! 5 bağımsız KGY: B·v = 0.',`✅ B = [ B<sub>t</sub> | I ] correct! 5 independent KVL equations: B·v = 0.`),'ok')}else{api.mistake();fb(L_(`${w} hücre hatalı. Çevreyi kirişin ok yönünde dolaş; dalın oku dolaşma yönündeyse +1, tersse −1.`,`${w} cell(s) wrong. Traverse the loop in the direction of the link's arrow; +1 if the tree branch's arrow agrees, −1 otherwise.`),'bad')}};
   stage.querySelector('#hint').onclick=()=>{const j=ed.firstWrongCol();if(j<0){fb(L_('Hepsi doğru görünüyor, Kontrol et!',`Everything looks right; press Check!`),'info');return}ST.mist+=.5;ed.revealCol(j);fb(L_(`Dal ${cols[j]} sütunu açıldı.`,`Column of tree branch ${cols[j]} revealed.`),'info')}}},
 {type:'talk',visual:vBQ,mood:'wow',
  say:L_(`Az önce doldurduğun iki matris arasında <b>gizli bir bağ</b> var:<br><br><span class="k">B·Qᵀ = 0</span> &nbsp;⇒&nbsp; <span class="k">${S('B','t')} = −${S('Q','L')}ᵀ</span><br><br>Neden? Bir kiriş bir dalın kesitlemesindeyse, o dal da o kirişin çevresindedir (ve işaretler zıttır). Sınavda biri bulununca diğeri <b>bedava</b> 🎁`,`There is a <b>hidden link</b> between the two matrices you just filled in:<br><br><span class="k">B·Qᵀ = 0</span> &nbsp;⇒&nbsp; <span class="k">${S('B','t')} = −${S('Q','L')}ᵀ</span><br><br>Why? If a link is in the cut set of a tree branch, that tree branch is in the loop of that link (with opposite sign). In the exam, once you find one, the other is <b>free</b> 🎁`),
  formal:L_(`<b>Teorem:</b> Birleşik G'de seçilen T ağacı için Q ve B sırasıyla temel kesitleme ve temel çevre matrisleri olsun. B·Qᵀ = 0, Q·Bᵀ = 0, ${S('B','t')} = −${S('Q','L')}ᵀ.`,`<b>Theorem:</b> for a tree T of a connected graph G, let Q and B be the fundamental cut-set and fundamental loop matrices. Then B·Qᵀ = 0, Q·Bᵀ = 0, ${S('B','t')} = −${S('Q','L')}ᵀ.`)},
 {type:'talk',visual:vTellegen,
  say:L_(`<b>Tellegen Teoremi</b>: KAY'ı sağlayan <b>herhangi</b> bir akım kümesi i ile KGY'yi sağlayan <b>herhangi</b> bir gerilim kümesi v için<br><br><span class="k">Σ ${S('v','k')}·${S('i','k')} = vᵀi = 0</span><br><br>v ile i'nin <b>aynı devreden gelmesi bile gerekmez</b>, yeter ki aynı grafta olsunlar. Teorem sadece <b>topolojiye</b> bağlı. 🎲 butonuna bas ve kendin gör!`,`<b>Tellegen's theorem</b>: for <b>any</b> set of currents i satisfying KCL and <b>any</b> set of voltages v satisfying KVL,<br><br><span class="k">Σ ${S('v','k')}·${S('i','k')} = vᵀi = 0</span><br><br>v and i <b>need not even come from the same circuit</b>, as long as they are on the same graph. The theorem depends only on <b>topology</b>. Press 🎲 and see for yourself!`),
  formal:L_(`<b>Tellegen:</b> ${S('n','e')} elemanlı bir G grafında i, KAY'nı sağlayan; v, KGY'nı sağlayan bir küme olsun. vᵀi = 0.<br>Tanıt: v = Aᵀe ⇒ vᵀi = eᵀ(A·i) = eᵀ·0 = 0.`,`<b>Tellegen:</b> on a graph G with ${S('n','e')} branches, let i satisfy KCL and v satisfy KVL. Then vᵀi = 0.<br>Proof: v = Aᵀe ⇒ vᵀi = eᵀ(A·i) = eᵀ·0 = 0.`)},
 {type:'talk',visual:vCount,
  say:L_(`Şimdi büyük resim 🧩<br><br>KAY'dan <b>nd − 1</b>, KGY'den <b>ne − nd + 1</b> bağımsız denklem var. Toplam <b>ne</b>.<br>Ama bilinmeyen sayısı <b>2ne</b>: her elemanın hem v'si hem i'si.<br><br>Eksik <b>ne</b> denklem <span class="k">Eleman Tanım Bağıntıları</span>'ndan (ETB) gelir: her eleman kendi v, i, q, φ ilişkisini söyler.`,`Now the big picture 🧩<br><br>KCL gives <b>nd − 1</b> and KVL gives <b>ne − nd + 1</b> independent equations. Total <b>ne</b>.<br>But there are <b>2ne</b> unknowns: both v and i of every element.<br><br>The missing <b>ne</b> equations come from the <span class="k">branch equations</span> (element characteristics): each element states its own v, i, q, φ relation.`),
  formal:L_(`<b>Direnç:</b> v ile i arasında cebrik bağıntı · <b>Endüktans:</b> φ ile i · <b>Kapasite:</b> v ile q · <b>Memristör:</b> φ ile q.<br>Lineer direnç: v = R·i (R: direnç [Ω]), i = G·v (G: iletkenlik [S]).`,`<b>Resistor:</b> algebraic relation between v and i · <b>Inductor:</b> φ and i · <b>Capacitor:</b> v and q · <b>Memristor:</b> φ and q.<br>Linear resistor: v = R·i (R: resistance [Ω]), i = G·v (G: conductance [S]).`)},
 {type:'quiz',say:L_(`Matris ustası mısın? 🧮 (nd = 5, ne = 9)`,`Are you a matrix master? 🧮 (nd = 5, ne = 9)`),questions:[
  {q:L_('A matrisinin (referans satırı silinmiş) boyutu nedir?',`What is the size of the matrix A (datum row deleted)?`),opts:['4 × 9','5 × 9','9 × 4','5 × 5'],a:0,why:'(nd − 1) × ne = 4 × 9.'},
  {q:L_(`${S('A','a')} (5 × 9) matrisinin rankı kaçtır?`,`What is the rank of ${S('A','a')} (5 × 9)?`),opts:['4','5','9','3'],a:0,why:L_('Satırların toplamı 0, yani biri diğerlerine bağlı; rank = nd − 1 = 4.',`The rows sum to 0, so one depends on the others; rank = nd − 1 = 4.`)},
  {q:L_('Q = [ ? | Q<sub>L</sub> ] matrisinde dallara karşılık gelen kısım nedir?',`In Q = [ ? | Q<sub>L</sub> ], what is the part corresponding to the tree branches?`),opts:[L_('Birim matris I',`Identity matrix I`),L_('Sıfır matris',`Zero matrix`),'−Q<sub>L</sub>ᵀ','A'],a:0,why:L_('Her temel kesitlemede tek bir dal var ve yönü kesitleme yönü → I.',`Each fundamental cut set has a single tree branch oriented like the cut set → I.`)},
  {q:L_('B matrisinin hangi kısmı birim matristir?',`Which part of B is the identity matrix?`),opts:[L_('Kirişler kısmı',`The link part`),L_('Dallar kısmı',`The tree-branch part`),L_('Hiçbiri',`Neither`)],a:0,why:L_('Her temel çevrede tek kiriş var → B = [ B<sub>t</sub> | I ].',`Each fundamental loop has a single link → B = [ B<sub>t</sub> | I ].`)},
  {q:L_('B<sub>t</sub> neye eşittir?',`What is B<sub>t</sub> equal to?`),opts:['−Q<sub>L</sub>ᵀ','Q<sub>L</sub>','I','Aᵀ'],a:0,why:'B·Qᵀ = 0 ⇒ B<sub>t</sub> + Q<sub>L</sub>ᵀ = 0.'},
  {q:L_('KAY ve KGY\'den toplam kaç lineer bağımsız denklem elde edilir? Bilinmeyen kaçtır?',`How many linearly independent equations do KCL and KVL give in total? How many unknowns are there?`),opts:[L_('9 denklem, 18 bilinmeyen',`9 equations, 18 unknowns`),L_('18 denklem, 9 bilinmeyen',`18 equations, 9 unknowns`),L_('9 ve 9',`9 and 9`),L_('4 ve 5',`4 and 5`)],a:0,why:L_('(nd − 1) + (ne − nd + 1) = ne = 9; bilinmeyen 2ne = 18. Eksikler ETB\'den.',`(nd − 1) + (ne − nd + 1) = ne = 9; unknowns 2ne = 18. The rest come from the branch equations.`)},
  {q:L_('Kapasite elemanı hangi iki büyüklük arasındaki bağıntıyla tanımlanır?',`A capacitor is defined by a relation between which two quantities?`),opts:[L_('v ve q',`v and q`),L_('φ ve i',`φ and i`),L_('v ve i',`v and i`),L_('φ ve q',`φ and q`)],a:0,why:L_('Direnç v–i, endüktans φ–i, kapasite v–q, memristör φ–q.',`Resistor v–i, inductor φ–i, capacitor v–q, memristor φ–q.`)},
  {q:L_('Tellegen teoremi neye bağlıdır?',`What does Tellegen's theorem depend on?`),opts:[L_('Sadece devrenin topolojisine (grafa)',`Only the circuit topology (the graph)`),L_('Elemanların lineer olmasına',`On the elements being linear`),L_('Kaynakların değerlerine',`On the source values`)],a:0,why:L_('v KGY\'yi, i KAY\'yi sağlasın yeter; elemanlar ne olursa olsun vᵀi = 0.',`As long as v satisfies KVL and i satisfies KCL, vᵀi = 0 whatever the elements.`)}
 ]}
]},

{id:'c5',icon:'🏁',title:L_('Final: Yeni Bir Graf',`Final: A New Graph`),sub:L_('Ders 1–4 hepsi bir arada',`Lectures 1–4 all together`),pos:[91,19],steps:[
 {type:'talk',visual:(stage)=>{const {svg,status}=graphStage(stage);drawGraph(svg,G2,{});status.innerHTML='<span class="chip">nd = 4</span><span class="chip">ne = 6</span>'},
  say:L_(`🏁 <b>Final turu!</b> Daha önce görmediğin bir graf.<br><br>Bu sefer ağacı <b>sen</b> seçeceksin, sonra temel çevreleri ve temel kesitlemeleri <b>kendi ağacına göre</b> bulacaksın. Sınavda tam olarak bu isteniyor:<br><i>"Ağaç seçip ağacın belirlediği temel kesitleme ve temel çevreler için KAY ve KGY yazınız."</i>`,`🏁 <b>Final round!</b> A graph you haven't seen before.<br><br>This time <b>you</b> choose the tree, then find the fundamental loops and fundamental cut sets <b>for your own tree</b>. This is exactly what the exam asks:<br><i>"Choose a tree and write KCL and KVL for the fundamental cut sets and fundamental loops it defines."</i>`)},
 {type:'quiz',say:L_(`Isınma: saymayı unutma!`,`Warm-up: don't forget to count!`),questions:[
  {q:L_('Bu grafta (nd = 4, ne = 6) bir ağacın kaç dalı, kaç kirişi olur?',`In this graph (nd = 4, ne = 6), how many tree branches and links does a tree have?`),opts:[L_('3 dal, 3 kiriş',`3 tree branches, 3 links`),L_('4 dal, 2 kiriş',`4 tree branches, 2 links`),L_('2 dal, 4 kiriş',`2 tree branches, 4 links`),L_('3 dal, 6 kiriş',`3 tree branches, 6 links`)],a:0,why:L_('Dal = nd − 1 = 3, kiriş = ne − nd + 1 = 3.',`Tree branches = nd − 1 = 3, links = ne − nd + 1 = 3.`),fig:svg=>drawGraph(svg,G2,{})}]},
 {type:'task',setup:treeTask(G2,1,t=>{ctx.tree=t}),say:L_(`Kendi ağacını seç! 🌳 3 dal, çevre yok, tüm düğümler kapsanmış olsun. (Bu grafta ${countTrees(G2)} farklı ağaç var.)`,`Choose your own tree! 🌳 3 branches, no loop, all nodes covered. (This graph has ${countTrees(G2)} different trees.)`)},
 {type:'task',setup:(stage,api)=>fundLoopTask(G2,()=>ctx.tree||[1,2,3])(stage,api),say:L_(`Senin ağacın için <b>temel çevreler</b>: her kiriş için halkayı kapatan dalları seç.`,`<b>Fundamental loops</b> for your tree: for each link, select the tree branches that close the ring.`)},
 {type:'task',setup:(stage,api)=>fundCutTask(G2,()=>ctx.tree||[1,2,3])(stage,api),say:L_(`Ve <b>temel kesitlemeler</b>: her dal kesilince iki parçayı birleştiren kirişleri seç.`,`And <b>fundamental cut sets</b>: when each tree branch is cut, select the links joining the two parts.`)},
 {type:'quiz',say:L_(`Son sorular! 💪`,`Final questions! 💪`),questions:[
  {q:L_('Bir graftaki çizgi kümesi çıkarıldığında graf 3 parçaya ayrılıyor. Bu küme bir kesitleme midir?',`Removing a set of branches from a graph splits it into 3 parts. Is this set a cut set?`),opts:[L_('Hayır, kesitleme tam iki parça ister',`No, a cut set requires exactly two parts`),L_('Evet',`Yes`)],a:0,why:L_('Kesitlemenin tanımı: kalan graf iki parçadır ve her eleman geri konunca birleşir.',`Definition of a cut set: the remaining graph has two parts and restoring any element reconnects it.`)},
  {q:L_('Ağaca bir kiriş eklendiğinde kaç çevre oluşur?',`How many loops form when a link is added to a tree?`),opts:[L_('Tam bir',`Exactly one`),L_('İki',`Two`),L_('Hiç',`None`),L_('Kiriş sayısı kadar',`As many as there are links`)],a:0,why:L_('Kirişin uçları ağaçta tek bir yolla bağlıdır; kiriş bu yolu kapatır → tek çevre.',`The link's ends are connected by a unique path in the tree; the link closes that path → one loop.`)},
  {q:L_('Ağaçtan bir dal çıkarılınca ağaç kaç parçaya ayrılır?',`Into how many parts does a tree split when one tree branch is removed?`),opts:[L_('İki',`Two`),L_('Üç',`Three`),L_('Ayrılmaz',`It does not split`),'nd − 1'],a:0,why:L_('Ağaçta her dal bir köprüdür; çıkınca tam iki parça kalır. Temel kesitleme buradan çıkar.',`Every tree branch is a bridge; removing it leaves exactly two parts. This is where the fundamental cut set comes from.`)},
  {q:L_('Bağımsız KGY denklemleri yazmak için hangisi kullanılır?',`Which is used to write independent KVL equations?`),opts:[L_('Temel çevreler',`Fundamental loops`),L_('Temel kesitlemeler',`Fundamental cut sets`),L_('Tüm düğümler',`All nodes`),L_('Gauss yüzeyleri',`Gaussian surfaces`)],a:0,why:L_('Temel çevreler → ne − nd + 1 bağımsız KGY. Kesitlemeler/düğümler/Gauss → KAY.',`Fundamental loops → ne − nd + 1 independent KVL equations. Cut sets / nodes / Gaussian surfaces → KCL.`)},
  {q:L_('Hangisi her durumda doğrudur?',`Which statement is always true?`),opts:[L_('Dal sayısı + kiriş sayısı = ne',`# tree branches + # links = ne`),L_('Dal sayısı = kiriş sayısı',`# tree branches = # links`),L_('Kiriş sayısı = nd − 1',`# links = nd − 1`),L_('Ağaç tektir',`The tree is unique`)],a:0,why:L_('Her çizgi ya daldır ya kiriş: (nd − 1) + (ne − nd + 1) = ne.',`Every branch is either a tree branch or a link: (nd − 1) + (ne − nd + 1) = ne.`)}
 ]}
]},
/* ---------------- 6 ---------------- */
{id:'c6',icon:'🔌',title:L_('Dirençler',`Resistors`),sub:L_('Ders 5',`Lecture 5`),pos:[80,50],steps:[
 {type:'talk',visual:vLinear,
  say:L_(`Ders 5: <b>dirençler</b>! Direnç, v ile i arasındaki cebrik bir bağıntıdır: f(v, i) = 0.<br><br>Hatırlatma: f <b>lineer</b> ise f(αx₁ + βx₂) = αf(x₁) + βf(x₂). Lineer bir direncin karakteristiği <b>orijinden geçen bir doğrudur</b>.<br><br>⚠️ Slayttaki tuzak: <b>i-v düzleminde</b> yatay eksen i, <b>v-i düzleminde</b> yatay eksen v. Açık devre bir düzlemde dikey, diğerinde yatay çizilir! Butonlarla bak.`,`Lecture 5: <b>resistors</b>! A resistor is an algebraic relation between v and i: f(v, i) = 0.<br><br>Reminder: f is <b>linear</b> if f(αx₁ + βx₂) = αf(x₁) + βf(x₂). The characteristic of a linear resistor is <b>a straight line through the origin</b>.<br><br>⚠️ The trap in the slides: in the <b>i-v plane</b> the horizontal axis is i, in the <b>v-i plane</b> it is v. An open circuit is vertical in one plane and horizontal in the other! Use the buttons.`),
  formal:L_(`<b>Lineerlik:</b> f(x₁) = y₁, f(x₂) = y₂ ve f lineer ise f(αx₁ + βx₂) = αf(x₁) + βf(x₂) = αy₁ + βy₂.<br><b>Açık devre elemanı:</b> f(i, v) = i = 0 (R = ∞, G = 0).<br><b>Kısa devre elemanı:</b> f(i, v) = v = 0 (R = 0, G = ∞).`,`<b>Linearity:</b> if f(x₁) = y₁, f(x₂) = y₂ and f is linear, then f(αx₁ + βx₂) = αf(x₁) + βf(x₂) = αy₁ + βy₂.<br><b>Open circuit:</b> f(i, v) = i = 0 (R = ∞, G = 0).<br><b>Short circuit:</b> f(i, v) = v = 0 (R = 0, G = ∞).`)},
 {type:'talk',visual:vDual,
  say:L_(`<b>Dual dirençler</b> 🪞: A'nın v-i karakteristiği, B'nin i-v karakteristiği ile aynıysa A, B'nin dualidir. Yani aynı çizim, sadece v ile i'nin adları değişti.<br><br>• R = 2 Ω'un duali 0.5 Ω'dur.<br>• Açık devrenin duali kısa devredir.<br>• Gerilim kaynağının duali akım kaynağıdır.<br><br>Ani güç: <span class="k">p = v·i = R·i²</span>. R &gt; 0 ise p ≥ 0: eleman hep güç <b>alır</b> (pasif). R &lt; 0 ise güç <b>verir</b>.`,`<b>Dual resistors</b> 🪞: if the v-i characteristic of A is the same as the i-v characteristic of B, A is the dual of B. Same plot, only the names of v and i swapped.<br><br>• The dual of R = 2 Ω is 0.5 Ω.<br>• The dual of an open circuit is a short circuit.<br>• The dual of a voltage source is a current source.<br><br>Instantaneous power: <span class="k">p = v·i = R·i²</span>. If R &gt; 0 then p ≥ 0: the element always <b>absorbs</b> power (passive). If R &lt; 0 it <b>delivers</b> power.`),
  formal:L_(`<b>Tanım (Dual dirençler):</b> A direncinin v-i karakteristiği B direncinin i-v karakteristiği ile aynıdır ⇔ A direnci B direncinin dual'idir.<br><b>Lineer direncin ani gücü:</b> p(t) = v(t)i(t) = R·i²(t).`,`<b>Definition (Dual resistors):</b> the v-i characteristic of resistor A is identical to the i-v characteristic of resistor B ⇔ A is the dual of B.<br><b>Instantaneous power of a linear resistor:</b> p(t) = v(t)i(t) = R·i²(t).`)},
 {type:'talk',visual:vNonlin,
  say:L_(`Şimdi <b>lineer olmayan</b> dirençler: karakteristik artık orijinden geçen bir doğru değil.<br><br>Butonlarla tek tek gez: ideal diyot, p-n diyot, tünel diyot, bağımsız kaynaklar, zamanla değişen direnç ve anahtar.<br><br>💡 Bağımsız gerilim kaynağı lineer mi? Karakteristiği bir doğru ama <b>orijinden geçmiyor</b>. (3 V, 1 A) noktası var ama 2 katı olan (6 V, 2 A) yok. Yani lineer <b>değil</b>!`,`Now <b>nonlinear</b> resistors: the characteristic is no longer a straight line through the origin.<br><br>Go through them with the buttons: ideal diode, p-n diode, tunnel diode, independent sources, time-varying resistor and switch.<br><br>💡 Is an independent voltage source linear? Its characteristic is a straight line but it <b>does not pass through the origin</b>. The point (3 V, 1 A) is on it, but twice that, (6 V, 2 A), is not. So it is <b>not</b> linear!`),
  formal:L_(`<b>İdeal diyot:</b> R<sub>ID</sub> = {(v, i): vi = 0, i = 0, v &lt; 0 ve v = 0, i &gt; 0}. Tıkamada (v &lt; 0) i = 0, iletimde (i &gt; 0) v = 0.<br><b>p-n diyot:</b> i = I<sub>s</sub>(e<sup>qv/kT</sup> − 1). I<sub>s</sub>: ters doyma akımı, q: elektron yükü, k: Boltzmann sabiti, T: sıcaklık (K).<br><b>Tünel diyot:</b> R<sub>TD</sub> = {(v, i): i = î(v)}.<br><b>Bağımsız gerilim kaynağı:</b> R<sub>vs</sub> = {(v, i): v = v<sub>s</sub>(t), −∞ &lt; i &lt; ∞}. <b>Akım kaynağı:</b> R<sub>is</sub> = {(v, i): i = i<sub>s</sub>(t), −∞ &lt; v &lt; ∞}.<br><b>Zamanla değişen direnç:</b> v-i karakteristiği zamanla değişir. Lineer olanı v(t) = R(t)i(t), i(t) = G(t)v(t).`,`<b>Ideal diode:</b> R<sub>ID</sub> = {(v, i): vi = 0, i = 0 for v &lt; 0 and v = 0 for i &gt; 0}. Reverse-biased (v &lt; 0) i = 0, conducting (i &gt; 0) v = 0.<br><b>p-n diode:</b> i = I<sub>s</sub>(e<sup>qv/kT</sup> − 1). I<sub>s</sub>: reverse saturation current, q: electron charge, k: Boltzmann's constant, T: temperature (K).<br><b>Tunnel diode:</b> R<sub>TD</sub> = {(v, i): i = î(v)}.<br><b>Independent voltage source:</b> R<sub>vs</sub> = {(v, i): v = v<sub>s</sub>(t), −∞ &lt; i &lt; ∞}. <b>Current source:</b> R<sub>is</sub> = {(v, i): i = i<sub>s</sub>(t), −∞ &lt; v &lt; ∞}.<br><b>Time-varying resistor:</b> the v-i characteristic changes with time. The linear one: v(t) = R(t)i(t), i(t) = G(t)v(t).`)},
 {type:'task',setup:controlTask,
  say:L_(`<b>Kontrollü mü, değil mi?</b> 🕹️<br>• <b>Gerilim kontrollü:</b> her v için tek bir i var → i = î(v)<br>• <b>Akım kontrollü:</b> her i için tek bir v var → v = v̂(i)<br><br>Sürgülerle turuncu <b>dikey</b> çizgiyi (v sabit) ve mavi <b>yatay</b> çizgiyi (i sabit) gezdir, kesişimleri say. Sonra iki soruyu cevapla. (5 eleman)`,`<b>Controlled or not?</b> 🕹️<br>• <b>Voltage-controlled:</b> exactly one i for each v → i = î(v)<br>• <b>Current-controlled:</b> exactly one v for each i → v = v̂(i)<br><br>Use the sliders to sweep the orange <b>vertical</b> line (fixed v) and the blue <b>horizontal</b> line (fixed i), and count the intersections. Then answer the two questions. (5 elements)`)},
 {type:'talk',visual:vSerPar,
  say:L_(`2-uçlu dirençleri <b>seri</b> ya da <b>paralel</b> bağlayınca yeni bir <b>1-kapılı</b> elde ederiz. Amaç: kapı akımı i ile kapı gerilimi v arasındaki bağıntıyı bulmak.<br><br>Tarif hep aynı: <span class="k">KAY + KGY + ETB</span><br>• Seri: aynı akım → v = v̂₁(i) + v̂₂(i)<br>• Paralel: aynı gerilim → i = î₁(v) + î₂(v)`,`Connecting 2-terminal resistors in <b>series</b> or <b>parallel</b> gives a new <b>one-port</b>. Goal: find the relation between the port current i and port voltage v.<br><br>The recipe is always the same: <span class="k">KCL + KVL + branch equations</span><br>• Series: same current → v = v̂₁(i) + v̂₂(i)<br>• Parallel: same voltage → i = î₁(v) + î₂(v)`),
  formal:L_(`<b>Seri:</b> ETB: v₁ = v̂₁(i₁), v₂ = v̂₂(i₂). KAY: i = i₁ = i₂. KGY (1-2-3-1 düğüm dizisi): v = v₁ + v₂ ⇒ v = v̂₁(i) + v̂₂(i) ≙ v̂(i).<br>İkinci eleman ters bağlıysa: v = v̂₁(i) − v̂₂(−i).<br><b>Paralel:</b> ETB: i₁ = î₁(v₁), i₂ = î₂(v₂). KGY (2 referans): v = v₁ = v₂. KAY (1. düğüm): i = i₁ + i₂ ⇒ i = î₁(v) + î₂(v) ≙ î(v).<br><b>Örnek:</b> R ile E seri ise v = Ri + E.`,`<b>Series:</b> branch eqs: v₁ = v̂₁(i₁), v₂ = v̂₂(i₂). KCL: i = i₁ = i₂. KVL (node sequence 1-2-3-1): v = v₁ + v₂ ⇒ v = v̂₁(i) + v̂₂(i) ≙ v̂(i).<br>If the second element is reversed: v = v̂₁(i) − v̂₂(−i).<br><b>Parallel:</b> branch eqs: i₁ = î₁(v₁), i₂ = î₂(v₂). KVL (datum 2): v = v₁ = v₂. KCL (node 1): i = i₁ + i₂ ⇒ i = î₁(v) + î₂(v) ≙ î(v).<br><b>Example:</b> R in series with E gives v = Ri + E.`)},
 {type:'task',setup:comboTask,
  say:L_(`Slayttaki soru 📈: karakteristikleri verilen <b>R₁</b> (pembe) ve <b>R₂</b> (mavi) önce <b>paralel</b> (a), sonra <b>seri</b> (b) bağlanıyor. Bileşik karakteristiği nokta nokta kuracağız.<br><br>Önce neyin <b>ortak</b> olduğunu seç, sonra toplamı yaz. Kırılma noktalarına dikkat: karakteristik parça parça doğrulardan oluşuyor.`,`The problem from the slides 📈: <b>R₁</b> (pink) and <b>R₂</b> (blue) with the given characteristics are connected first in <b>parallel</b> (a), then in <b>series</b> (b). We'll build the composite characteristic point by point.<br><br>First choose what is <b>common</b>, then write the sum. Watch the breakpoints: the characteristics are piecewise-linear.`)},
 {type:'quiz',say:L_(`Direnç sınavı! 🔌`,`Resistor quiz! 🔌`),questions:[
  {q:L_('Yatay eksen v, dikey eksen i (v-i düzlemi). Bu karakteristik hangi elemanın?',`Horizontal axis v, vertical axis i (v-i plane). Whose characteristic is this?`),opts:[L_('Açık devre',`Open circuit`),L_('Kısa devre',`Short circuit`),L_('Bağımsız gerilim kaynağı',`Independent voltage source`),L_('R = 1 Ω direnç',`R = 1 Ω resistor`)],a:0,why:L_('Her v için i = 0 → açık devre (R = ∞, G = 0).',`i = 0 for every v → open circuit (R = ∞, G = 0).`),fig:svg=>{const P=plotter({xr:[-3,3],yr:[-3,3],id:'q1'});svg.innerHTML=P.base+P.pl([[-9,0],[9,0]],'s1')}},
  {q:L_('Bağımsız gerilim kaynağı (v<sub>s</sub> = 3 V) lineer bir eleman mıdır?',`Is an independent voltage source (v<sub>s</sub> = 3 V) a linear element?`),opts:[L_('Hayır, karakteristiği orijinden geçmiyor',`No, its characteristic does not pass through the origin`),L_('Evet, karakteristiği bir doğru',`Yes, its characteristic is a straight line`)],a:0,why:L_('(3 V, 1 A) karakteristikte var ama 2 katı (6 V, 2 A) yok. Lineerlik bozuluyor.',`(3 V, 1 A) is on the characteristic but twice that, (6 V, 2 A), is not. Linearity fails.`)},
  {q:L_('Bağımsız gerilim kaynağı hangisidir?',`Which describes an independent voltage source?`),opts:[L_('Akım kontrollü, gerilim kontrollü değil',`Current-controlled, not voltage-controlled`),L_('Gerilim kontrollü, akım kontrollü değil',`Voltage-controlled, not current-controlled`),L_('İkisi de',`Both`),L_('Hiçbiri',`Neither`)],a:0,why:L_('Her i için v = v<sub>s</sub> tek → akım kontrollü. v ≠ v<sub>s</sub> için akım yok → gerilim kontrollü değil.',`For every i, v = v<sub>s</sub> is unique → current-controlled. For v ≠ v<sub>s</sub> there is no current → not voltage-controlled.`)},
  {q:L_('İdeal diyot tıkamadayken (v &lt; 0) hangi eleman gibi davranır?',`How does an ideal diode behave when reverse-biased (v &lt; 0)?`),opts:[L_('Açık devre',`Open circuit`),L_('Kısa devre',`Short circuit`),L_('Akım kaynağı',`Current source`)],a:0,why:L_('Tıkamada i = 0 → açık devre. İletimde (i &gt; 0) v = 0 → kısa devre.',`Reverse-biased: i = 0 → open circuit. Conducting (i &gt; 0): v = 0 → short circuit.`)},
  {q:L_('Bu karakteristik (v-i düzlemi) için hangisi doğru?',`Which is true for this characteristic (v-i plane)?`),opts:[L_('Gerilim kontrollü, akım kontrollü değil',`Voltage-controlled, not current-controlled`),L_('Akım kontrollü, gerilim kontrollü değil',`Current-controlled, not voltage-controlled`),L_('İkisi de',`Both`),'Lineer'],a:0,why:L_('Tünel diyot: her v için tek i var, ama bazı akımlara üç gerilim düşüyor.',`Tunnel diode: one i for each v, but some currents correspond to three voltages.`),fig:svg=>{const P=plotter({xr:[-1,4],yr:[-1,5],id:'q2'});svg.innerHTML=P.base+P.fn(tunnel,'s3')}},
  {q:L_('R = 4 Ω\'luk lineer direncin duali nedir?',`What is the dual of a linear 4 Ω resistor?`),opts:[L_('R = 0.25 Ω direnç',`R = 0.25 Ω resistor`),L_('R = −4 Ω direnç',`R = −4 Ω resistor`),L_('R = 4 Ω direnç',`R = 4 Ω resistor`),L_('Açık devre',`Open circuit`)],a:0,why:L_('A: i = v/4. B\'nin i-v karakteristiği aynı: v = i/4 → R = 0.25 Ω.',`A: i = v/4. B has the same i-v characteristic: v = i/4 → R = 0.25 Ω.`)},
  {q:L_('R &lt; 0 olan lineer direnç için ani güç p = R·i² ne söyler?',`For a linear resistor with R &lt; 0, what does the instantaneous power p = R·i² tell us?`),opts:[L_('p ≤ 0, eleman güç verir',`p ≤ 0, the element delivers power`),L_('p ≥ 0, eleman güç alır',`p ≥ 0, the element absorbs power`),'p = 0'],a:0,why:L_('i² ≥ 0 ve R &lt; 0 → p ≤ 0. Negatif direnç aktif bir elemandır.',`i² ≥ 0 and R &lt; 0 → p ≤ 0. A negative resistor is an active element.`)},
  {q:L_('R direnci ile E gerilim kaynağı seri bağlanınca 1-kapılının tanım bağıntısı?',`Resistor R in series with voltage source E: the one-port's characteristic?`),opts:['v = Ri + E','v = Ri − E','i = (v + E)/R','v = E'],a:0,why:L_('KAY: aynı akım i. KGY: v = v<sub>R</sub> + v<sub>E</sub> = Ri + E.',`KCL: same current i. KVL: v = v<sub>R</sub> + v<sub>E</sub> = Ri + E.`)},
  {q:L_('Akım kontrollü iki direnç seri bağlanırsa elde edilen 1-kapılı?',`Two current-controlled resistors in series give which one-port?`),opts:[L_('Akım kontrollü: v = v̂₁(i) + v̂₂(i)',`Current-controlled: v = v̂₁(i) + v̂₂(i)`),L_('Gerilim kontrollü: i = î₁(v) + î₂(v)',`Voltage-controlled: i = î₁(v) + î₂(v)`),L_('Hiçbiri',`Neither`)],a:0,why:L_('Seride akım ortak (KAY). Her eleman akımla tanımlıysa toplam gerilim de akımın fonksiyonu.',`In series the current is common (KCL). If each element is defined by current, the total voltage is a function of current too.`)},
  {q:L_('Paralel bağlı iki dirençte hangisi doğrudur?',`Which is true for two resistors in parallel?`),opts:[L_('Gerilimler eşit, akımlar toplanır',`Voltages equal, currents add`),L_('Akımlar eşit, gerilimler toplanır',`Currents equal, voltages add`),L_('İkisi de eşit',`Both equal`)],a:0,why:L_('KGY: v = v₁ = v₂. KAY: i = i₁ + i₂.',`KVL: v = v₁ = v₂. KCL: i = i₁ + i₂.`)}
 ]}
]},

{id:'c7',icon:'🎯',title:L_('DC Çalışma Noktası ve Küçük İşaret',`DC Operating Point and Small-Signal Analysis`),sub:L_('Ders 6',`Lecture 6`),pos:[58,46],steps:[
 {type:'talk',visual:vDCsplit,
  say:L_(`<b>DC çalışma noktası</b> 🎯<br>DC girişli bir devrenin çözümlerine <b>çalışma noktaları</b> denir. DC analizi bu noktaları bulmaktır.<br><br>Devreyi iki parçaya ayır: N<sub>a</sub> ve N<sub>b</sub>. Her biri kendi bağıntısını söyler. Bağlantı noktasında KAY ve KGY'yi yaz. İki eğrinin <b>kesişimi</b> çalışma noktasıdır!`,`<b>DC operating point</b> 🎯<br>The solutions of a circuit with DC inputs are called <b>operating points</b>. DC analysis means finding these points.<br><br>Split the circuit into two parts: N<sub>a</sub> and N<sub>b</sub>. Each states its own relation. Write KCL and KVL at the connection. The <b>intersection</b> of the two curves is the operating point!`),
  formal:L_(`<b>Giriş:</b> bağımsız akım kaynağı ve/veya bağımsız gerilim kaynağı. <b>Çıkış:</b> ilgilenilen akım ve/veya gerilim.<br>DC girişli bir devreye ilişkin çözümlere çalışma noktaları adı verilir. DC analizi çalışma noktalarının bulunmasıdır.<br>KAY: i<sub>a</sub> = −i<sub>b</sub>, i ≙ i<sub>a</sub>. KGY: v<sub>a</sub> = v<sub>b</sub> ≙ v. ETB: f<sub>a</sub>(v, i) = 0, f<sub>b</sub>(v, −i) = 0. Bu iki bağıntının çözümü DC çalışma noktalarını verir.`,`<b>Input:</b> independent current and/or voltage sources. <b>Output:</b> the current and/or voltage of interest.<br>The solutions of a circuit with DC inputs are called operating points. DC analysis is finding the operating points.<br>KCL: i<sub>a</sub> = −i<sub>b</sub>, i ≙ i<sub>a</sub>. KVL: v<sub>a</sub> = v<sub>b</sub> ≙ v. Branch eqs: f<sub>a</sub>(v, i) = 0, f<sub>b</sub>(v, −i) = 0. The solutions of these two relations are the DC operating points.`)},
 {type:'task',setup:dcCountTask,
  say:L_(`Bir I<sub>s</sub> akım kaynağı bir direnci besliyor. KAY: elemanın akımı i = I<sub>s</sub>. Bu, grafikte <b>yatay bir çizgi</b>.<br><br>Çözüm üç türlü olabilir: <b>tek çözüm</b>, <b>çok çözüm</b>, <b>çözüm yok</b>. Elemanı değiştir, I<sub>s</sub>'i kaydır ve üç durumu da bul!`,`A current source I<sub>s</sub> drives a resistor. KCL: the element current is i = I<sub>s</sub>. On the plot that is a <b>horizontal line</b>.<br><br>There are three possibilities: <b>unique solution</b>, <b>multiple solutions</b>, <b>no solution</b>. Change the element, slide I<sub>s</sub>, and find all three!`)},
 {type:'task',setup:loadLineTask,
  say:L_(`Slayttaki soru: N<sub>b</sub> = R<sub>b</sub> ile E<sub>b</sub> seri, N<sub>a</sub> = lineer olmayan direnç i<sub>a</sub> = 4v<sub>a</sub>².<br><br>N<sub>b</sub>'nin bağıntısı N<sub>a</sub>'nın düzleminde bir doğru verir: <span class="k">i = (E<sub>b</sub> − v)/R<sub>b</sub></span>. Buna <b>yük doğrusu</b> denir.<br><br>Sürgülerle oyna, sonra E<sub>b</sub> = 5 V, R<sub>b</sub> = 1 Ω için çalışma noktalarının gerilimlerini bul.`,`The problem from the slides: N<sub>b</sub> = R<sub>b</sub> in series with E<sub>b</sub>, N<sub>a</sub> = nonlinear resistor i<sub>a</sub> = 4v<sub>a</sub>².<br><br>N<sub>b</sub>'s relation is a straight line in N<sub>a</sub>'s plane: <span class="k">i = (E<sub>b</sub> − v)/R<sub>b</sub></span>. This is the <b>load line</b>.<br><br>Play with the sliders, then find the operating-point voltages for E<sub>b</sub> = 5 V, R<sub>b</sub> = 1 Ω.`)},
 {type:'talk',visual:vSmallSig,mood:'wow',
