  say:L_(`<b>Küçük işaret analizi</b> 🌊<br>DC kaynağa küçük bir sinüs ekleyelim: E<sub>b</sub> + v<sub>m</sub> sin ωt. Yük doğrusu <b>paralel kayarak</b> ileri geri sallanır, çalışma noktası da eğri üzerinde Q civarında gezinir.<br><br>Q'ya yakından bakınca eğri bir <b>doğru</b> gibi görünür (turuncu kesikli). Eğimi <span class="k">G = dî/dv |<sub>V<sub>Q</sub></sub></span>: küçük işaret iletkenliği.<br><br>v<sub>m</sub>'yi büyüt: G·ṽ yaklaşımı gerçek ĩ'dan uzaklaşmaya başlar.`,`<b>Small-signal analysis</b> 🌊<br>Add a small sinusoid to the DC source: E<sub>b</sub> + v<sub>m</sub> sin ωt. The load line <b>shifts parallel to itself</b> back and forth, and the operating point moves along the curve around Q.<br><br>Zoomed in near Q, the curve looks like a <b>straight line</b> (orange dashed). Its slope <span class="k">G = dî/dv |<sub>V<sub>Q</sub></sub></span> is the small-signal conductance.<br><br>Increase v<sub>m</sub>: the approximation G·ṽ starts to drift away from the exact ĩ.`),
  formal:L_(`<b>Varsayım:</b> v<sub>m</sub> ≪ E<sub>b</sub> ⇒ ṽ(t) ≪ V<sub>Q</sub>.<br><b>Taylor:</b> f(x) = f(x<sub>a</sub>) + f′(x<sub>a</sub>)(x − x<sub>a</sub>) + ½f″(x<sub>a</sub>)(x − x<sub>a</sub>)² + …<br>i(t) ≅ î(V<sub>Q</sub>) + dî/dv|<sub>v=V<sub>Q</sub></sub> (v(t) − V<sub>Q</sub>) ⇒ i(t) − I<sub>Q</sub> ≅ dî/dv|<sub>V<sub>Q</sub></sub> (v(t) − V<sub>Q</sub>)<br>ĩ(t) ≅ G·ṽ(t), G: <b>küçük işaret iletkenliği</b>.`,`<b>Assumption:</b> v<sub>m</sub> ≪ E<sub>b</sub> ⇒ ṽ(t) ≪ V<sub>Q</sub>.<br><b>Taylor:</b> f(x) = f(x<sub>a</sub>) + f′(x<sub>a</sub>)(x − x<sub>a</sub>) + ½f″(x<sub>a</sub>)(x − x<sub>a</sub>)² + …<br>i(t) ≅ î(V<sub>Q</sub>) + dî/dv|<sub>v=V<sub>Q</sub></sub> (v(t) − V<sub>Q</sub>) ⇒ i(t) − I<sub>Q</sub> ≅ dî/dv|<sub>V<sub>Q</sub></sub> (v(t) − V<sub>Q</sub>)<br>ĩ(t) ≅ G·ṽ(t), G: <b>small-signal conductance</b>.`)},
 {type:'talk',visual:vSSsteps,
  say:L_(`Sınavda küçük işaret sorusu hep bu 4 adımla çözülür 📋<br><br>En sık hata 3. adımda olur. DC kaynakları "silmek" demek değerlerini <b>sıfır</b> yapmak demek:<br>• 0 V'luk gerilim kaynağı = <b>kısa devre</b><br>• 0 A'lik akım kaynağı = <b>açık devre</b>`,`In the exam a small-signal problem is always solved in these 4 steps 📋<br><br>The most common mistake is in step 3. "Removing" DC sources means setting their values to <b>zero</b>:<br>• a 0 V voltage source = <b>short circuit</b><br>• a 0 A current source = <b>open circuit</b>`)},
 {type:'task',setup:chainTask({fig:(svg,k)=>circEx1(svg,k>=5),steps:EX1STEPS}),
  say:L_(`Slayttaki örnek 📝<br>a) DC analizini yap, çalışma noktalarını belirle.<br>b) Lineer olmayan elemanı çalışma noktası civarında lineerleştir, küçük işaret eşdeğerini bul.<br><br>Adım adım gidiyoruz. Hata yaparsan ipucu gelir.`,`Example from the slides 📝<br>a) Perform the DC analysis and find the operating points.<br>b) Linearize the nonlinear element around an operating point and find the small-signal equivalent.<br><br>We go step by step. If you make a mistake, a hint appears.`)},
 {type:'quiz',say:L_(`Çalışma noktası ustası mısın? 🎯`,`Are you an operating-point master? 🎯`),questions:[
  {q:L_('DC çalışma noktası nedir?',`What is a DC operating point?`),opts:[L_('DC girişli bir devrenin çözümleri',`A solution of a circuit with DC inputs`),L_('Devredeki en büyük akım',`The largest current in the circuit`),L_('Karakteristiğin orijinden geçtiği nokta',`The point where the characteristic passes through the origin`)],a:0,why:L_('DC girişli bir devreye ilişkin çözümlere çalışma noktaları denir.',`The solutions of a circuit with DC inputs are called operating points.`)},
  {q:L_('I<sub>s</sub> akım kaynağı tünel diyodu besliyor. Kaç çalışma noktası olabilir?',`A current source I<sub>s</sub> drives a tunnel diode. How many operating points can there be?`),opts:[L_('I<sub>s</sub>\'nin değerine göre 1, 2 ya da 3',`1, 2 or 3 depending on I<sub>s</sub>`),L_('Her zaman 1',`Always 1`),L_('Her zaman 3',`Always 3`)],a:0,why:L_('Yatay çizgi i = I<sub>s</sub>, tepe ile çukur arasındaysa eğriyi üç yerde keser.',`The horizontal line i = I<sub>s</sub> cuts the curve at three points if it lies between the peak and the valley.`)},
  {q:L_('N<sub>a</sub> ile N<sub>b</sub> bağlanınca (şekildeki yönlerle) KAY ve KGY ne der?',`When N<sub>a</sub> and N<sub>b</sub> are connected (with the directions in the figure), what do KCL and KVL say?`),opts:['i<sub>a</sub> = −i<sub>b</sub>, v<sub>a</sub> = v<sub>b</sub>','i<sub>a</sub> = i<sub>b</sub>, v<sub>a</sub> = −v<sub>b</sub>','i<sub>a</sub> = i<sub>b</sub>, v<sub>a</sub> = v<sub>b</sub>'],a:0,why:L_('Düğümden biri N<sub>a</sub>\'ya, diğeri N<sub>b</sub>\'ye doğru çıkıyor: i<sub>a</sub> + i<sub>b</sub> = 0. Gerilimler aynı iki düğüm arasında.',`One current leaves the node toward N<sub>a</sub>, the other toward N<sub>b</sub>: i<sub>a</sub> + i<sub>b</sub> = 0. The voltages are across the same two nodes.`)},
  {q:L_('Küçük işaret iletkenliği G nedir?',`What is the small-signal conductance G?`),opts:[L_('Karakteristiğin Q\'daki eğimi: dî/dv |<sub>V<sub>Q</sub></sub>',`The slope of the characteristic at Q: dî/dv |<sub>V<sub>Q</sub></sub>`),'I<sub>Q</sub> / V<sub>Q</sub>',L_('Karakteristiğin orijindeki eğimi',`The slope of the characteristic at the origin`)],a:0,why:L_('Taylor serisinin birinci mertebe terimi. Dikkat: I<sub>Q</sub>/V<sub>Q</sub> değil, türev!',`The first-order term of the Taylor series. Careful: not I<sub>Q</sub>/V<sub>Q</sub>, but the derivative!`)},
  {q:L_('Küçük işaret eşdeğer devresinde DC gerilim kaynağı ne olur?',`What happens to a DC voltage source in the small-signal equivalent circuit?`),opts:[L_('Kısa devre',`Short circuit`),L_('Açık devre',`Open circuit`),L_('Aynen kalır',`Stays as it is`)],a:0,why:L_('Değeri sıfırlanır: v = 0 → kısa devre. DC akım kaynağı ise açık devre olur.',`Its value is zeroed: v = 0 → short circuit. A DC current source becomes an open circuit.`)},
  {q:L_('Q noktası tünel diyodun negatif eğimli bölgesindeyse G?',`If Q lies in the negative-slope region of the tunnel diode, G is?`),opts:['Negatif','Pozitif',L_('Sıfır',`Zero`)],a:0,why:L_('G eğimin kendisi. V₁ &lt; v &lt; V₂ aralığında eğim negatif → G &lt; 0.',`G is the slope itself. For V₁ &lt; v &lt; V₂ the slope is negative → G &lt; 0.`)},
  {q:L_('Küçük işaret analizi hangi varsayıma dayanır?',`Small-signal analysis rests on which assumption?`),opts:[L_('v<sub>m</sub> ≪ E<sub>b</sub>, yani ṽ ≪ V<sub>Q</sub>',`v<sub>m</sub> ≪ E<sub>b</sub>, i.e. ṽ ≪ V<sub>Q</sub>`),L_('Eleman lineer olmalı',`The element must be linear`),'v<sub>m</sub> = E<sub>b</sub>'],a:0,why:L_('Küçük sapmalarda Taylor serisinin ilk terimi yeterli olur.',`For small deviations the first term of the Taylor series is sufficient.`)}
 ]}
]},
/* ---------------- 8 ---------------- */
{id:'c8',icon:'🔲',title:L_('2-Kapılılar',`Two-Ports`),sub:L_('Ders 6',`Lecture 6`),pos:[36,50],steps:[
 {type:'talk',visual:vPorts,
  say:L_(`<b>Çok-uçlu direnç elemanları</b> 🔲<br>3-uçlu bir elemanda bir ucu (d₃) ortak alırsak iki <b>kapı</b> oluşur: 2-kapılı.<br><br>4 büyüklük var: v₁, v₂, i₁, i₂. Bunlar arasında 2 denklem var. Yani ikisini seçersen diğer ikisi belli olur.<br><br>4 büyüklükten 2 seçmenin yolu: <span class="k">C(4, 2) = 6</span> → lineer 2-kapılılar için 6 gösterim.`,`<b>Multiterminal resistive elements</b> 🔲<br>Taking one terminal (d₃) of a 3-terminal element as common gives two <b>ports</b>: a two-port.<br><br>There are 4 variables: v₁, v₂, i₁, i₂, related by 2 equations. So if you pick two, the other two are determined.<br><br>Ways to pick 2 of 4: <span class="k">C(4, 2) = 6</span> → 6 representations for linear two-ports.`),
  formal:L_(`3-uçluyu tanımlayan uç büyüklükleri v₁, v₂, i₁, i₂. 2-kapılıyı tanımlayan kapı büyüklükleri v₁, v₂, i₁, i₂.<br>2-kapılı direnç elemanını tanımlamak için 4 büyüklük ve iki denklem var: f₁(v₁, v₂, i₁, i₂) = 0, f₂(v₁, v₂, i₁, i₂) = 0.<br>C(4, 2) = 4! / (2!(4 − 2)!) = 6. <small>(Chua–Desoer–Kuh sf. 116–133)</small>`,`The terminal variables of the 3-terminal element are v₁, v₂, i₁, i₂. The port variables of the two-port are v₁, v₂, i₁, i₂.<br>A resistive two-port is described by 4 variables and two equations: f₁(v₁, v₂, i₁, i₂) = 0, f₂(v₁, v₂, i₁, i₂) = 0.<br>C(4, 2) = 4! / (2!(4 − 2)!) = 6. <small>(Chua–Desoer–Kuh pp. 116–133)</small>`)},
 {type:'task',setup:repTask,
  say:L_(`<b>6 gösterimi bul!</b> 🔍<br>Şekildeki büyüklüklerden <b>iki tanesini</b> seç: bunlar "bağımsız" (kontrol eden) büyüklükler olsun. Ben gösterimin adını ve matris biçimini yazacağım.<br><br>Bağımsız büyüklük akımsa o kapıya <b>akım kaynağı</b>, gerilimse <b>gerilim kaynağı</b> bağlanır. Slayttaki şekiller tam olarak bu!`,`<b>Find the 6 representations!</b> 🔍<br>Choose <b>two</b> of the variables in the figure as the "independent" (controlling) variables. I'll write the name and matrix form of the representation.<br><br>If an independent variable is a current, a <b>current source</b> drives that port; if it is a voltage, a <b>voltage source</b>. That's exactly what the slide figures show!`)},
 {type:'task',setup:measureTask,
  say:L_(`<b>Ölçüm laboratuvarı</b> 🧪<br>İçinde ne olduğunu bilmediğimiz bir kutu var. Akım kontrollü: v = R·i.<br><br>Sürgülerle i₁ ve i₂'yi ayarla, voltmetreleri oku, "Ölç ve kaydet" ile tabloya yaz. Sonra R matrisinin 4 elemanını bul.<br><br>💡 Püf noktası: bir akımı <b>sıfır</b> yaparsan (o kapıyı açık devre bırakırsan) denklemler sadeleşir.`,`<b>Measurement lab</b> 🧪<br>There is a box whose contents we don't know. Current-controlled: v = R·i.<br><br>Set i₁ and i₂ with the sliders, read the voltmeters, record with "Measure and record". Then find the 4 entries of R.<br><br>💡 Trick: if you set one current to <b>zero</b> (leave that port open-circuited) the equations simplify.`)},
 {type:'talk',visual:vCtrl,
  say:L_(`<b>Bağımlı (kontrollü) kaynaklar</b> da 2-kapılıdır 💎<br>Giriş kapısı bir büyüklüğü "okur", çıkış kapısı ona orantılı bir kaynak üretir.<br><br>Her birinin doğal gösterimi farklı. Örneğin AKAK'ta bağımsız büyüklükler i₁ ve v₂ → <b>Hibrit 1 (H)</b>.<br><br>Elmas şekli = bağımlı kaynak, daire = bağımsız kaynak.`,`<b>Dependent (controlled) sources</b> are two-ports too 💎<br>The input port "senses" a variable and the output port produces a source proportional to it.<br><br>Each one has a different natural representation. E.g. for a CCCS the independent variables are i₁ and v₂ → <b>hybrid 1 (H)</b>.<br><br>Diamond = dependent source, circle = independent source.`),
  formal:L_(`<b>AKGK:</b> v₁ = 0, v₂ = r<sub>m</sub>i₁ · <b>GKAK:</b> i₁ = 0, i₂ = g<sub>m</sub>v₁ · <b>AKAK:</b> v₁ = 0, i₂ = αi₁ · <b>GKGK:</b> i₁ = 0, v₂ = µv₁.`,`<b>CCVS:</b> v₁ = 0, v₂ = r<sub>m</sub>i₁ · <b>VCCS:</b> i₁ = 0, i₂ = g<sub>m</sub>v₁ · <b>CCCS:</b> v₁ = 0, i₂ = αi₁ · <b>VCVS:</b> i₁ = 0, v₂ = µv₁.`)},
 {type:'talk',visual:vXfmr,
  say:L_(`<b>İdeal transformatör</b> (n : 1) 🔁<br>v₁ = n·v₂ ve i₂ = −n·i₁. Hibrit 1 gösterimi: H = [[0, n], [−n, 0]].<br><br>Sürgülerle oyna: p₁ ne olursa olsun p₂ = −p₁, yani toplam güç <b>hep 0</b>. Transformatör enerji üretmez de harcamaz da, sadece aktarır.<br><br><b>Jiratör</b> de böyle: i = G·v, G = [[0, G], [−G, 0]], p = 0.`,`<b>Ideal transformer</b> (n : 1) 🔁<br>v₁ = n·v₂ and i₂ = −n·i₁. Hybrid-1 representation: H = [[0, n], [−n, 0]].<br><br>Play with the sliders: whatever p₁ is, p₂ = −p₁, so the total power is <b>always 0</b>. The transformer neither generates nor dissipates energy; it only transfers it.<br><br>The <b>gyrator</b> is the same: i = G·v, G = [[0, G], [−G, 0]], p = 0.`),
  formal:L_(`<b>İdeal transformatör:</b> ${vec('v₁','i₂')} = ${mat2('0','n','−n','0')} ${vec('i₁','v₂')}<br>p(t) = v₁i₁ + v₂i₂ = v₁i₁ − (1/n)v₁·n·i₁ = 0.<br><b>Jiratör:</b> ${vec('i₁','i₂')} = ${mat2('0','G','−G','0')} ${vec('v₁','v₂')}`,`<b>Ideal transformer:</b> ${vec('v₁','i₂')} = ${mat2('0','n','−n','0')} ${vec('i₁','v₂')}<br>p(t) = v₁i₁ + v₂i₂ = v₁i₁ − (1/n)v₁·n·i₁ = 0.<br><b>Gyrator:</b> ${vec('i₁','i₂')} = ${mat2('0','G','−G','0')} ${vec('v₁','v₂')}`)},
 {type:'quiz',say:L_(`2-kapılı finali! 🔲`,`Two-port final! 🔲`),questions:[
  {q:L_('Lineer bir 2-kapılı için kaç farklı gösterim vardır?',`How many different representations does a linear two-port have?`),opts:['6','4','2','8'],a:0,why:L_('4 büyüklükten bağımsız olacak 2 tanesini seçmenin yolu C(4, 2) = 6.',`The number of ways to choose 2 independent variables out of 4: C(4, 2) = 6.`)},
  {q:L_('Akım kontrollü gösterimde r₁₁ nasıl ölçülür?',`How is r₁₁ measured in the current-controlled representation?`),opts:[L_('i₂ = 0 (2. kapı açık devre) iken v₁/i₁',`v₁/i₁ with i₂ = 0 (port 2 open-circuited)`),L_('v₂ = 0 (2. kapı kısa devre) iken v₁/i₁',`v₁/i₁ with v₂ = 0 (port 2 short-circuited)`),L_('i₁ = 0 iken v₁/i₂',`v₁/i₂ with i₁ = 0`)],a:0,why:L_('v₁ = r₁₁i₁ + r₁₂i₂. i₂ = 0 olunca v₁ = r₁₁i₁.',`v₁ = r₁₁i₁ + r₁₂i₂. With i₂ = 0, v₁ = r₁₁i₁.`)},
  {q:L_('Hibrit 1 (H) gösteriminde bağımsız büyüklükler hangileri?',`Which are the independent variables of the hybrid-1 (H) representation?`),opts:[L_('i₁ ve v₂',`i₁ and v₂`),L_('v₁ ve i₂',`v₁ and i₂`),L_('i₁ ve i₂',`i₁ and i₂`),L_('v₂ ve i₂',`v₂ and i₂`)],a:0,why:L_('[v₁; i₂] = H·[i₁; v₂]. 1. kapıya akım, 2. kapıya gerilim kaynağı bağlanır.',`[v₁; i₂] = H·[i₁; v₂]. A current source drives port 1, a voltage source port 2.`)},
  {q:L_('Akım kontrollü akım kaynağı (i₂ = αi₁, v₁ = 0) hangi gösterimle yazılır?',`Which representation describes a current-controlled current source (i₂ = αi₁, v₁ = 0)?`),opts:[L_('Hibrit 1: H = [[0, 0], [α, 0]]',`Hybrid 1: H = [[0, 0], [α, 0]]`),L_('Akım kontrollü: R = [[0, 0], [α, 0]]',`Current-controlled: R = [[0, 0], [α, 0]]`),L_('Gerilim kontrollü: G = [[0, 0], [α, 0]]',`Voltage-controlled: G = [[0, 0], [α, 0]]`)],a:0,why:L_('v₁ ve i₂\'yi i₁ ve v₂ cinsinden yazıyoruz: v₁ = 0, i₂ = αi₁ → H.',`We write v₁ and i₂ in terms of i₁ and v₂: v₁ = 0, i₂ = αi₁ → H.`)},
  {q:L_('Gerilim kontrollü akım kaynağı (i₁ = 0, i₂ = g<sub>m</sub>v₁) hangi gösterime uyar?',`Which representation fits a voltage-controlled current source (i₁ = 0, i₂ = g<sub>m</sub>v₁)?`),opts:[L_('Gerilim kontrollü: G = [[0, 0], [g<sub>m</sub>, 0]]',`Voltage-controlled: G = [[0, 0], [g<sub>m</sub>, 0]]`),L_('Akım kontrollü',`Current-controlled`),'Transmisyon'],a:0,why:L_('i₁ ve i₂, v₁ ve v₂ cinsinden yazılıyor → i = G·v.',`i₁ and i₂ are written in terms of v₁ and v₂ → i = G·v.`)},
  {q:L_('İdeal transformatörün herhangi bir anda çektiği toplam güç?',`Total power absorbed by an ideal transformer at any instant?`),opts:['0','v₁i₁','n·v₁i₁','Belirlenemez'],a:0,why:'p = v₁i₁ + v₂i₂ = v₁i₁ − (v₁/n)(n·i₁) = 0.'},
  {q:L_('Transmisyon 1 gösterimi neyi neyin cinsinden yazar?',`The transmission-1 representation writes what in terms of what?`),opts:[L_('(v₁, i₁)\'i (v₂, −i₂) cinsinden',`(v₁, i₁) in terms of (v₂, −i₂)`),L_('(v₁, v₂)\'yi (i₁, i₂) cinsinden',`(v₁, v₂) in terms of (i₁, i₂)`),L_('(i₁, v₂)\'yi (v₁, i₂) cinsinden',`(i₁, v₂) in terms of (v₁, i₂)`)],a:0,why:L_('[v₁; i₁] = T·[v₂; −i₂]: bir kapının iki büyüklüğü, diğer kapınınkiler cinsinden.',`[v₁; i₁] = T·[v₂; −i₂]: the two variables of one port in terms of those of the other port.`)}
 ]}
]},
/* ---------------- 9 ---------------- */
{id:'c9',icon:'📝',title:L_('Vize Provası',`Midterm Practice`),sub:L_('Slayttaki sorular',`Problems from the slides`),pos:[14,46],steps:[
 {type:'talk',visual:stage=>{const {svg,status}=graphStage(stage);drawGraph(svg,G3,{ref:2});status.innerHTML=L_('<span class="chip">nd = 4</span><span class="chip">ne = 7</span><span class="chip">slayttaki 1, 2, 3, 4 düğümleri = a, b, c, d</span>',`<span class="chip">nd = 4</span><span class="chip">ne = 7</span><span class="chip">nodes 1, 2, 3, 4 in the slides = a, b, c, d</span>`)},
  say:L_(`📝 <b>Ders 5'teki sınav sorusu!</b><br>1 ve 3: <b>gerilim kaynakları</b> (v₁ = 1 V, v₃ = 3 V). 5 ve 7: <b>akım kaynakları</b> (i₅ = 5 A, i₇ = 7 A). 2, 4, 6: dirençler (1 Ω, 2 Ω, −1 Ω).<br><br>a) Tüm eleman akım ve gerilimlerini bulmana yardım edecek bir <b>ağaç</b> seç.<br>b) Temel kesitlemeler için KAY, temel çevreler için KGY yaz.<br>c) Bulduklarını nasıl sınarsın?<br><br>Uyumlu çift kullanılıyor: ok akımın yönü, + uç okun kuyruğunda.`,`📝 <b>The exam problem from Lecture 5!</b><br>1 and 3: <b>voltage sources</b> (v₁ = 1 V, v₃ = 3 V). 5 and 7: <b>current sources</b> (i₅ = 5 A, i₇ = 7 A). 2, 4, 6: resistors (1 Ω, 2 Ω, −1 Ω).<br><br>a) Choose a <b>tree</b> that helps you find all element currents and voltages.<br>b) Write KCL for the fundamental cut sets and KVL for the fundamental loops.<br>c) How can you check your results?<br><br>Associated reference directions are used: arrow = current direction, + at the arrow's tail.`)},
 {type:'task',setup:srcTreeTask,
  say:L_(`<b>a) Akıllı ağaç seçimi</b> 🌳<br>Her ağaç doğru olur ama bazıları işi <b>çok</b> kolaylaştırır:<br>• Dal gerilimleri bilinirse KGY ile tüm gerilimler bulunur.<br>• Kiriş akımları bilinirse KAY ile tüm akımlar bulunur.<br><br>O halde gerilim kaynakları nereye, akım kaynakları nereye gitmeli? 3 dal seç.`,`<b>a) Smart tree choice</b> 🌳<br>Any tree is correct, but some make the job <b>much</b> easier:<br>• If the tree-branch voltages are known, KVL gives all voltages.<br>• If the link currents are known, KCL gives all currents.<br><br>So where should the voltage sources go, and where the current sources? Choose 3 tree branches.`)},
 {type:'task',setup:fundCutTask(G3,()=>G3T),say:L_(`<b>b-1) Temel kesitlemeler</b> (ağaç {1, 2, 3}): her dalı kes, iki parçayı birleştiren kirişleri seç. Her biri bir KAY denklemi verir.`,`<b>b-1) Fundamental cut sets</b> (tree {1, 2, 3}): cut each tree branch and select the links joining the two parts. Each gives one KCL equation.`)},
 {type:'task',setup:fundLoopTask(G3,()=>G3T),say:L_(`<b>b-2) Temel çevreler</b>: her kiriş için halkayı kapatan dalları seç. Her biri bir KGY denklemi verir.`,`<b>b-2) Fundamental loops</b>: for each link select the tree branches that close the ring. Each gives one KVL equation.`)},
 {type:'task',setup:chainTask({fig:g3fig(G3STEPS),steps:G3STEPS}),
  say:L_(`Şimdi denklemleri <b>çözelim</b> 🧮 (referans: b düğümü)<br>Strateji: önce akım kaynaklarına bağlı akımları ve gerilimleri bul, sonra temel çevrelerle kiriş gerilimlerini, temel kesitlemelerle dal akımlarını bul. Bulduğun her değer grafa yazılacak (yeşil).`,`Now let's <b>solve</b> the equations 🧮 (datum: node b)<br>Strategy: first find the currents and voltages tied to the current sources, then the link voltages via fundamental loops and the tree-branch currents via fundamental cut sets. Each value you find is written on the graph (green).`)},
 {type:'task',setup:chainTask({fig:circEx2,steps:EX2STEPS}),
  say:L_(`📝 <b>Ders 6'daki soru!</b><br>a) Şekildeki devrenin tüm DC çalışma noktalarını belirle.<br>b) Birinin civarında lineer olmayan elemanın küçük işaret eşdeğerini bul.<br><br>Bu soruda gizli bir tuzak var, dikkat! 🕵️`,`📝 <b>The problem from Lecture 6!</b><br>a) Find all DC operating points of the circuit.<br>b) Find the small-signal equivalent of the nonlinear element around one of them.<br><br>There is a hidden trap in this one, careful! 🕵️`)}
 ]},
/* ---------------- 10 ---------------- */
{id:'c10',icon:'🔺',title:L_('Çok-Uçlular ve Tranzistör',`Multiterminal Elements and Transistors`),sub:L_('Ders 7',`Lecture 7`),pos:[9,78],steps:[
 {type:'task',setup:chainTask({fig:circPort,steps:EX7A}),
  say:L_(`Ders 7, slayttaki Chua sorusu 📝: <b>şekildeki 2-kapılıların tanım bağıntısını bul.</b><br><br>Tarif hep aynı: <span class="k">KAY + KGY + ETB</span>. Kapılara gerilim kaynağı bağladığını düşün (v₁, v₂ bilinsin), üst düğümlerde KAY yaz → <b>gerilim kontrollü</b> gösterim i = G·v çıkar.`,`Lecture 7, the Chua problem from the slides 📝: <b>find the characterization of the two-ports in the figure.</b><br><br>The recipe is always the same: <span class="k">KCL + KVL + branch equations</span>. Imagine voltage sources at the ports (v₁, v₂ known), write KCL at the top nodes → the <b>voltage-controlled</b> representation i = G·v.`),
  formal:L_(`Lineer 2-kapılı: v = R·i (akım kontrollü), i = G·v (gerilim kontrollü).<br>g₁₁ = i₁/v₁ |<sub>v₂ = 0</sub>, g₂₁ = i₂/v₁ |<sub>v₂ = 0</sub> (2. kapı kısa devre) …<br><b>Karşıtlık:</b> sadece lineer dirençlerden oluşan 2-kapılıda G = Gᵀ (g₁₂ = g₂₁).`,`Linear two-port: v = R·i (current-controlled), i = G·v (voltage-controlled).<br>g₁₁ = i₁/v₁ |<sub>v₂ = 0</sub>, g₂₁ = i₂/v₁ |<sub>v₂ = 0</sub> (port 2 short-circuited) …<br><b>Reciprocity:</b> for a two-port made only of linear resistors, G = Gᵀ (g₁₂ = g₂₁).`)},
 {type:'talk',visual:vFig3T,
  say:L_(`Slayt 10 🧩: 3-uçlu bir elemanın tanım bağıntısı <b>referans 3</b> ile verilmiş. Aynı elemanı <b>referans 2</b> olan uç-grafıyla (b) anlatmak istiyoruz.<br><br>Formül ezberi yok, sadece <b>KAY + KGY</b>:<br>• akımlar: î₁ = i₁, î₂ = i₃ = −(i₁ + i₂)<br>• gerilimler: v̂₁ = v₁₂, v̂₂ = v₃₂<br><br>Lineer cebir gözüyle bu bir <span class="k">değişken dönüşümü</span>: eski vektör = P · yeni vektör. Eleman aynı, sadece onu anlattığımız koordinatlar değişiyor.`,`Slide 10 🧩: the characterization of a 3-terminal element is given with <b>datum 3</b>. We want to describe the same element with the terminal graph (b) whose <b>datum is 2</b>.<br><br>No formula to memorize, just <b>KCL + KVL</b>:<br>• currents: î₁ = i₁, î₂ = i₃ = −(i₁ + i₂)<br>• voltages: v̂₁ = v₁₂, v̂₂ = v₃₂<br><br>In linear-algebra terms this is a <span class="k">change of variables</span>: old vector = P · new vector. The element is the same; only the coordinates we describe it in change.`),
  formal:L_(`${vec('i₁','i₂')} = ${mat2('1','0','−1','−1')} ${vec('î₁','î₂')} &nbsp; ${vec('v₁₃','v₂₃')} = ${mat2('1','−1','0','−1')} ${vec('v̂₁','v̂₂')}<br>İlginç: iki matrisin de karesi I, yani aynı matris geri dönüşü de yapar.<br><b>Güç değişmez:</b> v₁₃i₁ + v₂₃i₂ = v̂₁î₁ + v̂₂î₂ (referans seçimi gücü değiştirmez).`,`${vec('i₁','i₂')} = ${mat2('1','0','−1','−1')} ${vec('î₁','î₂')} &nbsp; ${vec('v₁₃','v₂₃')} = ${mat2('1','−1','0','−1')} ${vec('v̂₁','v̂₂')}<br>Interesting: both matrices square to I, so the same matrix also does the inverse transformation.<br><b>Power is invariant:</b> v₁₃i₁ + v₂₃i₂ = v̂₁î₁ + v̂₂î₂ (the choice of datum does not change power).`)},
 {type:'task',setup:chainTask({fig:fig3T,steps:EX7B}),
  say:L_(`a) Yeni uç-grafındaki büyüklükler cinsinden tanım bağıntısını bul.<br>b) Sadece 2-uçlu direnç ve bağımlı kaynakla bu elemanı kur.<br><br>Strateji: eski değişkenleri yenileri cinsinden yaz, verilen denklemlere <b>yerleştir</b>.`,`a) Find the characterization in terms of the variables of the new terminal graph.<br>b) Build this element using only 2-terminal resistors and dependent sources.<br><br>Strategy: write the old variables in terms of the new ones and <b>substitute</b> into the given equations.`)},
 {type:'talk',visual:vNL2,
  say:L_(`<b>Lineer olmayan 2-kapılılar</b>: lineerde v = R·i gibi bir <b>matris</b> vardı. Lineer olmayanda v₁ = v̂₁(i₁, i₂), v₂ = v̂₂(i₁, i₂) gibi <b>fonksiyonlar</b> var.<br><br>Slayttaki örnek: v₁ = ½(i₁<sup>1/3</sup> − i₂³), v₂ = ½(i₂³ + i₁<sup>1/3</sup>).<br>Çizmek için <b>eğri ailesi</b> kullanırız: bir büyüklüğü sabit tut, diğer ikisi arasındaki eğriyi çiz, sabiti değiştir.<br><br>Butonlarla aynı elemanın 3 gösterimine bak.`,`<b>Nonlinear two-ports</b>: for linear ones we had a <b>matrix</b> like v = R·i. For nonlinear ones we have <b>functions</b> like v₁ = v̂₁(i₁, i₂), v₂ = v̂₂(i₁, i₂).<br><br>Example from the slides: v₁ = ½(i₁<sup>1/3</sup> − i₂³), v₂ = ½(i₂³ + i₁<sup>1/3</sup>).<br>To plot it we use a <b>family of curves</b>: hold one variable fixed, plot the curve between two others, vary the fixed one.<br><br>Use the buttons to see 3 representations of the same element.`),
  formal:L_(`<b>Lineer:</b> M·v + N·i = 0 (2 × 4 katsayı matrisi [M | N]).<br><b>Lineer olmayan:</b> f₁(v₁, v₂, i₁, i₂) = 0, f₂(v₁, v₂, i₁, i₂) = 0.<br>Bir gösterim için iki bağımlı büyüklüğü diğer ikisi cinsinden (tek değerli) çözebilmek gerekir. <small>(Chua–Desoer–Kuh)</small>`,`<b>Linear:</b> M·v + N·i = 0 (2 × 4 coefficient matrix [M | N]).<br><b>Nonlinear:</b> f₁(v₁, v₂, i₁, i₂) = 0, f₂(v₁, v₂, i₁, i₂) = 0.<br>A representation requires solving (single-valuedly) for two dependent variables in terms of the other two. <small>(Chua–Desoer–Kuh)</small>`)},
 {type:'quiz',say:L_(`Gösterimleri kendin türet ✍️ (eleman: v₁ = ½(i₁<sup>1/3</sup> − i₂³), v₂ = ½(i₂³ + i₁<sup>1/3</sup>))`,`Derive the representations yourself ✍️ (element: v₁ = ½(i₁<sup>1/3</sup> − i₂³), v₂ = ½(i₂³ + i₁<sup>1/3</sup>))`),questions:[
  {q:L_('İki denklemi topla: v₁ + v₂ = ?',`Add the two equations: v₁ + v₂ = ?`),opts:['i₁<sup>1/3</sup>','i₂³','0','2i₁'],a:0,why:L_('½ + ½ = 1 ve i₂³ terimleri sadeleşir: v₁ + v₂ = i₁<sup>1/3</sup> ⇒ i₁ = (v₁ + v₂)³.',`½ + ½ = 1 and the i₂³ terms cancel: v₁ + v₂ = i₁<sup>1/3</sup> ⇒ i₁ = (v₁ + v₂)³.`)},
  {q:L_('Çıkar: v₂ − v₁ = ?',`Subtract: v₂ − v₁ = ?`),opts:['i₂³','i₁<sup>1/3</sup>','2i₂³','0'],a:0,why:L_('v₂ − v₁ = i₂³ ⇒ i₂ = (v₂ − v₁)<sup>1/3</sup>. İşte gerilim kontrollü gösterim!',`v₂ − v₁ = i₂³ ⇒ i₂ = (v₂ − v₁)<sup>1/3</sup>. That's the voltage-controlled representation!`)},
  {q:L_('Hibrit 1 (bağımsız: i₁, v₂) için v₁ = ?',`For hybrid 1 (independent: i₁, v₂), v₁ = ?`),opts:['i₁<sup>1/3</sup> − v₂','i₁<sup>1/3</sup> + v₂','(v₁ + v₂)³'],a:0,why:'v₁ + v₂ = i₁<sup>1/3</sup> ⇒ v₁ = i₁<sup>1/3</sup> − v₂.'},
  {q:L_('Hibrit 1 için i₂ = ?',`For hybrid 1, i₂ = ?`),opts:['(2v₂ − i₁<sup>1/3</sup>)<sup>1/3</sup>','(v₂ − i₁)<sup>1/3</sup>','2v₂ − i₁<sup>1/3</sup>'],a:0,why:'i₂³ = v₂ − v₁ = v₂ − (i₁<sup>1/3</sup> − v₂) = 2v₂ − i₁<sup>1/3</sup>.'},
  {q:L_('Lineer olmayan bir 2-kapılının 6 gösteriminin hepsi her zaman var mıdır?',`Does a nonlinear two-port always have all 6 representations?`),opts:[L_('Hayır, bağımlı büyüklükleri tek değerli çözebilmek gerekir',`No, the dependent variables must be solvable single-valuedly`),L_('Evet, her zaman',`Yes, always`),L_('Sadece 2 tanesi vardır',`Only 2 exist`)],a:0,why:L_('Bazı gösterimlerde aynı girişe birden çok çıkış düşebilir ya da hiç düşmeyebilir. Lineerde bunun testi bir determinanttır (sıradaki görev!).',`In some representations one input may correspond to several outputs, or to none. For linear two-ports the test is a determinant (next task!).`)}]},
 {type:'task',setup:existTask,
  say:L_(`🔍 <b>Lineer cebir zamanı!</b> Lineer bir 2-kapılının ETB'si: <span class="k">[ M | N ]·(v₁, v₂, i₁, i₂)ᵀ = 0</span>, iki denklem dört bilinmeyen.<br><br>Bir gösterim = 2 <b>bağımlı</b> büyüklüğü diğer 2'si cinsinden çözmek = 2×2 lineer sistem çözmek. Bu ancak bağımlı büyüklüklerin <b>sütunlarından</b> oluşan 2×2 alt matris <b>tersinirse</b> (det ≠ 0) mümkün.<br><br>Her eleman için var olan gösterimleri işaretle.`,`🔍 <b>Linear algebra time!</b> The branch equations of a linear two-port: <span class="k">[ M | N ]·(v₁, v₂, i₁, i₂)ᵀ = 0</span>, two equations in four unknowns.<br><br>A representation = solving for 2 <b>dependent</b> variables in terms of the other 2 = solving a 2×2 linear system. That is possible only if the 2×2 submatrix formed by the <b>columns</b> of the dependent variables is <b>invertible</b> (det ≠ 0).<br><br>Mark the representations that exist for each element.`),
  formal:L_(`Sütunları yeniden dizerek: K<sub>bağ</sub>·x<sub>bağ</sub> + K<sub>serb</sub>·x<sub>serb</sub> = 0 ⇒ x<sub>bağ</sub> = −K<sub>bağ</sub><sup>−1</sup>K<sub>serb</sub>·x<sub>serb</sub>, ancak ve ancak det K<sub>bağ</sub> ≠ 0.<br>Örnek: ideal transformatörün R gösterimi yok çünkü v₁, v₂ sütunları [[1, −n], [0, 0]] tekil.`,`Reordering the columns: K<sub>dep</sub>·x<sub>dep</sub> + K<sub>ind</sub>·x<sub>ind</sub> = 0 ⇒ x<sub>dep</sub> = −K<sub>dep</sub><sup>−1</sup>K<sub>ind</sub>·x<sub>ind</sub>, if and only if det K<sub>dep</sub> ≠ 0.<br>Example: the ideal transformer has no R representation because the v₁, v₂ columns [[1, −n], [0, 0]] are singular.`)},
 {type:'talk',visual:vBJT,
  say:L_(`<b>npn bipolar tranzistör</b> 🔺: emitör (e), baz (b), kollektör (c). Baz referans seçilince uç büyüklükleri v<sub>eb</sub>, v<sub>cb</sub>, i<sub>e</sub>, i<sub>c</sub>.<br><br><b>Ebers–Moll</b> modeli (alçak frekans): iki diyot + iki AKAK. Denklemler i<sub>e</sub> ve i<sub>c</sub>'yi gerilimler cinsinden <b>tek değerli</b> veriyor → <span class="k">3-uçlu, gerilim kontrollü</span> eleman.<br><br>Sürgülerle oyna (ortak emitör çıkışı): v<sub>ce</sub> birkaç yüz mV'u geçince i<sub>c</sub> neredeyse sabit, i<sub>c</sub> ≈ β·i<sub>b</sub>.`,`<b>npn bipolar transistor</b> 🔺: emitter (e), base (b), collector (c). With the base as datum the terminal variables are v<sub>eb</sub>, v<sub>cb</sub>, i<sub>e</sub>, i<sub>c</sub>.<br><br><b>Ebers–Moll</b> model (low frequency): two diodes + two CCCSs. The equations give i<sub>e</sub> and i<sub>c</sub> <b>single-valuedly</b> in terms of the voltages → a <span class="k">3-terminal, voltage-controlled</span> element.<br><br>Play with the sliders (common-emitter output): once v<sub>ce</sub> exceeds a few hundred mV, i<sub>c</sub> is almost constant, i<sub>c</sub> ≈ β·i<sub>b</sub>.`),
  formal:`<b>Ebers–Moll:</b><br>i<sub>e</sub> = −I<sub>ES</sub>(e<sup>−v<sub>eb</sub>/V<sub>T</sub></sup> − 1) + α<sub>R</sub>I<sub>CS</sub>(e<sup>−v<sub>cb</sub>/V<sub>T</sub></sup> − 1)<br>i<sub>c</sub> = α<sub>F</sub>I<sub>ES</sub>(e<sup>−v<sub>eb</sub>/V<sub>T</sub></sup> − 1) − I<sub>CS</sub>(e<sup>−v<sub>cb</sub>/V<sub>T</sub></sup> − 1)<br>Parametreler: I<sub>ES</sub>, I<sub>CS</sub> ≈ 10<sup>−12</sup>–10<sup>−10</sup> A, α<sub>F</sub> ≈ 0.99, α<sub>R</sub> ≈ 0.5–0.8, V<sub>T</sub> ≅ 25 mV (25 °C).`},
 {type:'talk',visual:vBJTref,
  say:L_(`Slayt 15: referansı <b>baz yerine emitör</b> alırsak (ortak emitör). Yeni değişkenler eskilerin <b>lineer</b> kombinasyonu (KGY + KAY):<br>v<sub>be</sub> = −v<sub>eb</sub>, v<sub>ce</sub> = v<sub>cb</sub> − v<sub>eb</sub>, i<sub>b</sub> = −(i<sub>e</sub> + i<sub>c</sub>).<br><br>Bunları Ebers–Moll'a yerleştir → i<sub>b</sub> ve i<sub>c</sub>, (v<sub>be</sub>, v<sub>ce</sub>) cinsinden. Eleman aynı, sadece "gözlük" değişti 👓`,`Slide 15: take the <b>emitter instead of the base</b> as datum (common emitter). The new variables are <b>linear</b> combinations of the old ones (KVL + KCL):<br>v<sub>be</sub> = −v<sub>eb</sub>, v<sub>ce</sub> = v<sub>cb</sub> − v<sub>eb</sub>, i<sub>b</sub> = −(i<sub>e</sub> + i<sub>c</sub>).<br><br>Substitute into Ebers–Moll → i<sub>b</sub> and i<sub>c</sub> in terms of (v<sub>be</sub>, v<sub>ce</sub>). Same element, just different "glasses" 👓`),
  formal:`i<sub>b</sub> = (1 − α<sub>F</sub>)I<sub>ES</sub>(e<sup>v<sub>be</sub>/V<sub>T</sub></sup> − 1) + (1 − α<sub>R</sub>)I<sub>CS</sub>(e<sup>(v<sub>be</sub> − v<sub>ce</sub>)/V<sub>T</sub></sup> − 1)<br>i<sub>c</sub> = α<sub>F</sub>I<sub>ES</sub>(e<sup>v<sub>be</sub>/V<sub>T</sub></sup> − 1) − I<sub>CS</sub>(e<sup>(v<sub>be</sub> − v<sub>ce</sub>)/V<sub>T</sub></sup> − 1)`},
 {type:'quiz',say:L_(`Ders 7 testi! 🔺`,`Lecture 7 quiz! 🔺`),questions:[
  {q:L_('Ebers–Moll denklemleriyle verilen npn tranzistör nasıl bir eleman?',`What kind of element is the npn transistor described by the Ebers–Moll equations?`),opts:[L_('3-uçlu, gerilim kontrollü',`3-terminal, voltage-controlled`),L_('2-uçlu, akım kontrollü',`2-terminal, current-controlled`),L_('3-uçlu, akım kontrollü',`3-terminal, current-controlled`),L_('Lineer 2-kapılı',`Linear two-port`)],a:0,why:L_('(i<sub>e</sub>, i<sub>c</sub>), (v<sub>eb</sub>, v<sub>cb</sub>) cinsinden tek değerli → gerilim kontrollü 3-uçlu.',`(i<sub>e</sub>, i<sub>c</sub>) are single-valued in (v<sub>eb</sub>, v<sub>cb</sub>) → a voltage-controlled 3-terminal element.`)},
  {q:L_('Referans baz yerine emitör seçilince i<sub>b</sub> nasıl bulunur?',`With the emitter instead of the base as datum, how is i<sub>b</sub> found?`),opts:[L_('i<sub>b</sub> = −(i<sub>e</sub> + i<sub>c</sub>) (KAY)',`i<sub>b</sub> = −(i<sub>e</sub> + i<sub>c</sub>) (KCL)`),'i<sub>b</sub> = i<sub>e</sub> + i<sub>c</sub>','i<sub>b</sub> = i<sub>c</sub>/β'],a:0,why:L_('Elemanı saran Gauss yüzeyi: i<sub>e</sub> + i<sub>b</sub> + i<sub>c</sub> = 0.',`A Gaussian surface around the element: i<sub>e</sub> + i<sub>b</sub> + i<sub>c</sub> = 0.`)},
  {q:L_('v<sub>ce</sub> eski gerilimler cinsinden?',`v<sub>ce</sub> in terms of the old voltages?`),opts:['v<sub>cb</sub> − v<sub>eb</sub>','v<sub>cb</sub> + v<sub>eb</sub>','v<sub>eb</sub> − v<sub>cb</sub>'],a:0,why:L_('KGY (c → b → e): v<sub>ce</sub> = v<sub>cb</sub> + v<sub>be</sub> = v<sub>cb</sub> − v<sub>eb</sub>.',`KVL (c → b → e): v<sub>ce</sub> = v<sub>cb</sub> + v<sub>be</sub> = v<sub>cb</sub> − v<sub>eb</sub>.`)},
  {q:L_('Sadece lineer dirençlerden oluşan 2-kapılının G matrisi için hangisi doğru?',`Which is true for the G matrix of a two-port made only of linear resistors?`),opts:[L_('Simetriktir: g₁₂ = g₂₁',`It is symmetric: g₁₂ = g₂₁`),L_('Her zaman köşegendir',`It is always diagonal`),L_('Her zaman tekildir',`It is always singular`)],a:0,why:L_('(a) şıkkında G = [[1.5, −1], [−1, 1.5]]. Bağımlı kaynak eklenince (b) simetri bozuldu.',`In (a), G = [[1.5, −1], [−1, 1.5]]. Adding a dependent source (b) broke the symmetry.`)},
  {q:L_('İdeal transformatörün akım kontrollü (R) gösterimi neden yok?',`Why does the ideal transformer have no current-controlled (R) representation?`),opts:[L_('v₁ ve v₂ sütunlarından oluşan alt matrisin determinantı 0',`The submatrix formed by the v₁ and v₂ columns has determinant 0`),L_('Transformatör lineer olmadığı için',`Because the transformer is nonlinear`),L_('Gücü sıfır olduğu için',`Because its power is zero`)],a:0,why:L_('v₁ − nv₂ = 0, ni₁ + i₂ = 0. v₁, v₂ sütunları [[1, −n], [0, 0]] → det = 0: v\'yi i cinsinden çözemezsin.',`v₁ − nv₂ = 0, ni₁ + i₂ = 0. The v₁, v₂ columns are [[1, −n], [0, 0]] → det = 0: you cannot solve for v in terms of i.`)},
  {q:L_('Uç-grafını değiştirince (referans 3 → referans 2) ne olur?',`What happens when the terminal graph is changed (datum 3 → datum 2)?`),opts:[L_('Aynı eleman; değişkenler lineer bir dönüşümle değişir',`Same element; the variables change by a linear transformation`),L_('Eleman değişir',`The element changes`),L_('Tanım bağıntısı aynen kalır',`The characterization stays exactly the same`)],a:0,why:L_('KAY ve KGY ile yeni değişkenler eskilerin lineer kombinasyonu: [i₁; i₂] = P·[î₁; î₂].',`By KCL and KVL the new variables are linear combinations of the old ones: [i₁; i₂] = P·[î₁; î₂].`)},
  {q:L_('v̂₁ = 2î₁ + 4v̂₂, î₂ = −5î₁ hangi gösterim?',`v̂₁ = 2î₁ + 4v̂₂, î₂ = −5î₁: which representation?`),opts:[L_('Hibrit 1',`Hybrid 1`),L_('Akım kontrollü',`Current-controlled`),L_('Transmisyon 1',`Transmission 1`)],a:0,why:L_('Bağımsız büyüklükler î₁ (1. kapı akımı) ve v̂₂ (2. kapı gerilimi) → Hibrit 1.',`The independent variables are î₁ (port-1 current) and v̂₂ (port-2 voltage) → hybrid 1.`)}]}
]},
/* ---------------- 11 ---------------- */
{id:'c11',icon:'🔧',title:L_('Tranzistör DC ve Jakobiyen',`Transistor DC Analysis and the Jacobian`),sub:L_('Ders 8',`Lecture 8`),pos:[26,84],steps:[
 {type:'talk',visual:vPWL,
  say:L_(`Ebers–Moll çok hassas ama elle hesap için ağır. Chua'nın tavsiyesi: <b>amaca uygun, en basit ama geçerli model</b>.<br><br><span class="k">Parça parça lineer model</span> (ortak emitör):<br>• b–e: E₀ ≈ 0.6–0.7 V gerilim kaynağı + ideal diyot D₁ → i<sub>b</sub>–v<sub>be</sub> eğrisi E₀'da dikey çizgi.<br>• c–e: β·i<sub>b</sub> AKAK + ideal diyot D₂ → i<sub>c</sub>–v<sub>ce</sub> eğrileri yatay çizgiler.`,`Ebers–Moll is very accurate but heavy for hand calculation. Chua's advice: <b>the simplest model that is still valid for the purpose</b>.<br><br><span class="k">Piecewise-linear model</span> (common emitter):<br>• b–e: E₀ ≈ 0.6–0.7 V voltage source + ideal diode D₁ → the i<sub>b</sub>–v<sub>be</sub> curve is a vertical line at E₀.<br>• c–e: β·i<sub>b</sub> CCCS + ideal diode D₂ → the i<sub>c</sub>–v<sub>ce</sub> curves are horizontal lines.`),
  formal:L_(`"Modeller belirli uygulamalar düşünülerek geliştirilir. Model ne kadar basitse analiz o kadar kolaydır." <small>(Chua–Desoer–Kuh)</small><br>Daha ayrıntılı model: (G₁, E₀) parça lineer diyot + µv<sub>ce</sub> GKGK ve (R₂, I₀) + βi<sub>b</sub>.`,`"Models are developed with specific applications in mind. The simpler the model, the easier the analysis." <small>(Chua–Desoer–Kuh)</small><br>A more detailed model: (G₁, E₀) piecewise-linear diode + µv<sub>ce</sub> VCVS, and (R₂, I₀) + βi<sub>b</sub>.`)},
 {type:'task',setup:dcBJTTask,
  say:L_(`<b>DC çalışma noktası</b> (slayt 4): R₁–E₁ bazı, R₂–E₂ kollektörü besliyor.<br>KGY + KAY + ETB: v<sub>be</sub> = E₁ − R₁i<sub>b</sub>, v<sub>ce</sub> = E₂ − R₂i<sub>c</sub> (iki <b>yük doğrusu</b>).<br>Varsayım: D₁ kısa devre, D₂ açık devre ⇒ v<sub>be</sub> = E₀, i<sub>c</sub> = βi<sub>b</sub>.<br><br>Sürgülerle oyna: R₂'yi büyüt, Q sola kayar ve sonunda V<sub>ce</sub> &lt; 0 çıkar → <b>varsayım bozuldu</b>. Sonra sınav değerleriyle Q'yu hesapla.`,`<b>DC operating point</b> (slide 4): R₁–E₁ bias the base, R₂–E₂ the collector.<br>KVL + KCL + branch eqs: v<sub>be</sub> = E₁ − R₁i<sub>b</sub>, v<sub>ce</sub> = E₂ − R₂i<sub>c</sub> (two <b>load lines</b>).<br>Assumption: D₁ short, D₂ open ⇒ v<sub>be</sub> = E₀, i<sub>c</sub> = βi<sub>b</sub>.<br><br>Play with the sliders: increase R₂, Q moves left and eventually V<sub>ce</sub> &lt; 0 → <b>the assumption fails</b>. Then compute Q with the exam values.`),
  formal:L_(`V<sub>beQ</sub> = E₀, I<sub>bQ</sub> = (E₁ − E₀)/R₁, I<sub>cQ</sub> = (β/R₁)(E₁ − E₀), V<sub>ceQ</sub> = E₂ − β(R₂/R₁)(E₁ − E₀).<br>Varsayım: E₁ &gt; 0, E₂ &gt; 0.`,`V<sub>beQ</sub> = E₀, I<sub>bQ</sub> = (E₁ − E₀)/R₁, I<sub>cQ</sub> = (β/R₁)(E₁ − E₀), V<sub>ceQ</sub> = E₂ − β(R₂/R₁)(E₁ − E₀).<br>Assumption: E₁ &gt; 0, E₂ &gt; 0.`)},
 {type:'talk',visual:vJac,mood:'wow',
  say:L_(`Tek değişkende küçük işaret iletkenliği bir <b>türev</b>di: G = dî/dv. 2-kapılıda iki değişken var, türev bir <b>matris</b> olur: <span class="k">Jakobiyen</span>.<br><br>Akım kontrollü ETB v = v̂(i) için: ṽ ≈ J·ĩ, J = [∂v̂<sub>k</sub>/∂i<sub>j</sub>] (Q'da hesaplanır).<br><br>Lineer cebir yorumu: J, lineer olmayan fonksiyona Q'da <b>en iyi lineer yaklaşım</b> (teğet düzlem). Küçük işaret eşdeğer devresi = matrisi J olan <b>lineer 2-kapılı</b>.<br><br>Örnek gerilim kontrollü (ĩ ≈ J·ṽ). ṽ'yi küçült, hatayı izle.`,`For a single variable the small-signal conductance was a <b>derivative</b>: G = dî/dv. A two-port has two variables, so the derivative becomes a <b>matrix</b>: the <span class="k">Jacobian</span>.<br><br>For a current-controlled characterization v = v̂(i): ṽ ≈ J·ĩ, J = [∂v̂<sub>k</sub>/∂i<sub>j</sub>] (evaluated at Q).<br><br>Linear-algebra view: J is the <b>best linear approximation</b> of the nonlinear function at Q (the tangent plane). The small-signal equivalent circuit = a <b>linear two-port</b> whose matrix is J.<br><br>The example is voltage-controlled (ĩ ≈ J·ṽ). Shrink ṽ and watch the error.`),
  formal:`v₁ ≅ v̂₁(I<sub>1Q</sub>, I<sub>2Q</sub>) + ∂v̂₁/∂i₁|<sub>Q</sub>(i₁ − I<sub>1Q</sub>) + ∂v̂₁/∂i₂|<sub>Q</sub>(i₂ − I<sub>2Q</sub>) + …<br>${vec('ṽ₁','ṽ₂')} = ${mat2('∂v̂₁/∂i₁','∂v̂₁/∂i₂','∂v̂₂/∂i₁','∂v̂₂/∂i₂')}<sub>Q</sub> ${vec('ĩ₁','ĩ₂')} &nbsp; (Jakobiyen matrisi)`},
 {type:'task',setup:chainTask({fig:circS7,steps:EX8S}),
  say:L_(`Ders 8 slayt 7 sorusu 📝: gerilim kontrollü 2-kapılı i₁ = v₁ + v₁², i₂ = v₁v₂ + 2(v₂ − 1). 1. kapıda i<sub>s</sub>, 2. kapıda 1 Ω + 10 V.<br>a) i<sub>s</sub> = 2 A için DC çalışma noktaları<br>b) küçük işaret eşdeğer devresi<br>c) i<sub>s</sub> = 2 + 0.1 cos t A için v₂(t)`,`Lecture 8, slide 7 problem 📝: voltage-controlled two-port i₁ = v₁ + v₁², i₂ = v₁v₂ + 2(v₂ − 1). Port 1 has i<sub>s</sub>, port 2 has 1 Ω + 10 V.<br>a) DC operating points for i<sub>s</sub> = 2 A<br>b) small-signal equivalent circuit<br>c) v₂(t) for i<sub>s</sub> = 2 + 0.1 cos t A`)},
 {type:'quiz',say:L_(`Tranzistör ve Jakobiyen testi 🔧`,`Transistor and Jacobian quiz 🔧`),questions:[
  {q:L_('Parça parça lineer modelde baz–emitör arası nasıl modellenir?',`How is the base–emitter part modeled in the piecewise-linear model?`),opts:[L_('E₀ gerilim kaynağı ile seri ideal diyot (E₀ ≈ 0.6–0.7 V)',`A voltage source E₀ in series with an ideal diode (E₀ ≈ 0.6–0.7 V)`),L_('βi<sub>b</sub> akım kaynağı',`A current source βi<sub>b</sub>`),L_('Lineer direnç',`A linear resistor`)],a:0,why:L_('i<sub>b</sub>–v<sub>be</sub> karakteristiği E₀\'da dikey bir çizgi: E₀ + ideal diyot.',`The i<sub>b</sub>–v<sub>be</sub> characteristic is a vertical line at E₀: E₀ + ideal diode.`)},
  {q:L_('"D₁ kısa, D₂ açık" varsayımıyla bulunan V<sub>ce</sub> negatif çıkarsa?',`If the V<sub>ce</sub> found under the assumption "D₁ short, D₂ open" is negative?`),opts:[L_('Varsayım yanlış: tranzistör doymada, başka bölge dene',`The assumption is wrong: the transistor is saturated, try another region`),L_('Sonuç doğrudur',`The result is correct`),L_('E₂ negatif demektir',`It means E₂ is negative`)],a:0,why:L_('D₂ açık devre ancak v<sub>ce</sub> &gt; 0 iken tutarlı. Parça parça lineer elemanlarda: varsay → çöz → kontrol et.',`D₂ open is consistent only when v<sub>ce</sub> &gt; 0. For piecewise-linear elements: assume → solve → check.`)},
  {q:L_('E₁ = 5.7 V, R₁ = 100 kΩ, β = 100, E₂ = 10 V, R₂ = 3 kΩ için?',`For E₁ = 5.7 V, R₁ = 100 kΩ, β = 100, E₂ = 10 V, R₂ = 3 kΩ?`),opts:[L_('βI<sub>b</sub>R₂ = 15 V &gt; E₂ → doyma, V<sub>ce</sub> ≈ 0',`βI<sub>b</sub>R₂ = 15 V &gt; E₂ → saturation, V<sub>ce</sub> ≈ 0`),'V<sub>ce</sub> = −5 V','V<sub>ce</sub> = 5 V'],a:0,why:L_('I<sub>b</sub> = 50 µA, βI<sub>b</sub> = 5 mA, R₂·5 mA = 15 V &gt; 10 V. Varsayım bozulur.',`I<sub>b</sub> = 50 µA, βI<sub>b</sub> = 5 mA, R₂·5 mA = 15 V &gt; 10 V. The assumption fails.`)},
  {q:L_('Jakobiyen matrisi nedir?',`What is the Jacobian matrix?`),opts:[L_('ETB fonksiyonlarının kısmi türevlerinden oluşan, Q\'da hesaplanan matris',`The matrix of partial derivatives of the branch-equation functions, evaluated at Q`),L_('Devrenin A matrisi',`The circuit's A matrix`),L_('Düğüm gerilimleri vektörü',`The node-voltage vector`)],a:0,why:L_('Çok değişkenli Taylor serisinin 1. mertebe terimi.',`The first-order term of the multivariable Taylor series.`)},
  {q:L_('2-kapılının küçük işaret eşdeğeri nasıl bir elemandır?',`What kind of element is the small-signal equivalent of a two-port?`),opts:[L_('Matrisi Jakobiyen olan lineer 2-kapılı',`A linear two-port whose matrix is the Jacobian`),L_('Lineer olmayan 2-kapılı',`A nonlinear two-port`),L_('2-uçlu direnç',`A 2-terminal resistor`)],a:0,why:L_('ĩ ≈ J·ṽ: lineer, gösterim matrisi J(Q).',`ĩ ≈ J·ṽ: linear, with representation matrix J(Q).`)},
  {q:L_('Örnekte J(Q₁) = [[3, 0], [3, 3]]. J₁₂ = 0 ne anlatır?',`In the example J(Q₁) = [[3, 0], [3, 3]]. What does J₁₂ = 0 tell us?`),opts:[L_('ṽ₂, ĩ₁\'i etkilemez: 2. kapıdan 1. kapıya geri etki yok',`ṽ₂ does not affect ĩ₁: no feedback from port 2 to port 1`),'ṽ₁ = 0',L_('Devre tekil',`The circuit is singular`)],a:0,why:L_('ĩ₁ = 3ṽ₁ + 0·ṽ₂. Tek yönlü etki: eşdeğer devrede sadece 2. kapıda bağımlı kaynak var.',`ĩ₁ = 3ṽ₁ + 0·ṽ₂. One-way (unilateral) coupling: the equivalent circuit has a dependent source only at port 2.`)},
  {q:L_('Küçük işaret eşdeğerinde 10 V\'luk DC kaynak ne olur?',`What happens to the 10 V DC source in the small-signal equivalent?`),opts:[L_('Kısa devre',`Short circuit`),L_('Açık devre',`Open circuit`),L_('Aynen kalır',`Stays as it is`)],a:0,why:L_('Değeri sıfırlanır: v = 0 → kısa devre. (DC akım kaynağı → açık devre.)',`Its value is zeroed: v = 0 → short circuit. (DC current source → open circuit.)`)}]}
]},
/* ---------------- 12 ---------------- */
{id:'c12',icon:'🔼',title:L_('İşlemsel Kuvvetlendirici',`Operational Amplifiers`),sub:L_('Ders 8',`Lecture 8`),pos:[43,77],steps:[
 {type:'talk',visual:vOpamp,
  say:L_(`<b>İşlemsel kuvvetlendirici</b> (op-amp): girişler n (−, eviren) ve p (+, evirmeyen), çıkış o. Besleme kaynakları E₊, E₋ içeride sayılıp dış toprak referans alınınca <b>4-uçlu</b> bir eleman olur.<br><br>ETB: i<sub>n</sub> = I<sub>Bn</sub>, i<sub>p</sub> = I<sub>Bp</sub> (baz akımları, çok küçük), v<sub>o</sub> = f(v<sub>d</sub>), v<sub>d</sub> = v<sub>p</sub> − v<sub>n</sub>.<br><br>Gerçek eğrinin eğimi A ≈ 200 000! İdeal modele geç ve farkı gör.`,`<b>Operational amplifier</b> (op amp): inputs n (−, inverting) and p (+, noninverting), output o. With the supplies E₊, E₋ absorbed into the device and the external ground as datum, it is a <b>4-terminal</b> element.<br><br>Branch equations: i<sub>n</sub> = I<sub>Bn</sub>, i<sub>p</sub> = I<sub>Bp</sub> (bias currents, very small), v<sub>o</sub> = f(v<sub>d</sub>), v<sub>d</sub> = v<sub>p</sub> − v<sub>n</sub>.<br><br>The slope of the real curve is A ≈ 200 000! Switch to the ideal model and see the difference.`),
  formal:L_(`<b>İdeal op-amp:</b> i<sub>n</sub> = 0, i<sub>p</sub> = 0, v<sub>o</sub> = E<sub>sat</sub>·|v<sub>d</sub>|/v<sub>d</sub> (v<sub>d</sub> ≠ 0), −E<sub>sat</sub> &lt; v<sub>o</sub> &lt; E<sub>sat</sub> (v<sub>d</sub> = 0).<br><b>Lineer çalışma bölgesi:</b> i<sub>n</sub> = 0, i<sub>p</sub> = 0, v<sub>p</sub> − v<sub>n</sub> = 0, −E<sub>sat</sub> &lt; v<sub>o</sub> &lt; E<sub>sat</sub>.`,`<b>Ideal op amp:</b> i<sub>n</sub> = 0, i<sub>p</sub> = 0, v<sub>o</sub> = E<sub>sat</sub>·|v<sub>d</sub>|/v<sub>d</sub> (v<sub>d</sub> ≠ 0), −E<sub>sat</sub> &lt; v<sub>o</sub> &lt; E<sub>sat</sub> (v<sub>d</sub> = 0).<br><b>Linear region:</b> i<sub>n</sub> = 0, i<sub>p</sub> = 0, v<sub>p</sub> − v<sub>n</sub> = 0, −E<sub>sat</sub> &lt; v<sub>o</sub> &lt; E<sub>sat</sub>.`)},
 {type:'talk',visual:vOpRegions,
  say:L_(`Her bölgede op-amp'in ETB'si <b>aynı kalıpta</b>: <span class="k">M·i + N·v = w</span>. Lineer cebirden bildiğin dil!<br><br>Lineer bölgede w = 0 → bağıntı <b>lineer</b>. Doyma bölgelerinde w ≠ 0 → <b>afin</b>: çıkış bir gerilim kaynağı gibi.<br><br>Yani op-amp <b>parça parça lineer</b> bir eleman. Çözerken: bölge <b>varsay</b> → çöz → varsayımı <b>kontrol et</b> (tranzistördeki D₁, D₂ varsayımı gibi).`,`In every region the op amp's branch equations have <b>the same form</b>: <span class="k">M·i + N·v = w</span>. The language you know from linear algebra!<br><br>Linear region: w = 0 → the relation is <b>linear</b>. Saturation regions: w ≠ 0 → <b>affine</b>: the output acts like a voltage source.<br><br>So the op amp is a <b>piecewise-linear</b> element. To solve: <b>assume</b> a region → solve → <b>check</b> the assumption (like the D₁, D₂ assumption for the transistor).`),
  formal:L_(`<b>+ Doyma:</b> v<sub>d</sub> = v<sub>p</sub> − v<sub>n</sub> &gt; 0, i<sub>p</sub> = i<sub>n</sub> = 0, v<sub>o</sub> = E<sub>sat</sub>.<br><b>− Doyma:</b> v<sub>d</sub> &lt; 0, i<sub>p</sub> = i<sub>n</sub> = 0, v<sub>o</sub> = −E<sub>sat</sub>.<br><b>Lineer:</b> −E<sub>sat</sub> &lt; v<sub>o</sub>(t) &lt; E<sub>sat</sub> ∀t, i<sub>n</sub> = i<sub>p</sub> = 0, v<sub>p</sub> − v<sub>n</sub> = 0.`,`<b>+ Saturation:</b> v<sub>d</sub> = v<sub>p</sub> − v<sub>n</sub> &gt; 0, i<sub>p</sub> = i<sub>n</sub> = 0, v<sub>o</sub> = E<sub>sat</sub>.<br><b>− Saturation:</b> v<sub>d</sub> &lt; 0, i<sub>p</sub> = i<sub>n</sub> = 0, v<sub>o</sub> = −E<sub>sat</sub>.<br><b>Linear:</b> −E<sub>sat</sub> &lt; v<sub>o</sub>(t) &lt; E<sub>sat</sub> ∀t, i<sub>n</sub> = i<sub>p</sub> = 0, v<sub>p</sub> − v<sub>n</sub> = 0.`)},
 {type:'task',setup:chainTask({fig:circBuf,steps:EXBUF}),
  say:L_(`<b>Buffer (gerilim izleyici)</b> 🪞: Amaç: çıkıştaki yük ne olursa olsun v<sub>o</sub> = v<sub>in</sub> olsun, çıkışa bağlı devre girişi etkilemesin.<br><br>Kesikli kutu bir 2-kapılı. İçini KAY + KGY + ETB ile çözelim (lineer bölge varsayımı).`,`<b>Buffer (voltage follower)</b> 🪞: Goal: v<sub>o</sub> = v<sub>in</sub> whatever the load, and the circuit at the output must not affect the input.<br><br>The dashed box is a two-port. Let's solve its inside with KCL + KVL + branch equations (linear-region assumption).`),
  formal:L_(`2. düğüm için KAY + ETB: i<sub>in</sub> = i<sub>p</sub> = 0. 4-3-2-1-4 için KGY + ETB: v<sub>o</sub> + (−v<sub>in</sub>) + v<sub>d</sub> = 0, v<sub>d</sub> = 0 ⇒ v<sub>o</sub> = v<sub>in</sub> (GKGK). Geçerli olduğu aralık: −E<sub>sat</sub> &lt; v<sub>in</sub> &lt; E<sub>sat</sub>. <small>(Chua–Desoer–Kuh sf. 178–179)</small>`,`KCL + branch eq. at node 2: i<sub>in</sub> = i<sub>p</sub> = 0. KVL + branch eq. for 4-3-2-1-4: v<sub>o</sub> + (−v<sub>in</sub>) + v<sub>d</sub> = 0, v<sub>d</sub> = 0 ⇒ v<sub>o</sub> = v<sub>in</sub> (VCVS). Valid for: −E<sub>sat</sub> &lt; v<sub>in</sub> &lt; E<sub>sat</sub>. <small>(Chua–Desoer–Kuh pp. 178–179)</small>`)},
 {type:'task',setup:fbTask,
  say:L_(`<b>Geri besleme</b> 🔄: çıkış girişlerden birine bağlı.<br>• <b>Negatif</b>: çıkış → (−) girişi, giriş (+)'ya. Her v<sub>in</sub> için <b>tek</b> çözüm: lineer bölgede v<sub>o</sub> = v<sub>in</sub>, dışında doyma.<br>• <b>Pozitif</b>: çıkış → (+) girişi, giriş (−)'ye. Üç bölgeyi tek tek dene: varsayımı tutan her bölge bir çözüm.<br><br>Sürgüyü gezdir, kırmızı noktaları say!`,`<b>Feedback</b> 🔄: the output is connected to one of the inputs.<br>• <b>Negative</b>: output → (−) input, signal into (+). A <b>unique</b> solution for every v<sub>in</sub>: v<sub>o</sub> = v<sub>in</sub> in the linear region, saturation outside.<br>• <b>Positive</b>: output → (+) input, signal into (−). Try the three regions one by one: every region whose assumption holds is a solution.<br><br>Sweep the slider and count the red dots!`),
  formal:L_(`<b>Negatif, + doyma:</b> v<sub>p</sub> = v<sub>in</sub>, v<sub>n</sub> = E<sub>sat</sub>, v<sub>d</sub> &gt; 0 ⇒ v<sub>in</sub> &gt; E<sub>sat</sub>.<br><b>Pozitif, + doyma:</b> v<sub>p</sub> = E<sub>sat</sub>, v<sub>n</sub> = v<sub>in</sub>, v<sub>d</sub> &gt; 0 ⇒ v<sub>in</sub> &lt; E<sub>sat</sub>.<br>Lineer bölgede ikisi de v<sub>o</sub> = v<sub>in</sub> (|v<sub>in</sub>| &lt; E<sub>sat</sub>). <small>(Chua–Desoer–Kuh sf. 190–193)</small>`,`<b>Negative, + saturation:</b> v<sub>p</sub> = v<sub>in</sub>, v<sub>n</sub> = E<sub>sat</sub>, v<sub>d</sub> &gt; 0 ⇒ v<sub>in</sub> &gt; E<sub>sat</sub>.<br><b>Positive, + saturation:</b> v<sub>p</sub> = E<sub>sat</sub>, v<sub>n</sub> = v<sub>in</sub>, v<sub>d</sub> &gt; 0 ⇒ v<sub>in</sub> &lt; E<sub>sat</sub>.<br>In the linear region both give v<sub>o</sub> = v<sub>in</sub> (|v<sub>in</sub>| &lt; E<sub>sat</sub>). <small>(Chua–Desoer–Kuh pp. 190–193)</small>`)},
 {type:'quiz',say:L_(`Op-amp testi 🔼`,`Op amp quiz 🔼`),questions:[
  {q:L_('İdeal op-amp lineer bölgede hangi denklemler geçerli?',`Which equations hold for an ideal op amp in the linear region?`),opts:['i<sub>n</sub> = 0, i<sub>p</sub> = 0, v<sub>p</sub> − v<sub>n</sub> = 0','v<sub>o</sub> = 0','i<sub>o</sub> = 0, v<sub>d</sub> = E<sub>sat</sub>'],a:0,why:L_('Giriş akımları sıfır ve v<sub>d</sub> = 0 (sanal kısa devre).',`Input currents are zero and v<sub>d</sub> = 0 (virtual short).`)},
  {q:L_('+ Doyma bölgesinde?',`In the + saturation region?`),opts:[L_('v<sub>o</sub> = E<sub>sat</sub> ve v<sub>d</sub> &gt; 0',`v<sub>o</sub> = E<sub>sat</sub> and v<sub>d</sub> &gt; 0`),L_('v<sub>o</sub> = E<sub>sat</sub> ve v<sub>d</sub> = 0',`v<sub>o</sub> = E<sub>sat</sub> and v<sub>d</sub> = 0`),'v<sub>o</sub> = 0'],a:0,why:L_('Çıkış E<sub>sat</sub> değerli gerilim kaynağı; tutarlılık şartı v<sub>d</sub> &gt; 0.',`The output is a voltage source of value E<sub>sat</sub>; the consistency condition is v<sub>d</sub> &gt; 0.`)},
  {q:L_('Gerçek op-amp: E<sub>sat</sub> = 13 V, A ≈ 200 000. Lineer bölge |v<sub>d</sub>| &lt; ?',`Real op amp: E<sub>sat</sub> = 13 V, A ≈ 200 000. Linear region |v<sub>d</sub>| &lt; ?`),opts:['65 µV','65 mV','13 V','0.2 V'],a:0,why:L_('13 / 200 000 = 6.5·10<sup>−5</sup> V = 65 µV. Bu yüzden ideal modelde v<sub>d</sub> = 0.',`13 / 200 000 = 6.5·10<sup>−5</sup> V = 65 µV. That is why the ideal model takes v<sub>d</sub> = 0.`)},
  {q:L_('Buffer\'da v<sub>in</sub> = 20 V, E<sub>sat</sub> = 13 V → v<sub>o</sub> = ?',`In the buffer, v<sub>in</sub> = 20 V, E<sub>sat</sub> = 13 V → v<sub>o</sub> = ?`),opts:['13 V','20 V','−13 V','0'],a:0,why:L_('Lineer varsayım v<sub>o</sub> = 20 &gt; 13 tutmaz. + doyma: v<sub>d</sub> = 20 − 13 &gt; 0 ✓.',`The linear assumption v<sub>o</sub> = 20 &gt; 13 fails. + saturation: v<sub>d</sub> = 20 − 13 &gt; 0 ✓.`)},
  {q:L_('Pozitif geri besleme, |v<sub>in</sub>| &lt; E<sub>sat</sub>: kaç çözüm var?',`Positive feedback, |v<sub>in</sub>| &lt; E<sub>sat</sub>: how many solutions?`),opts:['3','1','2','Sonsuz'],a:0,why:L_('Lineer (v<sub>o</sub> = v<sub>in</sub>), + doyma (v<sub>in</sub> &lt; E<sub>sat</sub>), − doyma (v<sub>in</sub> &gt; −E<sub>sat</sub>): üçü de tutarlı.',`Linear (v<sub>o</sub> = v<sub>in</sub>), + saturation (v<sub>in</sub> &lt; E<sub>sat</sub>), − saturation (v<sub>in</sub> &gt; −E<sub>sat</sub>): all three are consistent.`)},
  {q:L_('Doyma bölgesinde ETB M·i + N·v = w için w ≠ 0. Bu ne demek?',`In saturation the branch equations M·i + N·v = w have w ≠ 0. What does that mean?`),opts:[L_('Bağıntı afin: kaynak gibi davranır, lineer değil',`The relation is affine: it acts like a source, not linear`),L_('Bağıntı lineer',`The relation is linear`),L_('Eleman yok',`There is no element`)],a:0,why:L_('Lineerlik için w = 0 gerekir (orijinden geçme). Bağımsız kaynaklar da afindir.',`Linearity requires w = 0 (passing through the origin). Independent sources are affine too.`)},
  {q:L_('İdeal op-amp ETB matrisinde M\'nin i<sub>o</sub> sütunu hep sıfır. Anlamı?',`In the ideal op amp's branch-equation matrix, the i<sub>o</sub> column of M is always zero. Meaning?`),opts:[L_('i<sub>o</sub> hiçbir denklemde yok: çıkış gereken akımı verir',`i<sub>o</sub> appears in no equation: the output supplies whatever current is needed`),'i<sub>o</sub> = 0',L_('Çıkış açık devre',`The output is an open circuit`)],a:0,why:L_('Çıkış akımını dış devre belirler (KAY), op-amp kısıtlamaz.',`The output current is set by the external circuit (KCL); the op amp does not constrain it.`)}]}
]},
/* ---------------- 13 ---------------- */
{id:'c13',icon:'🧭',title:L_('Lineer Cebir Köprüsü',`Linear Algebra Bridge`),sub:L_('EDT ↔ lineer cebir',`circuits ↔ linear algebra`),pos:[60,84],steps:[
 {type:'talk',visual:vLAmap,mood:'wow',
  say:L_(`Bu durak dersin <b>gizli iskeletini</b> gösteriyor 🦴 Ders 1–4'te yaptığın her şey aslında lineer cebir!<br><br>Bir devredeki ne tane akımı alt alta yaz: bu bir <b>vektör</b>, i ∈ ℝ<sup>ne</sup>. Gerilimler de öyle. KAY, KGY ve Tellegen bu vektörler hakkında <b>geometrik</b> cümleler kuruyor:<br>• KAY → i, A'nın <span class="k">boş uzayında</span><br>• KGY → v, Aᵀ'nin <span class="k">sütun uzayında</span><br>• Tellegen → bu iki uzay <span class="k">dik</span><br><br>"Neden nd − 1 bağımsız denklem?" sorusunun cevabı da burada: <b>rank</b>.`,`This stop shows the <b>hidden skeleton</b> of the course 🦴 Everything you did in Lectures 1–4 is actually linear algebra!<br><br>Stack the ne currents of a circuit: that is a <b>vector</b>, i ∈ ℝ<sup>ne</sup>. The voltages too. KCL, KVL and Tellegen make <b>geometric</b> statements about these vectors:<br>• KCL → i lies in the <span class="k">null space</span> of A<br>• KVL → v lies in the <span class="k">column space</span> of Aᵀ<br>• Tellegen → these two spaces are <span class="k">orthogonal</span><br><br>The answer to "why nd − 1 independent equations?" is here too: <b>rank</b>.`),
  formal:L_(`<b>Boş uzay:</b> N(A) = { x : A·x = 0 }. <b>Sütun uzayı:</b> R(Aᵀ) = { Aᵀe : e ∈ ℝ<sup>nd−1</sup> }.<br><b>Rank:</b> lineer bağımsız satır (= sütun) sayısı.<br><b>Rank–sıfırlık:</b> m × n matris için rank A + dim N(A) = n.`,`<b>Null space:</b> N(A) = { x : A·x = 0 }. <b>Column space:</b> R(Aᵀ) = { Aᵀe : e ∈ ℝ<sup>nd−1</sup> }.<br><b>Rank:</b> the number of linearly independent rows (= columns).<br><b>Rank–nullity:</b> for an m × n matrix, rank A + dim N(A) = n.`)},
 {type:'task',setup:nullTask,
  say:L_(`<b>Boş uzay</b> = A·x = 0 yapan <b>tüm</b> x'ler. KAY tam olarak bu: A·i = 0.<br><br>Bu grafta ağaç {1, 2, 3}, kirişler {4, 5, 6}. Kiriş akımlarını sürgülerle <b>serbestçe</b> seç: dal akımları kendiliğinden belirleniyor ve A·i her seferinde 0!<br><br>Neden? i, temel çevre vektörlerinin (B'nin satırları) bir <b>lineer kombinasyonu</b>: <span class="k">i = Bᵀ·i<sub>L</sub></span>. Kaç serbest sürgü var? O sayı boş uzayın <b>boyutu</b>.`,`<b>Null space</b> = <b>all</b> x with A·x = 0. KCL is exactly this: A·i = 0.<br><br>In this graph the tree is {1, 2, 3}, links {4, 5, 6}. Choose the link currents <b>freely</b> with the sliders: the tree-branch currents are determined automatically and A·i is 0 every time!<br><br>Why? i is a <b>linear combination</b> of the fundamental loop vectors (rows of B): <span class="k">i = Bᵀ·i<sub>L</sub></span>. How many free sliders are there? That number is the <b>dimension</b> of the null space.`),
  formal:L_(`<b>Taban:</b> uzayı geren, lineer bağımsız vektörler. B'nin satırları (temel çevreler) N(A) için bir tabandır.<br><b>Boyut:</b> dim N(A) = ne − rank A = ne − nd + 1 = kiriş sayısı.<br>Her KAY çözümü: i = Bᵀ·i<sub>L</sub>. ("Çevre akımları" buradan gelir.)`,`<b>Basis:</b> linearly independent vectors that span the space. The rows of B (fundamental loops) form a basis for N(A).<br><b>Dimension:</b> dim N(A) = ne − rank A = ne − nd + 1 = number of links.<br>Every KCL solution: i = Bᵀ·i<sub>L</sub>. ("Loop currents" come from here.)`)},
 {type:'task',setup:indepTask,
  say:L_(`<b>Lineer bağımsızlık</b>: hiçbir denklem diğerlerinin lineer kombinasyonu olarak yazılamıyorsa denklemler bağımsızdır. Pratik test: seçtiğin satırlarla matris kur, <span class="k">rank = satır sayısı</span> ise bağımsız.<br><br>4 görev var (alttaki çipler). KAY ve KGY sekmeleri arasında geçiş yap.<br><br>💡 Neden önemli? Bağımlı bir denklem <b>yeni bilgi taşımaz</b>; çözmek için bağımsız denklem sayısı = bilinmeyen sayısı olmalı.`,`<b>Linear independence</b>: equations are independent if none can be written as a linear combination of the others. Practical test: build a matrix from the rows you chose; if <span class="k">rank = number of rows</span>, they are independent.<br><br>There are 4 tasks (chips at the bottom). Switch between the KCL and KVL tabs.<br><br>💡 Why does it matter? A dependent equation carries <b>no new information</b>; to solve, the number of independent equations must equal the number of unknowns.`),
  formal:L_(`x₁, …, x<sub>k</sub> lineer bağımsız ⇔ c₁x₁ + … + c<sub>k</sub>x<sub>k</sub> = 0 yalnızca c₁ = … = c<sub>k</sub> = 0 için.<br>Bağımsız KAY sayısı = rank A = nd − 1. Bağımsız KGY sayısı = rank B = dim N(A) = ne − nd + 1.`,`x₁, …, x<sub>k</sub> are linearly independent ⇔ c₁x₁ + … + c<sub>k</sub>x<sub>k</sub> = 0 only for c₁ = … = c<sub>k</sub> = 0.<br># independent KCL equations = rank A = nd − 1. # independent KVL equations = rank B = dim N(A) = ne − nd + 1.`)},
 {type:'talk',visual:vRREF,
  say:L_(`Ders 4'te Q'yu "kesitlemelere bakarak" doldurdun. Lineer cebir gözüyle Q aslında A'nın <b>indirgenmiş satır eşelon biçimi</b>!<br><br>A'nın sütunlarını önce dallar, sonra kirişler diye diz. Dallara ait kare blok A<sub>T</sub> tersinirdir (çünkü ağaç!). Soldan A<sub>T</sub><sup>−1</sup> ile çarp: <span class="k">Q = A<sub>T</sub><sup>−1</sup>A = [ I | Q<sub>L</sub> ]</span>.<br><br>Satır işlemleri çözüm kümesini değiştirmez: Q·i = 0 ile A·i = 0 <b>aynı</b> KAY'lar. Farklı ağaç = farklı pivot seçimi. Butonlarla dene!`,`In Lecture 4 you filled in Q "by looking at cut sets". Through linear-algebra eyes, Q is actually the <b>reduced row echelon form</b> of A!<br><br>Order the columns of A as tree branches first, then links. The square tree-branch block A<sub>T</sub> is invertible (because it's a tree!). Multiply by A<sub>T</sub><sup>−1</sup> from the left: <span class="k">Q = A<sub>T</sub><sup>−1</sup>A = [ I | Q<sub>L</sub> ]</span>.<br><br>Row operations do not change the solution set: Q·i = 0 and A·i = 0 are the <b>same</b> KCL equations. A different tree = a different choice of pivots. Try the buttons!`),
  formal:L_(`A = [ A<sub>T</sub> | A<sub>L</sub> ]. A<sub>T</sub> tersinir ⇔ T bir ağaç.<br>Q = A<sub>T</sub><sup>−1</sup>A = [ I | A<sub>T</sub><sup>−1</sup>A<sub>L</sub> ] ⇒ Q<sub>L</sub> = A<sub>T</sub><sup>−1</sup>A<sub>L</sub>.<br>Q·i = 0 ⇒ i<sub>T</sub> = −Q<sub>L</sub>i<sub>L</sub>. B = [ −Q<sub>L</sub>ᵀ | I ] ⇒ B·Qᵀ = −Q<sub>L</sub>ᵀ + Q<sub>L</sub>ᵀ = 0.`,`A = [ A<sub>T</sub> | A<sub>L</sub> ]. A<sub>T</sub> is invertible ⇔ T is a tree.<br>Q = A<sub>T</sub><sup>−1</sup>A = [ I | A<sub>T</sub><sup>−1</sup>A<sub>L</sub> ] ⇒ Q<sub>L</sub> = A<sub>T</sub><sup>−1</sup>A<sub>L</sub>.<br>Q·i = 0 ⇒ i<sub>T</sub> = −Q<sub>L</sub>i<sub>L</sub>. B = [ −Q<sub>L</sub>ᵀ | I ] ⇒ B·Qᵀ = −Q<sub>L</sub>ᵀ + Q<sub>L</sub>ᵀ = 0.`)},
 {type:'talk',visual:vOrtho,
  say:L_(`En sade örnek: <b>üçgen graf</b> (3 düğüm, 3 çizgi). Akım ve gerilim vektörleri ℝ³'te, yani <b>gözünle görebileceğin</b> bir uzayda!<br>• KAY: i₁ = i₂ = i₃ → tüm akımlar <b>(1, 1, 1) doğrusu</b> üzerinde (boyut 1 = kiriş sayısı).<br>• KGY: v₁ + v₂ + v₃ = 0 → tüm gerilimler bir <b>düzlemde</b> (boyut 2 = nd − 1).<br><br>Doğru düzleme <b>dik</b>! Bu yüzden vᵀi = 0: Tellegen teoremi aslında bir <span class="k">diklik</span> teoremi. Sürgülerle oyna.`,`The simplest example: the <b>triangle graph</b> (3 nodes, 3 branches). Current and voltage vectors live in ℝ³, a space you can <b>see</b>!<br>• KCL: i₁ = i₂ = i₃ → all currents lie on the <b>line through (1, 1, 1)</b> (dimension 1 = number of links).<br>• KVL: v₁ + v₂ + v₃ = 0 → all voltages lie in a <b>plane</b> (dimension 2 = nd − 1).<br><br>The line is <b>perpendicular</b> to the plane! That is why vᵀi = 0: Tellegen's theorem is really an <span class="k">orthogonality</span> theorem. Play with the sliders.`),
  formal:L_(`i ∈ N(A), v = Aᵀe ⇒ vᵀi = eᵀ(A·i) = 0 ⇒ N(A) ⊥ R(Aᵀ).<br>dim R(Aᵀ) + dim N(A) = ne ⇒ ℝ<sup>ne</sup> = R(Aᵀ) ⊕ N(A) (dik tümleyenler).<br>Kesitleme uzayı = Q'nun satır uzayı = R(Aᵀ). Çevre uzayı = B'nin satır uzayı = N(A). B·Qᵀ = 0 bu dikliğin matris hâli.`,`i ∈ N(A), v = Aᵀe ⇒ vᵀi = eᵀ(A·i) = 0 ⇒ N(A) ⊥ R(Aᵀ).<br>dim R(Aᵀ) + dim N(A) = ne ⇒ ℝ<sup>ne</sup> = R(Aᵀ) ⊕ N(A) (orthogonal complements).<br>Cut-set space = row space of Q = R(Aᵀ). Loop space = row space of B = N(A). B·Qᵀ = 0 is the matrix form of this orthogonality.`)},
 {type:'talk',visual:vLAtable,
  say:L_(`🧭 <b>Özet haritası</b>: Bir EDT kavramı gördüğünde lineer cebirdeki karşılığını hatırla. Sınavdaki "neden?" sorularının cevabı genelde sağ sütunda!<br><br>Bir sonraki durakta (düğüm gerilimleri) bu tablonun alt satırlarını <b>kullanacağız</b>: Ĝ = A G<sub>d</sub> Aᵀ neden hep tersinir?`,`🧭 <b>Summary map</b>: whenever you meet a circuit-theory concept, recall its linear-algebra counterpart. The answers to "why?" questions in the exam are usually in the right column!<br><br>At the next stop (node analysis) we'll <b>use</b> the bottom rows of this table: why is Ĝ = A G<sub>d</sub> Aᵀ always invertible?`)},
 {type:'quiz',say:L_(`Lineer cebir köprüsü testi 🧭`,`Linear algebra bridge quiz 🧭`),questions:[
  {q:L_('A·i = 0 denklemini sağlayan tüm akım vektörlerinin kümesine ne denir?',`What is the set of all current vectors satisfying A·i = 0 called?`),opts:[L_('A\'nın boş uzayı N(A)',`The null space of A, N(A)`),L_('A\'nın sütun uzayı',`The column space of A`),L_('A\'nın tersi',`The inverse of A`),L_('Özdeğer',`An eigenvalue`)],a:0,why:L_('KAY ⇔ i ∈ N(A).',`KCL ⇔ i ∈ N(A).`)},
  {q:L_('nd = 5, ne = 9 olan birleşik grafta dim N(A) = ?',`In a connected graph with nd = 5, ne = 9, dim N(A) = ?`),opts:['5','4','9','14'],a:0,why:L_('dim N(A) = ne − rank A = 9 − 4 = 5 = kiriş sayısı.',`dim N(A) = ne − rank A = 9 − 4 = 5 = number of links.`)},
  {q:L_('v = Aᵀe ne söyler?',`What does v = Aᵀe say?`),opts:[L_('Her KGY\'li gerilim vektörü, düğüm gerilimlerinin lineer kombinasyonudur (v ∈ R(Aᵀ))',`Every voltage vector satisfying KVL is a linear combination of node voltages (v ∈ R(Aᵀ))`),'v = 0',L_('Akımlar gerilimlere eşittir',`Currents equal voltages`)],a:0,why:L_('Aᵀ\'nin sütunları ile e\'nin bileşenleri birleştirilir: v, Aᵀ\'nin sütun uzayında.',`The columns of Aᵀ are combined with the components of e: v is in the column space of Aᵀ.`)},
  {q:L_('Tüm düğümler için yazılan nd KAY neden bağımsız değil?',`Why are the nd KCL equations written for all nodes not independent?`),opts:[L_('Aₐ\'nın satırlarının toplamı 0, rank = nd − 1',`The rows of Aₐ sum to 0, rank = nd − 1`),L_('Çünkü akımlar bilinmiyor',`Because the currents are unknown`),L_('Bağımsızdır',`They are independent`)],a:0,why:L_('Her sütunda bir +1 bir −1: satırlar toplamı sıfır vektör → bağımlı.',`Each column has one +1 and one −1: the rows sum to the zero vector → dependent.`)},
  {q:L_('Temel çevre vektörleri (B\'nin satırları) N(A) için ne oluşturur?',`What do the fundamental loop vectors (rows of B) form for N(A)?`),opts:[L_('Bir taban',`A basis`),L_('Hiçbir şey; N(A)\'da değiller',`Nothing; they are not in N(A)`),L_('Dik tümleyen',`The orthogonal complement`)],a:0,why:L_('Her biri A·b = 0 sağlar, bağımsızdır (her birinde farklı tek kiriş) ve sayıları dim N(A)\'ya eşit.',`Each satisfies A·b = 0, they are independent (each has a different single link), and their number equals dim N(A).`)},
  {q:L_('Ağaç seçmek Gauss eliminasyonunda neye karşılık gelir?',`What does choosing a tree correspond to in Gaussian elimination?`),opts:[L_('Pivot sütunlarını seçmeye; kiriş akımları serbest değişken olur',`Choosing the pivot columns; the link currents become free variables`),L_('Determinant almaya',`Taking a determinant`),L_('Matrisi transpoze etmeye',`Transposing the matrix`)],a:0,why:L_('Q = A<sub>T</sub><sup>−1</sup>A: dal sütunları birim matrise dönüşür (pivotlar).',`Q = A<sub>T</sub><sup>−1</sup>A: the tree-branch columns turn into the identity matrix (pivots).`)},
  {q:L_('Tellegen teoremi lineer cebirde ne demek?',`What does Tellegen's theorem mean in linear algebra?`),opts:[L_('N(A) ve R(Aᵀ) birbirine diktir: vᵀi = 0',`N(A) and R(Aᵀ) are orthogonal: vᵀi = 0`),L_('A tersinirdir',`A is invertible`),L_('Her vektör sıfırdır',`Every vector is zero`)],a:0,why:'vᵀi = eᵀAi = eᵀ·0 = 0.'},
  {q:L_('6 çizgili, 4 düğümlü birleşik grafta 4 çevre denklemi seçtin. Bağımsız olabilirler mi?',`In a connected graph with 6 branches and 4 nodes you chose 4 loop equations. Can they be independent?`),opts:[L_('Hayır: dim N(A) = 3, en fazla 3 bağımsız çevre',`No: dim N(A) = 3, at most 3 independent loops`),L_('Evet, her zaman',`Yes, always`),L_('Sadece ağaç uygunsa',`Only if the tree is suitable`)],a:0,why:L_('Çevre vektörleri 3 boyutlu N(A) içinde; 3\'ten fazlası hep bağımlı.',`The loop vectors lie in the 3-dimensional N(A); more than 3 are always dependent.`)},
  {q:L_('B·Qᵀ = 0 ne anlatır?',`What does B·Qᵀ = 0 express?`),opts:[L_('Çevre uzayı ile kesitleme uzayı dik: ℝ<sup>ne</sup> = R(Aᵀ) ⊕ N(A)',`The loop space and cut-set space are orthogonal: ℝ<sup>ne</sup> = R(Aᵀ) ⊕ N(A)`),'B = Q',L_('Q tersinir',`Q is invertible`)],a:0,why:L_('B\'nin satırları N(A)\'yı, Q\'nunkiler R(Aᵀ)\'yı gerer; çarpımın sıfır olması dikliktir.',`The rows of B span N(A), those of Q span R(Aᵀ); a zero product means orthogonality.`)}]}
]},
/* ---------------- 14 ---------------- */
{id:'c14',icon:'🧮',title:L_('Düğüm Gerilimleri Yöntemi',`Node Analysis`),sub:L_('Ders 8',`Lecture 8`),pos:[77,78],steps:[
 {type:'talk',visual:vNodeFlow,
  say:L_(`Ders 8'in son konusu: <b>Lineer Direnç Devreleri</b> ve <b>Genelleştirilmiş Düğüm Gerilimleri Yöntemi</b> 🧮<br><br>Elimizde 2ne bilinmeyen (v, i) ve 2ne denklem var. Hepsini aynı anda çözmek yorucu.<br><br>Hile: KGY'yi <span class="k">v = Aᵀe</span> biçiminde kullan. O zaman nd − 1 tane e her şeyi belirler: e → v → (ETB) → i. Geriye sadece A·i = 0 kalır: <b>nd − 1 denklem, nd − 1 bilinmeyen</b>.`,`The last topic of Lecture 8: <b>Linear Resistive Circuits</b> and <b>Generalized Node Analysis</b> 🧮<br><br>We have 2ne unknowns (v, i) and 2ne equations. Solving them all at once is tiring.<br><br>The trick: use KVL in the form <span class="k">v = Aᵀe</span>. Then the nd − 1 node voltages e determine everything: e → v → (branch eqs) → i. Only A·i = 0 remains: <b>nd − 1 equations, nd − 1 unknowns</b>.`),
  formal:L_(`Lineer, zamanla değişmeyen direnç elemanları + bağımsız kaynaklar.<br><b>Yararlanılacaklar:</b> KAY A·i = 0 (nd − 1), KGY B·v = 0 (ne − nd + 1), ETB M·v + N·i = w (ne). Bilinmeyen: v, i (2ne).<br>v = Aᵀe: "düğüm gerilimleri → tüm eleman gerilimleri"; M·v + N·i = w: "→ tüm eleman akımları". <small>(Chua–Desoer–Kuh sf. 214–223)</small>`,`Linear time-invariant resistive elements + independent sources.<br><b>Tools:</b> KCL A·i = 0 (nd − 1), KVL B·v = 0 (ne − nd + 1), branch eqs M·v + N·i = w (ne). Unknowns: v, i (2ne).<br>v = Aᵀe: "node voltages → all branch voltages"; M·v + N·i = w: "→ all branch currents". <small>(Chua–Desoer–Kuh pp. 214–223)</small>`)},
 {type:'talk',visual:vNodeSteps,
  say:L_(`<b>Özel durum</b>: sadece lineer 2-uçlu dirençler ve bağımsız <b>akım</b> kaynakları. Her çizginin ETB'si: <span class="k">i = G<sub>d</sub>·v + i<sub>k</sub></span><br>(G<sub>d</sub>: köşegen iletkenlik matrisi; kaynak çizgilerinde G = 0 ve i<sub>k</sub> = kaynak akımı.)<br><br>4 adımda <span class="k">Ĝ e = i<sub>b</sub></span> elde edilir. Sınavda elle kurarken alttaki kısayolu kullan.`,`<b>Special case</b>: only linear 2-terminal resistors and independent <b>current</b> sources. Each branch equation: <span class="k">i = G<sub>d</sub>·v + i<sub>k</sub></span><br>(G<sub>d</sub>: diagonal conductance matrix; source branches have G = 0 and i<sub>k</sub> = source current.)<br><br>In 4 steps we get <span class="k">Ĝ e = i<sub>b</sub></span>. When building it by hand in the exam, use the shortcut below.`),
  formal:L_(`1. Adım: nd − 1 düğüm için KAY: A·i = 0.<br>2. Adım: ETB yerleştir: A[G<sub>d</sub>v + i<sub>k</sub>] = 0 ⇒ AG<sub>d</sub>v = −Ai<sub>k</sub>.<br>3. Adım: v = Aᵀe ⇒ AG<sub>d</sub>Aᵀe = −Ai<sub>k</sub>.<br>4. Adım: Ĝ e = i<sub>b</sub> çöz.`,`Step 1: KCL for nd − 1 nodes: A·i = 0.<br>Step 2: substitute branch eqs: A[G<sub>d</sub>v + i<sub>k</sub>] = 0 ⇒ AG<sub>d</sub>v = −Ai<sub>k</sub>.<br>Step 3: v = Aᵀe ⇒ AG<sub>d</sub>Aᵀe = −Ai<sub>k</sub>.<br>Step 4: solve Ĝ e = i<sub>b</sub>.`)},
 {type:'task',say:L_(`Slayttaki devrenin grafı: a = sol, b = orta, c = sağ düğüm, d = toprak (referans).<br>Çizgiler: 1 = R₁, 2 = R₂, 3 = R₃, 4 = R₄, 5 = I<sub>s1</sub>, 6 = I<sub>s2</sub> (kaynak oku = akım yönü).<br><br><b>A matrisini doldur</b> (satırlar a, b, c): çizgi düğümden çıkıyorsa +1, giriyorsa −1. Hücreye tıkla: 0 → 1 → −1.`,`The graph of the circuit from the slides: a = left, b = middle, c = right node, d = ground (datum).<br>Branches: 1 = R₁, 2 = R₂, 3 = R₃, 4 = R₄, 5 = I<sub>s1</sub>, 6 = I<sub>s2</sub> (source arrow = current direction).<br><br><b>Fill in the matrix A</b> (rows a, b, c): +1 if the branch leaves the node, −1 if it enters. Click a cell: 0 → 1 → −1.`),
  setup(stage,api){const g=G4,M=Aa(g).slice(0,3);
   stage.innerHTML=L_(`<svg class="g" viewBox="0 0 600 420" style="max-height:38vh"></svg><div id="mx"></div><div class="tools"><button class="btn" id="chk">Kontrol et</button><button class="btn ghost small" id="hint">💡 Bir sütunu göster</button></div>`,`<svg class="g" viewBox="0 0 600 420" style="max-height:38vh"></svg><div id="mx"></div><div class="tools"><button class="btn" id="chk">Check</button><button class="btn ghost small" id="hint">💡 Reveal a column</button></div>`);
   drawGraph(stage.querySelector('svg'),g,{ref:4});
   const ed=matrixEditor(stage.querySelector('#mx'),{rows:['a','b','c'],cols:g.edges.map(e=>e.id),answer:M});
   stage.querySelector('#chk').onclick=()=>{const w=ed.check();if(!w){api.done();ed.lockAll();fb(L_('✅ A doğru! Şimdi Ĝ = A G<sub>d</sub> Aᵀ ve i<sub>b</sub> = −A i<sub>k</sub> kurulabilir.',`✅ A is correct! Now Ĝ = A G<sub>d</sub> Aᵀ and i<sub>b</sub> = −A i<sub>k</sub> can be built.`),'ok')}else{api.mistake();fb(L_(`${w} hücre hatalı. Okun kuyruğu +1, ucu −1; d satırı yok.`,`${w} cell(s) wrong. Arrow tail +1, head −1; there is no row d.`),'bad')}};
   stage.querySelector('#hint').onclick=()=>{const j=ed.firstWrongCol();if(j<0){fb(L_('Hepsi doğru görünüyor, Kontrol et!',`Everything looks right; press Check!`),'info');return}ST.mist+=.5;ed.revealCol(j);const e=g.edges[j];fb(L_(`Çizgi ${e.id}: ${nn(e.from)} → ${nn(e.to)}.`,`Branch ${e.id}: ${nn(e.from)} → ${nn(e.to)}.`),'info')}}},
 {type:'talk',visual:vNodeLA,mood:'wow',
  say:L_(`Neden Ĝe = i<sub>b</sub>'nin <b>tek çözümü</b> var? Lineer cebir cevaplıyor:<br>① <b>Simetrik</b>: Ĝᵀ = (AG<sub>d</sub>Aᵀ)ᵀ = AG<sub>d</sub>Aᵀ.<br>② <b>Pozitif tanımlı</b> (R &gt; 0 ve dirençler tüm düğümleri bağlıyorsa): xᵀĜx = Σ G<sub>k</sub>(Aᵀx)<sub>k</sub>² &gt; 0. Sıfır olması için Aᵀx = 0 gerekir; rank A = nd − 1 (satırlar <b>bağımsız</b>!) olduğundan bu sadece x = 0'da olur.<br>③ Pozitif tanımlı ⇒ <b>tersinir</b> ⇒ tek çözüm.<br><br>Referans satırını silmeseydik? Butona bas.`,`Why does Ĝe = i<sub>b</sub> have a <b>unique solution</b>? Linear algebra answers:<br>① <b>Symmetric</b>: Ĝᵀ = (AG<sub>d</sub>Aᵀ)ᵀ = AG<sub>d</sub>Aᵀ.<br>② <b>Positive definite</b> (if R &gt; 0 and the resistors connect all nodes): xᵀĜx = Σ G<sub>k</sub>(Aᵀx)<sub>k</sub>² &gt; 0. For it to be zero we need Aᵀx = 0; since rank A = nd − 1 (the rows are <b>independent</b>!), that only happens for x = 0.<br>③ Positive definite ⇒ <b>invertible</b> ⇒ unique solution.<br><br>What if we hadn't deleted the datum row? Press the button.`),
  formal:L_(`Ĝ = AG<sub>d</sub>Aᵀ, i<sub>b</sub> = −Ai<sub>k</sub>.<br>Aₐ ile kurulan Ĝₐ'nın satır toplamları 0 ⇒ (1, 1, …, 1) boş uzayında ⇒ tekil. Fiziksel anlamı: tüm düğüm gerilimlerine aynı sabiti eklemek hiçbir eleman gerilimini değiştirmez; bu yüzden bir referans seçmek zorundayız.`,`Ĝ = AG<sub>d</sub>Aᵀ, i<sub>b</sub> = −Ai<sub>k</sub>.<br>Ĝₐ built with Aₐ has zero row sums ⇒ (1, 1, …, 1) is in its null space ⇒ singular. Physically: adding the same constant to all node voltages changes no branch voltage; that is why we must choose a datum.`)},
 {type:'task',setup:chainTask({fig:circS20,steps:EXNODE}),
  say:L_(`Slayttaki soru 📝: I<sub>s1</sub> = 10 A, I<sub>s2</sub> = sin t A, R₁ = 1, R₂ = 2, R₃ = 3, R₄ = 7 Ω. Düğüm gerilimlerini bul.<br><br>Kısayol (A G<sub>d</sub> Aᵀ'yi çarpmadan): Ĝ'nin köşegeni = düğüme bağlı iletkenlikler toplamı, köşegen dışı = −(iki düğüm arasındaki iletkenlik).<br><br>Kutulara kesir yerine ondalık yaz (ör. 5/6 ≈ 0.833).`,`The problem from the slides 📝: I<sub>s1</sub> = 10 A, I<sub>s2</sub> = sin t A, R₁ = 1, R₂ = 2, R₃ = 3, R₄ = 7 Ω. Find the node voltages.<br><br>Shortcut (without multiplying A G<sub>d</sub> Aᵀ): diagonal of Ĝ = sum of conductances at the node, off-diagonal = −(conductance between the two nodes).<br><br>Enter decimals instead of fractions (e.g. 5/6 ≈ 0.833).`)},
 {type:'quiz',say:L_(`Düğüm gerilimleri testi 🧮`,`Node analysis quiz 🧮`),questions:[
  {q:L_('Genelleştirilmiş düğüm gerilimleri yönteminde bilinmeyenler?',`What are the unknowns in generalized node analysis?`),opts:[L_('nd − 1 düğüm gerilimi (e)',`The nd − 1 node voltages (e)`),L_('Tüm eleman akımları',`All branch currents`),L_('ne − nd + 1 çevre akımı',`ne − nd + 1 loop currents`)],a:0,why:L_('v = Aᵀe ile KGY otomatik sağlanır, geriye e kalır.',`v = Aᵀe satisfies KVL automatically; e remains.`)},
  {q:L_('Ĝ = AG<sub>d</sub>Aᵀ matrisi (pozitif dirençler, birleşik direnç ağı) için hangisi doğru?',`Which is true for Ĝ = AG<sub>d</sub>Aᵀ (positive resistors, connected resistor network)?`),opts:[L_('Simetrik ve tersinir (pozitif tanımlı)',`Symmetric and invertible (positive definite)`),L_('Her zaman tekil',`Always singular`),L_('Köşegen',`Diagonal`)],a:0,why:L_('Simetri transpozdan, tersinirlik rank A = nd − 1\'den gelir.',`Symmetry comes from the transpose, invertibility from rank A = nd − 1.`)},
  {q:L_('Ĝ\'nin köşegen elemanı Ĝ<sub>kk</sub> nedir?',`What is the diagonal entry Ĝ<sub>kk</sub>?`),opts:[L_('k düğümüne bağlı iletkenliklerin toplamı',`The sum of conductances connected to node k`),L_('k düğümüne bağlı dirençlerin toplamı',`The sum of resistances connected to node k`),L_('Her zaman 1',`Always 1`)],a:0,why:L_('(AG<sub>d</sub>Aᵀ)<sub>kk</sub> = Σ G<sub>j</sub>·A<sub>kj</sub>² = k\'ya değen çizgilerin iletkenlikleri.',`(AG<sub>d</sub>Aᵀ)<sub>kk</sub> = Σ G<sub>j</sub>·A<sub>kj</sub>² = the conductances of the branches touching k.`)},
  {q:L_('Ĝ<sub>kj</sub> (k ≠ j) nedir?',`What is Ĝ<sub>kj</sub> (k ≠ j)?`),opts:[L_('−(k ile j arasındaki iletkenliklerin toplamı)',`−(sum of conductances between k and j)`),L_('+(k ile j arasındaki iletkenlik)',`+(conductance between k and j)`),'0'],a:0,why:L_('Bir çizgi k\'dan çıkıp j\'ye giriyorsa A<sub>k</sub>A<sub>j</sub> = −1.',`If a branch leaves k and enters j, A<sub>k</sub>A<sub>j</sub> = −1.`)},
  {q:L_('Bağımsız akım kaynakları denkleme nereden girer?',`Where do independent current sources enter the equations?`),opts:[L_('Sağ taraf i<sub>b</sub> = −A·i<sub>k</sub>',`The right-hand side i<sub>b</sub> = −A·i<sub>k</sub>`),L_('Ĝ\'nin köşegenine',`The diagonal of Ĝ`),L_('Hiç girmez',`They don't enter at all`)],a:0,why:L_('Kaynak çizgisinde G = 0: Ĝ\'ye katkısı yok, sadece i<sub>b</sub>\'ye.',`A source branch has G = 0: no contribution to Ĝ, only to i<sub>b</sub>.`)},
  {q:L_('Referans satırını silmeden Ĝₐ = AₐG<sub>d</sub>Aₐᵀ kurarsak?',`What if we build Ĝₐ = AₐG<sub>d</sub>Aₐᵀ without deleting the datum row?`),opts:[L_('Satır toplamları 0 → tekil, tek çözüm yok',`Zero row sums → singular, no unique solution`),L_('Daha doğru sonuç',`A more accurate result`),L_('Aynı çözüm',`The same solution`)],a:0,why:L_('Aₐ\'nın satırları bağımlı; (1, …, 1) vektörü Ĝₐ\'nın boş uzayında.',`The rows of Aₐ are dependent; the vector (1, …, 1) is in the null space of Ĝₐ.`)},
  {q:L_('Kaynaklar 10 A ve sin t ise e(t) neden e<sub>DC</sub> + e<sub>s</sub> sin t biçiminde?',`With sources 10 A and sin t, why is e(t) of the form e<sub>DC</sub> + e<sub>s</sub> sin t?`),opts:[L_('Lineerlik (süperpozisyon): e = Ĝ<sup>−1</sup>i<sub>b</sub>, i<sub>b</sub>\'ye lineer bağlı',`Linearity (superposition): e = Ĝ<sup>−1</sup>i<sub>b</sub> depends linearly on i<sub>b</sub>`),L_('Tesadüf',`Coincidence`),L_('Sadece DC kaynak etkili',`Only the DC source matters`)],a:0,why:L_('Lineer dönüşüm toplamı toplama, katı katına götürür.',`A linear map takes sums to sums and multiples to multiples.`)},
  {q:L_('Düğüm gerilimleri bulununca eleman gerilimleri nasıl bulunur?',`Once the node voltages are known, how are the branch voltages found?`),opts:['v = Aᵀe','v = Ae','v = Ĝe'],a:0,why:L_('KGY: her çizginin gerilimi = kuyruk düğümünün gerilimi − uç düğümünün gerilimi.',`KVL: each branch voltage = voltage of its tail node − voltage of its head node.`)}]}
