/* =========================================================
   GERİ BİLDİRİM (Google Apps Script → Google Sheets)
   config.js içindeki EDT_CONFIG.feedbackUrl'e POST edilir.
   ========================================================= */
const FB_CATS=()=>[['content',L_('İçerik / kavram hatası','Content / concept error')],['answer',L_('Yanlış cevap veya hesap','Wrong answer or calculation')],
  ['typo',L_('Yazım / çeviri hatası','Typo / translation error')],['ui',L_('Görsel, hizalama, mobil sorunu','Visual / layout / mobile issue')],
  ['bug',L_('Çalışmıyor / takıldı','Not working / stuck')],['idea',L_('Öneri','Suggestion')]];
function fbContext(){const onLesson=$('#lesson').classList.contains('on');
  if(!onLesson||!CH)return {chapter:'map',chapterTitle:L_('Harita','Map'),step:'',stepType:'',sub:''};
  const st=CH.steps[SI];return {chapter:CH.id,chapterTitle:CH.title,step:(SI+1)+'/'+CH.steps.length,stepType:st.type,sub:window.SUBCTX||''}}
function fbQueue(){try{return JSON.parse(localStorage.getItem('edt_fb_queue'))||[]}catch(e){return[]}}
function fbSetQueue(q){try{localStorage.setItem('edt_fb_queue',JSON.stringify(q.slice(-30)))}catch(e){}}
async function postFeedback(p){if(!FEEDBACK_URL)return false;
  try{await fetch(FEEDBACK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});return true}catch(e){return false}}
async function flushFeedback(){const q=fbQueue();if(!q.length||!FEEDBACK_URL)return;const rest=[];
  for(const p of q){if(!(await postFeedback(p)))rest.push(p)}fbSetQueue(rest)}
function openFeedback(){if($('#fbModal'))return;SFX.click();const c=fbContext();
  const m=document.createElement('div');m.className='modal';m.id='fbModal';
  m.innerHTML=`<form class="mcard fbcard" autocomplete="off" novalidate>
   <h2>🐞 ${L_('Hata bildir / yorum yaz','Report an issue / comment')}</h2>
   <div class="fbctx">📍 ${c.chapterTitle}${c.step?` · ${L_('adım','step')} ${c.step}`:''}${c.sub?` · ${c.sub}`:''}</div>
   <label>${L_('Ne tür bir sorun?','What kind of issue?')}<select name="cat">${FB_CATS().map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></label>
   <label>${L_('Açıklama','Description')}<textarea name="msg" maxlength="2000" placeholder="${L_('Ne yanlış? Doğrusu ne olmalı? (Soru/şık metnini de yazabilirsin.)','What is wrong? What should it be? (You can paste the question/option text.)')}"></textarea></label>
   <label>${L_('İsim veya rumuz (isteğe bağlı)','Name or nickname (optional)')}<input name="who" maxlength="60"></label>
   <input name="hp" class="hp" tabindex="-1" aria-hidden="true">
   <div class="fbnote">${L_('Bulunduğun bölüm, adım ve soru numarası otomatik eklenir.','Your current chapter, step and question number are attached automatically.')}${FEEDBACK_URL?'':' ⚠️ '+L_('Sunucu henüz ayarlanmadı; yorum bu cihazda saklanır.','Server not configured yet; your comment is stored on this device.')}</div>
   <div class="fbmsg"></div>
   <div class="fbbtns"><button type="button" class="btn ghost" data-x>${L_('Vazgeç','Cancel')}</button><button type="submit" class="btn pink">${L_('Gönder','Send')}</button></div></form>`;
  document.body.appendChild(m);
  const f=m.querySelector('form'),E=f.elements,out=(t,k)=>{const o=m.querySelector('.fbmsg');o.className='fbmsg '+k;o.innerHTML=t};
  try{E.namedItem('who').value=localStorage.getItem('edt_fb_name')||''}catch(e){}
  const close=()=>{m.remove();document.removeEventListener('keydown',esc)},esc=ev=>{if(ev.key==='Escape')close()};
  document.addEventListener('keydown',esc);m.addEventListener('click',ev=>{if(ev.target===m)close()});
  m.querySelector('[data-x]').onclick=close;setTimeout(()=>E.namedItem('msg').focus(),50);
  f.onsubmit=async ev=>{ev.preventDefault();const msg=E.namedItem('msg').value.trim();
    if(msg.length<3){out(L_('Lütfen kısa bir açıklama yaz.','Please write a short description.'),'bad');return}
    let last=0;try{last=+(localStorage.getItem('edt_fb_last')||0)}catch(e){}
    if(Date.now()-last<15000){out(L_('Az önce gönderdin, birkaç saniye bekle.','You just sent one; wait a few seconds.'),'bad');return}
    const who=E.namedItem('who').value.trim();try{localStorage.setItem('edt_fb_name',who)}catch(e){}
    const p=Object.assign({},c,{ts:new Date().toISOString(),lang:LANG,category:E.namedItem('cat').value,message:msg,name:who,hp:E.namedItem('hp').value,
      url:location.href,ua:navigator.userAgent,viewport:innerWidth+'x'+innerHeight});
    const btn=f.querySelector('[type=submit]');btn.disabled=true;
    if(await postFeedback(p)){try{localStorage.setItem('edt_fb_last',String(Date.now()))}catch(e){}SFX.ok();
      out('✅ '+L_('Teşekkürler! Yorumun iletildi.','Thanks! Your comment was sent.'),'ok');setTimeout(close,1500)}
    else{fbSetQueue(fbQueue().concat([p]));btn.disabled=false;
      out(FEEDBACK_URL?L_('Şu an gönderilemedi; kaydedildi, sonra tekrar denenecek.','Could not send right now; saved and will be retried later.')
        :L_('Kaydedildi (sunucu ayarlanınca gönderilecek).','Saved (will be sent once the server is configured).'),'bad')}}}
$('#btnFb').onclick=openFeedback;$('#btnFbMap').onclick=openFeedback;
$('#btnLang').onclick=switchLang;$('#btnLangMap').onclick=switchLang;
flushFeedback();

  const pts=CHAPTERS.map(c=>[c.pos[0]*10,c.pos[1]*8.2]);
  let path=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];const mx=(x0+x1)/2;path+=` C${mx},${y0} ${mx},${y1} ${x1},${y1}`}
  const tree=(x,y,s=1)=>`<g transform="translate(${x},${y}) scale(${s})"><rect x="-5" y="10" width="10" height="22" rx="4" fill="#c99a6b"/><circle cx="0" cy="0" r="22" fill="#8fdcae"/><circle cx="-12" cy="8" r="14" fill="#7ad09d"/><circle cx="12" cy="8" r="14" fill="#7ad09d"/><circle cx="-6" cy="-6" r="6" fill="#b6ecc9"/></g>`;
  const house=(x,y,c)=>`<g transform="translate(${x},${y})"><rect x="-22" y="-10" width="44" height="34" rx="6" fill="${c}"/><path d="M-28,-8 L0,-34 L28,-8Z" fill="#ff9fcb"/><rect x="-6" y="6" width="12" height="18" rx="3" fill="#fff"/><circle cx="-13" cy="2" r="4" fill="#fff"/><circle cx="13" cy="2" r="4" fill="#fff"/></g>`;
  const chip=(x,y)=>`<g transform="translate(${x},${y})"><rect x="-20" y="-14" width="40" height="28" rx="6" fill="#b8a8f0"/>${[-12,-4,4,12].map(d=>`<line x1="${d}" y1="-14" x2="${d}" y2="-22" stroke="#b8a8f0" stroke-width="3"/><line x1="${d}" y1="14" x2="${d}" y2="22" stroke="#b8a8f0" stroke-width="3"/>`).join('')}<circle cx="-8" cy="-2" r="3" fill="#fff"/><circle cx="8" cy="-2" r="3" fill="#fff"/><path d="M-6,6 Q0,10 6,6" stroke="#fff" stroke-width="2" fill="none"/></g>`;
  box.innerHTML=`<svg viewBox="0 0 1000 820" preserveAspectRatio="none">
   <defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf7ff"/><stop offset="1" stop-color="#fdf0fa"/></linearGradient></defs>
   <rect width="1000" height="820" rx="40" fill="url(#gr)"/>
   <path d="M0,730 C200,680 350,780 520,730 S850,690 1000,740 L1000,820 L0,820Z" fill="#d9f5e4"/>
   <path d="M0,120 C150,80 260,160 420,110" stroke="#fff" stroke-width="22" fill="none" stroke-linecap="round" opacity=".7"/>
   <path d="M600,80 C700,40 820,110 980,70" stroke="#fff" stroke-width="18" fill="none" stroke-linecap="round" opacity=".7"/>
   ${tree(60,782,.8)}${tree(250,772,1)}${tree(292,792,.7)}${tree(470,780,1.1)}${tree(690,778,.9)}${tree(733,796,.7)}${tree(905,780,1)}${tree(975,730,.75)}
   ${house(160,782,'#ffe08a')}${house(590,786,'#9fd8ff')}${house(820,790,'#ffd3e6')}${chip(975,270)}${chip(30,270)}${chip(975,520)}${chip(30,560)}
   <path d="${path}" stroke="#fff" stroke-width="26" fill="none" stroke-linecap="round"/>
   <path d="${path}" stroke="#c9b9f5" stroke-width="6" fill="none" stroke-dasharray="2 16" stroke-linecap="round"/>
  </svg>`+CHAPTERS.map(c=>{const s=(p[c.id]||{}).stars||0;return `<button class="stop${c.soon?' soonstop':''}" data-c="${c.id}" style="left:${c.pos[0]}%;top:${c.pos[1]}%">
    <div class="disc" style="${s?'border-color:#ffe08a':''}">${c.icon}</div><div class="lbl">${c.title}<small>${c.sub}</small></div>
    ${c.soon?'<div class="stars soonDots">• • •</div>':`<div class="stars">${[1,2,3].map(i=>i<=s?'<b>★</b>':'★').join('')}</div>`}</button>`}).join('');
  box.querySelectorAll('.stop').forEach(b=>b.onclick=()=>{SFX.click();openChapter(b.dataset.c)});
}
$('#resetProg').onclick=()=>{if(confirm(L_('Tüm yıldızlar silinsin mi?',`Delete all stars?`))){localStorage.removeItem(SAVE);renderMap()}};

{const m=location.hash.match(/^#(c\d+)(?:-(\d+))?$/);if(m&&CHAPTERS.find(c=>c.id===m[1])){openChapter(m[1]);if(m[2]){SI=Math.min(+m[2],CH.steps.length-1);renderStep()}}}
